of the preceding element","Any single character that is not a digit","Start of the line (outside brackets)"],"a":[0,1,2,3,4],"e":"Le piège : `^` veut dire **début de ligne** hors crochets, mais **négation** quand il est le premier caractère *dans* des crochets. `.` = un caractère quelconque, `\\d` = chiffre, `\\w` = caractère de mot, `\\s` = espace, `{n,m}` = répétition bornée.","id":"4-050","d":4},{"t":"s","ref":"4.10","q":"Which log line is matched by the regular expression ^(GET|POST)\\s/admin ?","o":["HEAD /admin HTTP/1.1","POST /admin/login.php HTTP/1.1","GET /index.html?next=/admin HTTP/1.1","GET /admin HTTP/1.1"],"a":[1],"e":"La ligne doit **commencer** (`^`) par GET ou POST, suivi d'**un** caractère d'espacement (`\\s`), puis `/admin`. `HEAD` n'est pas dans le groupe. Dans la 3e, `/admin` n'est pas juste après la méthode. La 4e commence par une espace, donc `^` échoue.","id":"4-051","d":4},{"t":"d","ref":"5.1","q":"Drag and drop each management concept onto its description.","l":["Keeping an accurate inventory of hardware and software, with owner and location","Defining approved baselines and controlling changes so that systems do not drift from them","Enforcing a passcode, encrypting storage and remotely wiping lost smartphones","Acquiring, testing, deploying and verifying vendor fixes","Continuously discovering, prioritizing, assessing and remediating weaknesses"],"r":["Asset management","Configuration management","Mobile device management","Patch management","Vulnerability management"],"a":[0,1,2,3,4],"e":"Un verbe par concept : **Asset** = inventorier, **Configuration** = maîtriser la baseline, **MDM** = piloter les mobiles, **Patch** = corriger, **Vulnerability** = trouver et prioriser les failles. Le patch n'est qu'**une des réponses** possibles du vulnerability management (sinon : contrôle compensatoire, acceptation du risque).","trap":"On ne protège pas ce qu'on ne connaît pas : l'asset management est le socle des quatre autres.","id":"5-001","d":5},{"t":"s","ref":"5.1","q":"Which step immediately follows Remediate in the vulnerability management life cycle?","o":["Report","Verify","Discover","Prioritize assets"],"a":[1],"e":"Cycle en 6 étapes : Discover → Prioritize assets → Assess → Report → Remediate → **Verify**. On rescanne pour prouver que la correction a bien supprimé la faille, puis le cycle repart.","trap":"Report vient **avant** Remediate : on mesure et on documente le risque, ensuite on corrige.","id":"5-002","d":5},{"t":"s","ref":"5.1","q":"A sales manager reports that her company smartphone, which stores customer contracts, was stolen at an airport. Which capability lets the security team protect the data immediately?","o":["Blocking the phone's MAC address on the corporate Wi-Fi","A remote wipe issued from the MDM platform","Removing the phone from the asset inventory","Pushing the latest OS patch to the device"],"a":[1],"e":"Le **MDM** (Mobile Device Management) permet de verrouiller, localiser et **effacer à distance** un terminal perdu, et d'imposer chiffrement, code PIN et conformité. Bloquer le Wi-Fi ne protège pas les données déjà stockées sur l'appareil.","id":"5-003","d":5},{"t":"s","ref":"5.1","q":"Which patch management technique identifies devices that need patching by observing their traffic, without installing software on them and without scanning them?","o":["Agent-based patch management","Agentless scanning","Passive network monitoring","Configuration baselining"],"a":[2],"e":"Trois techniques : **agent-based** (un agent sur chaque hôte, idéal pour les nomades), **agentless scanning** (le serveur de patch scanne le réseau), **passive network monitoring** (on déduit les versions en écoutant le trafic, utile pour les équipements qu'on ne peut ni scanner ni équiper d'un agent).","id":"5-004","d":5},{"t":"s","ref":"5.1","q":"During an audit, a Linux server is found with SSH root login enabled, although the hardening standard forbids it and no change ticket exists. Which process is designed to detect and prevent this kind of drift?","o":["Asset management","Patch management","Configuration management","Mobile device management"],"a":[2],"e":"La **configuration management** définit une **baseline** approuvée, contrôle les changements et détecte les écarts (*configuration drift*). Outils typiques : Ansible, Puppet, Chef, SaltStack.","id":"5-005","d":5},{"t":"s","ref":"5.1","q":"During an incident, analysts find a compromised server that nobody can identify: no owner, no documentation, absent from every inventory. Which management process has failed?","o":["Asset management","Vulnerability management","Patch management","Configuration management"],"a":[0],"e":"Un serveur « fantôme » = échec de l'**asset management** : pas d'inventaire, donc pas de propriétaire, pas de patch, pas de supervision. Toutes les autres disciplines s'appuient sur cet inventaire.","id":"5-006","d":5},{"t":"m","ref":"5.2","q":"According to NIST SP 800-61, which two elements belong to the incident response plan? (Choose two.)","o":["Metrics for measuring the incident response capability and its effectiveness","Prioritization or severity ratings of incidents","Roadmap for maturing the incident response capability","Step-by-step technical checklists and forms for analysts","Definition of roles, responsibilities and levels of authority"],"a":[0,2],"e":"Le **plan** IR (800-61 §2.3.2) : mission, stratégies et objectifs, **approbation de la direction**, approche organisationnelle, **communication** de l'équipe IR avec le reste de l'organisation, **métriques**, **roadmap** de maturité, intégration dans l'organisation.","trap":"Severity ratings et rôles/autorité = **policy**. Checklists et formulaires = **procedures (SOP)**. Le plan, c'est la feuille de route du programme.","id":"5-007","d":5},{"t":"s","ref":"5.2","q":"Which NIST SP 800-61 document contains the statement of management commitment, the scope, and the definition of roles, responsibilities and levels of authority?","o":["Incident response plan","Incident response policy","Standard operating procedures","Lessons learned report"],"a":[1],"e":"La **policy** cadre : engagement de la direction, objectifs, périmètre, définitions, structure organisationnelle et **niveaux d'autorité** (qui a le droit de débrancher un serveur ?), niveaux de sévérité, mesures de performance, formulaires de signalement.","id":"5-008","d":5},{"t":"s","ref":"5.2","q":"According to NIST SP 800-61, what do standard operating procedures (SOPs) contain?","o":["The mission, strategies and goals of the incident response program","The statement of management commitment","The specific technical processes, techniques, checklists and forms used by the incident response team","The service level agreements negotiated with internet service providers"],"a":[2],"e":"Les **SOP** sont le niveau opérationnel : processus techniques, checklists, formulaires. Elles doivent être complètes, **testées** et enseignées à l'équipe, pour limiter les erreurs sous stress.","trap":"Hiérarchie à retenir : **Policy** (le cadre) → **Plan** (la feuille de route) → **Procedures** (le pas à pas).","id":"5-009","d":5},{"t":"s","ref":"5.2","q":"A multinational company runs one incident response team per region. Each team handles the incidents of its own segment, and all teams are part of a single coordinated entity. Which NIST SP 800-61 team model is this?","o":["Central incident response team","Distributed incident response teams","Coordinating team","Fully outsourced team"],"a":[1],"e":"**Central** = une seule équipe pour toute l'organisation. **Distributed** = plusieurs équipes par zone ou entité, coordonnées pour rester cohérentes. **Coordinating team** = une équipe qui **conseille** d'autres équipes sans avoir autorité sur elles.","trap":"« Fully outsourced » est un modèle de **staffing** (employees, partially outsourced, fully outsourced), pas une structure d'équipe.","id":"5-010","d":5},{"t":"s","ref":"5.2","q":"Which item is an element of the incident response plan rather than of the incident response policy?","o":["Definition of computer security incidents and related terms","Organizational structure and levels of authority","How the incident response team will communicate with the rest of the organization and with other organizations","Reporting and contact forms"],"a":[2],"e":"La façon dont l'équipe IR **communique** (en interne et vers l'extérieur) fait partie du **plan**, tout comme la mission, l'approbation de la direction, les métriques et la roadmap. Les trois autres propositions sont des éléments de la **policy**.","id":"5-011","d":5},{"t":"s","ref":"5.3","q":"Several alerts confirm that ransomware on one workstation is encrypting files on SMB shares and spreading. According to the NIST SP 800-61 process, which action should the analyst take first?","o":["Reimage the workstation and restore the user's files","Isolate the workstation from the network to contain the spread","Schedule a lessons learned meeting with management","Power off every file server in the company"],"a":[1],"e":"Incident confirmé = on passe à **Containment** : isoler l'hôte (VLAN de quarantaine, port shutdown, isolation EDR) pour stopper la propagation **tout en préservant les preuves**. Réinstaller = eradication/recovery, trop tôt et destructeur de preuves.","trap":"Éteindre l'hôte détruit la mémoire vive (clés de chiffrement, processus, connexions). On isole du réseau, on n'arrache pas l'alimentation.","id":"5-012","d":5},{"t":"s","ref":"5.3","q":"After containing an intrusion, the team deletes the web shell, disables the two breached accounts and mitigates the vulnerability that was exploited. Which NIST SP 800-61 activity is this?","o":["Containment","Eradication","Recovery","Post-incident activity"],"a":[1],"e":"**Eradication** = supprimer les composants de l'incident : malware, comptes compromis, et **corriger toutes les vulnérabilités exploitées**. Il faut identifier tous les hôtes touchés pour ne rien laisser derrière.","id":"5-013","d":5},{"t":"s","ref":"5.3","q":"Which action is part of the recovery step of the NIST SP 800-61 incident response life cycle?","o":["Disconnecting the infected host from the switch","Deleting the malware found on the infected hosts","Restoring systems from clean backups and confirming that they function normally","Reviewing what went wrong in a formal meeting"],"a":[2],"e":"**Recovery** = retour à la normale : restauration depuis des sauvegardes saines, reconstruction, patchs, changement des mots de passe, durcissement du périmètre, puis **surveillance renforcée**. Dans l'ordre des propositions : containment, eradication, recovery, post-incident.","trap":"Mnémo **CER** : **C**ontenir (stopper), **E**radiquer (nettoyer), **R**établir (remettre en prod).","id":"5-014","d":5},{"t":"m","ref":"5.3","q":"According to NIST SP 800-61, which two criteria help determine the appropriate containment strategy? (Choose two.)","o":["Need for evidence preservation","The suspected nationality of the attacker","Duration of the solution (emergency workaround, temporary or permanent)","The original purchase price of the affected hardware","The number of alerts that the SIEM generated that day"],"a":[0,2],"e":"Critères 800-61 : dommages potentiels et vol de ressources, **préservation des preuves**, **disponibilité du service**, temps et ressources nécessaires, **efficacité** (confinement partiel ou total) et **durée de la solution**.","id":"5-015","d":5},{"t":"s","ref":"5.3","q":"An incident handler redirects an attacker to a sandbox in order to observe the attacker's activity and gather additional evidence. How does NIST SP 800-61 classify this action?","o":["As a form of containment","As a form of eradication","As a recovery activity","As a preparation activity"],"a":[0],"e":"Rediriger l'attaquant vers un **sandbox** est une stratégie de **containment** : on limite les dégâts tout en collectant des preuves.","trap":"Le NIST met en garde : retarder volontairement le confinement pour observer est risqué (l'attaquant peut escalader) et engage la responsabilité de l'organisation. À valider avec le **juridique**.","id":"5-016","d":5},{"t":"m","ref":"5.3","q":"According to NIST SP 800-61, which three factors should be used to prioritize the handling of an incident? (Choose three.)","o":["Functional impact of the incident","The order in which the incidents were reported","Information impact of the incident","Recoverability from the incident","The seniority of the person who reported the incident"],"a":[0,2,3],"e":"Trois axes : **Functional impact** (effet sur les services métier), **Information impact** (confidentialité et intégrité des données), **Recoverability** (temps et ressources pour s'en remettre).","trap":"Le NIST est explicite : **pas de « premier arrivé, premier servi »**.","id":"5-017","d":5},{"t":"s","ref":"5.3","q":"An investigation shows that customers' personally identifiable information was accessed and exfiltrated. Which NIST SP 800-61 information impact category applies?","o":["Proprietary breach","Privacy breach","Integrity loss","Extended recoverability"],"a":[1],"e":"Catégories d'**information impact** : None, **Privacy breach** (PII accédée ou exfiltrée), **Proprietary breach** (informations propriétaires non classifiées), **Integrity loss** (données modifiées ou supprimées).","trap":"« Extended » appartient à l'échelle de **recoverability** (Regular, Supplemented, Extended, Not recoverable), pas à l'information impact.","id":"5-018","d":5},{"t":"d","ref":"5.4","q":"Drag and drop each activity onto the matching phase of the NIST SP 800-61 incident response life cycle.","l":["Training the CSIRT and preparing a forensic jump kit","Running periodic risk assessments and user awareness sessions","Correlating logs to confirm that an incident has occurred and determining its scope","Isolating an infected network segment while acquiring evidence","Rebuilding servers from clean media and monitoring them closely","Holding a lessons learned meeting and updating the playbooks"],"r":["Preparation","Detection and analysis","Containment, eradication and recovery","Post-incident activity"],"a":[0,0,1,2,2,3],"e":"Mnémo **P-D-C-P** : **P**reparation (inclut la **prévention**), **D**etection and analysis, **C**ontainment/eradication/recovery, **P**ost-incident activity. Le cycle boucle : le retour d'expérience alimente la préparation, et on fait souvent des allers-retours entre détection et confinement.","trap":"La collecte de preuves (*evidence gathering and handling*) est rangée par le NIST dans **Containment, eradication and recovery**, pas dans Detection.","id":"5-019","d":5},{"t":"s","ref":"5.4","q":"Web server logs show that an external IP address ran a vulnerability scanner against the company portal. No exploitation was observed. How does NIST SP 800-61 classify this sign?","o":["Precursor","Indicator","True negative","Post-incident evidence"],"a":[0],"e":"**Precursor** = signe qu'un incident **pourrait** se produire (scan, menace annoncée, nouvel exploit publié). **Indicator** = signe qu'un incident **s'est produit ou est en cours** (alerte AV, échecs de connexion en rafale, trafic anormal).","trap":"Les precursors sont rares. La grande majorité des signes observés par un SOC sont des indicators.","id":"5-020","d":5},{"t":"d","ref":"5.4","q":"Drag and drop each sign of an incident onto its NIST SP 800-61 category.","l":["A threat group announces on a forum that it will attack the organization","A vendor advisory describes a new exploit for the mail server version in use","Antivirus software alerts that a host is infected with malware","An application logs multiple failed login attempts from an unfamiliar remote system","A network administrator notices an unusual deviation from typical traffic flows"],"r":["Precursor","Indicator"],"a":[0,0,1,1,1],"e":"**Precursor = avant** (ça pourrait arriver). **Indicator = pendant ou après** (c'est arrivé ou ça arrive). Ce sont les exemples du NIST lui-même.","id":"5-021","d":5},{"t":"s","ref":"5.4","q":"In which phase of the NIST SP 800-61 life cycle does the organization decide how long incident evidence must be retained?","o":["Preparation","Detection and analysis","Containment, eradication and recovery","Post-incident activity"],"a":[3],"e":"**Post-incident activity** regroupe : lessons learned, exploitation des données collectées sur l'incident (métriques) et **evidence retention**. Critères de durée : poursuites judiciaires possibles, politique de rétention des données, coût du stockage.","id":"5-022","d":5},{"t":"s","ref":"5.4","q":"According to the attack vectors listed in NIST SP 800-61, how is a brute-force attack against an authentication service categorized?","o":["Impersonation","Improper usage","Attrition","Web"],"a":[2],"e":"**Attrition** = attaque par **force brute** visant à compromettre, dégrader ou détruire : brute force de mots de passe, DDoS.","trap":"Piège de vocabulaire : « attrition » ne ressemble pas à « brute force ». Pense **usure**.","id":"5-023","d":5},{"t":"d","ref":"5.4","q":"Drag and drop each example onto the matching NIST SP 800-61 attack vector.","l":["Malicious code spreading from an infected USB flash drive","A DDoS attack intended to impair access to a service","A redirect to a site that exploits a browser vulnerability","An authorized user performs illegal activities on a company system","A rogue wireless access point or a man-in-the-middle attack"],"r":["External/removable media","Attrition","Web","Improper usage","Impersonation","Email","Loss or theft of equipment"],"a":[0,1,2,3,4],"e":"Vecteurs 800-61 : External/removable media, **Attrition** (force brute, DDoS), Web, Email, **Impersonation** (spoofing, MITM, rogue AP, et même injection SQL selon le NIST), **Improper usage** (violation de la charte par un utilisateur autorisé), Loss or theft of equipment, Other.","id":"5-024","d":5},{"t":"s","ref":"5.4","q":"A user reports a suspicious email. The analyst confirms that the attachment is malicious, finds that three other users received it and checks whether anyone opened it. Which NIST SP 800-61 phase is the analyst performing?","o":["Preparation","Detection and analysis","Containment, eradication and recovery","Post-incident activity"],"a":[1],"e":"Valider l'incident et en déterminer le **périmètre** (qui d'autre, quoi, comment) = **Detection and analysis**. On y trouve aussi la documentation, la **priorisation** et la **notification**. Le confinement démarre ensuite (purge des boîtes, blocage du hash et de l'expéditeur).","id":"5-025","d":5},{"t":"d","ref":"5.5","q":"Drag and drop each stakeholder onto its role during incident response.","l":["Reviews plans and policies for compliance and advises on prosecution, evidence collection and lawsuits","Applies disciplinary measures when an employee caused the incident","Informs the press and the public when customer data has been compromised","May be asked to change firewall rules during containment or recovery","Adjusts continuity plans and risk assessments according to the incident's impact"],"r":["Legal department","Human resources","Public affairs and media relations","Information assurance","Business continuity planners","Physical security and facilities management"],"a":[0,1,2,3,4],"e":"Parties prenantes (NIST 800-61, reprises par Cisco) : Management, **Information assurance**, **IT support**, **Legal**, **Public affairs/media relations**, **Human resources**, **Business continuity planners**, **Physical security and facilities management**.","id":"5-026","d":5},{"t":"s","ref":"5.5","q":"Which stakeholder group understands the organization's technology best and is therefore the most likely to take the correct action to minimize the effectiveness of an attack or to preserve evidence properly?","o":["Management","IT support","Human resources","Public affairs and media relations"],"a":[1],"e":"**IT support** : les sysadmins et techniciens connaissent l'environnement. Ils savent quoi isoler, quoi préserver, et quelles sont les conséquences d'une action de confinement.","id":"5-027","d":5},{"t":"s","ref":"5.5","q":"Which stakeholder creates the policies, controls the budget and staffing, and must coordinate the incident response with the other stakeholders to minimize the damage?","o":["Information assurance","Legal department","Management","Business continuity planners"],"a":[2],"e":"**Management** : définit les politiques, alloue budget et effectifs, **approuve le plan IR**, et coordonne la réponse avec les autres parties prenantes.","id":"5-028","d":5},{"t":"s","ref":"5.5","q":"An intruder tailgated an employee into the data center and connected a rogue device. Which stakeholder must be involved, both for this attack vector and to secure the facilities that hold the evidence?","o":["Human resources","Public affairs and media relations","Information assurance","Physical security and facilities management"],"a":[3],"e":"**Physical security and facilities management** : impliqués dès qu'il y a une composante physique (tailgating, shoulder surfing, vol de matériel) et responsables de **sécuriser les locaux contenant des preuves**.","id":"5-029","d":5},{"t":"s","ref":"5.5","q":"What is the purpose of the Cybersecurity Maturity Model Certification (CMMC)?","o":["To certify the secure coding practices of open-source projects","To assess and certify the cybersecurity maturity of organizations that work in the U.S. Department of Defense supply chain","To score the severity of software vulnerabilities from 0 to 10","To define a standard format for sharing threat intelligence"],"a":[1],"e":"Le **CMMC** évalue la capacité des sous-traitants du **DoD américain** (Defense Industrial Base) à protéger les informations sensibles. Il comporte un domaine **Incident Response**. Version 1.0 : 17 domaines et 5 niveaux. Version 2.0 : 3 niveaux alignés sur NIST SP 800-171.","trap":"Score de 0 à 10 = **CVSS**. Format de partage de threat intel = **STIX**.","id":"5-030","d":5},{"t":"d","ref":"5.5","q":"Drag and drop each CMMC incident response capability onto the NIST SP 800-61 phase it maps to.","l":["Plan incident response","Test incident response","Detect and report events","Develop and implement a response to a declared incident","Perform post-incident reviews"],"r":["Preparation","Detection and analysis","Containment, eradication and recovery","Post-incident activity"],"a":[0,0,1,2,3],"e":"Le domaine IR du CMMC liste 5 capacités. Le blueprint demande de savoir les **projeter sur les phases du NIST 800-61** : planifier et tester = Preparation, détecter et signaler = Detection and analysis, répondre = Containment/eradication/recovery, revue = Post-incident.","id":"5-031","d":5},{"t":"d","ref":"5.6","q":"Drag and drop each description onto the matching phase of the NIST SP 800-86 forensic process.","l":["Identify, label, record and acquire data from the possible sources while preserving its integrity","Process the collected data with automated and manual methods to extract the data of particular interest","Use legally justifiable methods to derive information that answers the questions behind the investigation","Describe the actions performed, the tools and procedures selected, and recommend improvements"],"r":["Collection","Examination","Analysis","Reporting"],"a":[0,1,2,3],"e":"Mnémo **CEAR** : **C**ollection → **E**xamination → **A**nalysis → **R**eporting. Examination = **trier et extraire**. Analysis = **interpréter et conclure**.","trap":"Ne pas confondre avec les 4 phases du **800-61** (réponse à incident). 800-**86** = forensic.","id":"5-032","d":5},{"t":"s","ref":"5.6","q":"A responder must collect evidence from a running, compromised server. According to the order of volatility, which data should be collected first?","o":["The contents of the hard disk","The contents of CPU registers, cache and RAM","The logs stored on a remote syslog server","The weekly backup tapes"],"a":[1],"e":"Du **plus volatil au moins volatil** : registres et cache CPU → table de routage, cache ARP, table des processus, **RAM** → fichiers temporaires et swap → **disque** → logs distants et données de supervision → configuration physique et topologie → **archives et sauvegardes**.","id":"5-033","d":5},{"t":"s","ref":"5.6","q":"Which sequence lists the evidence sources from the most volatile to the least volatile?","o":["Hard disk, RAM, ARP cache, backup tapes","ARP cache and RAM, temporary file systems, hard disk, archival media","Archival media, hard disk, temporary file systems, RAM","Temporary file systems, RAM, archival media, hard disk"],"a":[1],"e":"Ordre de volatilité (RFC 3227, repris par Cisco) : mémoire et caches → fichiers temporaires → disque → logs distants → archives. Logique : on collecte d'abord ce qui **disparaît en premier**.","id":"5-034","d":5},{"t":"s","ref":"5.6","q":"What is the purpose of a hardware write blocker during evidence acquisition?","o":["It encrypts the forensic image so that only the examiner can read it","It accelerates the copy of large disks","It allows the examiner to read the source media while preventing any modification to it","It removes malware from the source disk before imaging"],"a":[2],"e":"Le **write blocker** laisse passer les lectures et bloque toute écriture : l'original reste intact. Chaîne complète : write blocker → image bit à bit → **hash** de l'original et de la copie → analyse **sur la copie** → original sous scellé avec sa chain of custody.","id":"5-035","d":5},{"t":"s","ref":"5.6","q":"An analyst arrives at a powered-on workstation that is suspected of running fileless malware. Which action best preserves the evidence?","o":["Shut the system down cleanly, then image the disk","Pull the power cord immediately, then image the disk","Capture the contents of memory and other volatile data before powering the system off","Run a full antivirus scan to identify the malware first"],"a":[2],"e":"Un malware **fileless** vit en **RAM** : toute extinction le détruit, avec les connexions réseau, les processus et les clés en mémoire. On capture d'abord le volatil, ensuite seulement le disque.","trap":"Lancer un scan AV **modifie** le système (dates d'accès, fichiers mis en quarantaine) et peut détruire des preuves.","id":"5-036","d":5},{"t":"s","ref":"5.6","q":"Why should a responder run collection tools from trusted read-only media instead of using the commands installed on the compromised host?","o":["The installed commands are slower than forensic tools","The installed binaries may have been replaced or hooked by a rootkit and could return false results","Forensic tools do not require administrator rights","The installed commands cannot display network connections"],"a":[1],"e":"Sur un hôte compromis, `ps`, `netstat` ou `ls` peuvent être **trojanisés** par un rootkit pour masquer processus, connexions et fichiers. On apporte ses propres binaires de confiance (clé USB en lecture seule, toolkit forensic).","id":"5-037","d":5},{"t":"m","ref":"5.6","q":"Which two items are volatile data that would be lost if the system were powered off? (Choose two.)","o":["The list of established network connections","The master file table (MFT)","The contents of the ARP cache","The Windows event log files","The registry hive files stored on the system drive"],"a":[0,2],"e":"Volatile = n'existe qu'en **mémoire** : connexions réseau, sessions ouvertes, processus, cache ARP, table de routage, contenu de la RAM. MFT, journaux d'événements et ruches de registre sont des **fichiers sur disque** : ils survivent à l'extinction.","id":"5-038","d":5},{"t":"d","ref":"5.7","q":"Drag and drop each network profiling element onto its definition.","l":["The amount of data passing from a given source to a given destination in a given period of time","The time between the establishment of a data flow and its termination","The list of TCP or UDP processes that are available to accept data","The IP addresses or logical location of essential systems or data"],"r":["Total throughput","Session duration","Ports used","Critical asset address space"],"a":[0,1,2,3],"e":"Les 4 éléments du **network profile** selon Cisco. On les mesure sur une période représentative pour établir la **baseline**, puis on alerte sur les écarts.","trap":"Ne pas mélanger avec le **server profile** (5.8) : listening ports, logged-in users/service accounts, running processes, running tasks, applications.","id":"5-039","d":5},{"t":"s","ref":"5.7","q":"NetFlow records show a workstation keeping a single TCP session open to an external host for 14 hours, whereas the baseline for this network is a few minutes. Which network profiling element reveals the anomaly?","o":["Total throughput","Session duration","Ports used","Critical asset address space"],"a":[1],"e":"Une session anormalement longue = écart de **session duration** : tunnel, reverse shell, canal C2 persistant ou exfiltration lente.","id":"5-040","d":5},{"t":"s","ref":"5.7","q":"A database server normally sends about 2 GB per day to the backup server. Last night it sent 40 GB to an unknown external address. Which network profiling element is the primary indicator of this anomaly?","o":["Session duration","Ports used","Total throughput","Running processes"],"a":[2],"e":"Volume de données entre une source et une destination sur une période = **total throughput**. Un pic sortant hors baseline est un signal classique d'**exfiltration**.","trap":"« Running processes » appartient au **server** profile, pas au network profile.","id":"5-041","d":5},{"t":"s","ref":"5.7","q":"Why does a security team document the critical asset address space when profiling a network?","o":["To reserve IP addresses for future servers","To know where the essential systems and data reside so that traffic to and from them can be monitored and prioritized","To hide the critical servers from network scans","To reduce the size of the routing table"],"a":[1],"e":"Connaître l'espace d'adressage des **actifs critiques** permet de prioriser : une alerte touchant `10.10.20.0/24` (bases clients) ne pèse pas comme une alerte sur le Wi-Fi invité.","id":"5-042","d":5},{"t":"s","ref":"5.8","q":"The approved profile of a Linux web server lists TCP ports 22, 80 and 443. An analyst runs the commands shown in the exhibit. Which server profiling element reveals a deviation?","o":["Logged-in users","Listening ports","Applications","Total throughput"],"a":[1],"e":"Le port **31337** en écoute (processus `kworkerd` lancé depuis `/tmp`) ne fait pas partie du profil : écart sur les **listening ports**, probable backdoor (bind shell).","trap":"Un nom de processus qui imite un thread noyau (`kworker`) et qui s'exécute depuis `/tmp` est un classique de camouflage.","x":"$ sudo ss -tulpn\nNetid State  Local Address:Port   Process\ntcp   LISTEN 0.0.0.0:22           users:((\"sshd\",pid=812,fd=3))\ntcp   LISTEN 0.0.0.0:80           users:((\"nginx\",pid=1044,fd=6))\ntcp   LISTEN 0.0.0.0:443          users:((\"nginx\",pid=1044,fd=7))\ntcp   LISTEN 0.0.0.0:31337        users:((\"kworkerd\",pid=6120,fd=4))\n\n$ sudo ls -l /proc/6120/exe\nlrwxrwxrwx 1 root root 0 Sep 12 03:14 /proc/6120/exe -> /tmp/.x/kworkerd","id":"5-043","d":5},{"t":"m","ref":"5.8","q":"Which two elements are part of a server profile? (Choose two.)","o":["Total throughput","Listening ports","Session duration","Service accounts","Critical asset address space"],"a":[1,3],"e":"**Server profile** : listening ports, logged-in users/service accounts, running processes, running tasks, applications. Les trois autres propositions sont des éléments du **network profile**.","trap":"Question classique : l'exam mélange les deux listes. Réseau = **flux** (débit, durée, ports utilisés, adresses critiques). Serveur = **ce qui tourne dessus**.","id":"5-044","d":5},{"t":"s","ref":"5.8","q":"The service account svc_backup normally runs one scheduled job at 01:00 on the backup server. Logs show an interactive RDP logon with this account at 03:12 from a user workstation. Which server profiling element does this deviate from?","o":["Listening ports","Applications","Logged-in users and service accounts","Ports used"],"a":[2],"e":"Un **compte de service** n'ouvre pas de session interactive. Le profil décrit **qui** se connecte, **comment** et **quand** : tout écart (RDP, horaire, machine source) est suspect (vol d'identifiants, mouvement latéral).","id":"5-045","d":5},{"t":"s","ref":"5.8","q":"What is the purpose of a server profile in security monitoring?","o":["To benchmark the CPU against similar hardware","To establish the accepted operating state of a server so that deviations can be detected","To list the vulnerabilities found by the last scan","To document the physical location of the server in the rack"],"a":[1],"e":"Le **server profile** est une **baseline de sécurité** : ports en écoute attendus, comptes autorisés, processus, tâches et applications prévus. Tout ce qui sort du profil mérite une investigation.","id":"5-046","d":5},{"t":"d","ref":"5.9","q":"Drag and drop each data item onto the type of protected data it represents.","l":["A passport number together with a home address","MRI results linked to a patient's name","A username with its password and the answers to the security questions","The source code of an unreleased product"],"r":["PII","PHI","PSI","Intellectual property"],"a":[0,1,2,3],"e":"**PII** = identifie une personne. **PHI** = donnée de **santé** rattachée à une personne (sous-ensemble de la PII). **PSI** (personal security information) = identifiants, mots de passe, réponses secrètes. **Intellectual property** = secrets industriels, code source, brevets, plans.","id":"5-047","d":5},{"t":"s","ref":"5.9","q":"Which type of protected data includes usernames, passwords and other security-related information that individuals use to access services?","o":["PII","PHI","PSI","PCI"],"a":[2],"e":"**PSI** = Personal Security Information. Terme propre au cursus Cisco, à connaître tel quel.","trap":"PCI n'est pas un type de donnée mais un standard (PCI DSS) qui protège les **données de carte bancaire**.","id":"5-048","d":5},{"t":"s","ref":"5.9","q":"A spreadsheet lists patient names together with their diagnoses and lab results. Which classification is the most specific for this data?","o":["PII","PHI","PSI","Intellectual property"],"a":[1],"e":"Nom + information médicale = **PHI** (Protected Health Information), réglementée par **HIPAA** aux États-Unis. C'est aussi de la PII, mais la question demande la classification la **plus spécifique**.","trap":"Réflexe d'examen : quand deux réponses sont vraies, choisir la plus précise.","id":"5-049","d":5},{"t":"d","ref":"5.9","q":"Drag and drop each regulation or standard onto the data it primarily protects.","l":["PCI DSS","HIPAA","GDPR","SOX"],"r":["Payment cardholder data","Protected health information","Personal data of individuals in the European Union","Integrity of the financial reporting of publicly traded companies","Classified military information"],"a":[0,1,2,3],"e":"**PCI DSS** = cartes bancaires (standard de l'industrie, pas une loi). **HIPAA** = santé (US). **GDPR/RGPD** = données personnelles (UE). **SOX** = reporting financier des sociétés cotées (US).","id":"5-050","d":5},{"t":"s","ref":"5.9","q":"Refer to the exhibit. A proxy log shows this outbound request from an HR workstation. Which type of protected data is being exposed?","o":["PSI","Intellectual property","PII","PHI"],"a":[2],"e":"Nom, numéro de sécurité sociale (SSN), date de naissance, adresse : de la **PII**. En clair (HTTP) vers un domaine inconnu : exfiltration probable.","trap":"Pas de donnée médicale ici, donc pas PHI. Pas d'identifiants de connexion, donc pas PSI.","x":"1757666041.512  10.20.4.31 TCP_MISS/200 512 POST http://forms-sync.example.net/upload.php - DIRECT/203.0.113.77 text/html\n\nPOST /upload.php HTTP/1.1\nHost: forms-sync.example.net\nContent-Type: application/x-www-form-urlencoded\n\nfname=Julie&lname=Martin&ssn=078-05-1120&dob=1988-04-12&addr=12+rue+des+Lilas","id":"5-051","d":5},{"t":"d","ref":"5.10","q":"Drag and drop each attacker activity onto the matching phase of the Cyber Kill Chain.","l":["Harvesting employee names and email addresses from social networks","Embedding an exploit and a remote access trojan in a PDF document","Sending the PDF to the victims as an email attachment","The PDF reader vulnerability is triggered and the attacker's code runs","A backdoor is written to disk and a Run registry key is created for persistence","The compromised host beacons to an external server to receive instructions","Customer databases are compressed and exfiltrated"],"r":["Reconnaissance","Weaponization","Delivery","Exploitation","Installation","Command and control","Actions on objectives"],"a":[0,1,2,3,4,5,6],"e":"Les 7 phases (Lockheed Martin) : **R**econnaissance → **W**eaponization → **D**elivery → **E**xploitation → **I**nstallation → **C**ommand and control → **A**ctions on objectives. Mnémo : *Real Warriors Deliver Exploits, Install Control, Act*.","id":"5-052","d":5},{"t":"s","ref":"5.10","q":"An attacker uses a toolkit to combine a zero-day exploit with a backdoor payload inside a Word document. No one has been targeted yet. Which phase of the Cyber Kill Chain is this?","o":["Reconnaissance","Weaponization","Delivery","Exploitation"],"a":[1],"e":"**Weaponization** = fabrication de l'arme (exploit + payload), **côté attaquant**, donc invisible pour le défenseur. **Delivery** commence quand l'arme est transmise à la cible.","trap":"Indice dans l'énoncé : « no one has been targeted yet ».","id":"5-053","d":5},{"t":"s","ref":"5.10","q":"A user plugs in a USB flash drive found in the parking lot. At this point the malicious file has reached the workstation but has not been executed. Which Cyber Kill Chain phase has just been completed?","o":["Weaponization","Delivery","Exploitation","Installation"],"a":[1],"e":"**Delivery** = l'arme **arrive** chez la victime (email, site web, clé USB). **Exploitation** = elle se **déclenche** (vulnérabilité exploitée ou utilisateur qui exécute). **Installation** = elle **s'implante** (persistance).","trap":"Trio à bien séparer : Delivery (arrive) → Exploitation (s'exécute) → Installation (persiste).","id":"5-054","d":5},{"t":"s","ref":"5.10","q":"An EDR alert shows that a malicious process created a new Windows service and a scheduled task so that it survives reboots. Which Cyber Kill Chain phase does this represent?","o":["Exploitation","Installation","Command and control","Actions on objectives"],"a":[1],"e":"Persistance (service, tâche planifiée, clé Run, web shell, backdoor) = **Installation**.","id":"5-055","d":5},{"t":"s","ref":"5.10","q":"Proxy logs show a workstation sending a small HTTPS request to the same rare external domain every 60 seconds, day and night. Which Cyber Kill Chain phase does this behavior indicate?","o":["Delivery","Installation","Command and control","Reconnaissance"],"a":[2],"e":"Un **beacon** régulier vers l'extérieur = canal **C2** : l'implant vient chercher ses ordres. Détection : régularité des intervalles, domaines rares ou récents, volumes faibles et constants.","id":"5-056","d":5},{"t":"d","ref":"5.10","q":"An APT group sends a spear-phishing email from the domain mail-secure-login.example and drops a custom remote access trojan on the laptop of a finance director. Drag and drop each element onto the matching core feature of the Diamond Model.","l":["The APT group","The custom remote access trojan","The domain mail-secure-login.example and its mail server","The finance director and her laptop"],"r":["Adversary","Capability","Infrastructure","Victim","Methodology"],"a":[0,1,2,3],"e":"Diamond Model, 4 sommets (mnémo **ACIV**) : **A**dversary (qui), **C**apability (avec quoi : malware, exploit, technique), **I**nfrastructure (par où : IP, domaines, serveurs C2, comptes mail), **V**ictim (contre qui : personne, organisation, actif).","id":"5-057","d":5},{"t":"s","ref":"5.10","q":"Which statement describes how the Diamond Model represents an intrusion event?","o":["Seven sequential phases that an attacker must complete","An adversary deploys a capability over some infrastructure against a victim","A matrix of tactics and techniques observed in real attacks","A score from 0 to 10 based on exploitability and impact"],"a":[1],"e":"Le **Diamond Model** décrit chaque **événement** par 4 sommets reliés : l'adversaire utilise une capacité via une infrastructure contre une victime.","trap":"7 phases = Cyber Kill Chain. Matrice tactiques/techniques = MITRE ATT&CK. Score de 0 à 10 = CVSS.","id":"5-058","d":5},{"t":"s","ref":"5.10","q":"Which item is a meta-feature of the Diamond Model?","o":["Adversary","Capability","Direction","Victim"],"a":[2],"e":"Méta-caractéristiques : **Timestamp, Phase, Result, Direction, Methodology, Resources**. Exemple de Direction : infrastructure-to-victim, victim-to-infrastructure.","trap":"Adversary, Capability, Infrastructure et Victim sont les **core features** (les sommets), pas des meta-features.","id":"5-059","d":5},{"t":"s","ref":"5.10","q":"An analyst extracts a C2 domain from malware found on a victim's host, then searches the DNS logs and discovers two more internal hosts resolving the same domain. What is this Diamond Model technique called?","o":["Weaponization","Pivoting","Attribution","Normalization"],"a":[1],"e":"**Pivoting** (*analytic pivoting*) : partir d'un sommet connu (ici Capability → Infrastructure) pour découvrir les autres (nouvelles victimes, et peut-être l'adversaire). C'est la grande force du modèle.","id":"5-060","d":5},{"t":"s","ref":"5.10","q":"In the MITRE ATT&CK framework, what does a tactic represent?","o":["A specific tool used by a threat group","The adversary's technical goal, the reason for performing an action","A signature that detects a technique","The severity score of a technique"],"a":[1],"e":"ATT&CK : **Tactic = le pourquoi** (Initial Access, Persistence, Lateral Movement, Exfiltration...), **Technique = le comment** (T1566 Phishing, T1053 Scheduled Task...), Procedure = l'implémentation propre à un groupe. D'où l'acronyme **TTP**.","trap":"ATT&CK n'est pas nommé dans le blueprint, mais il complète la Kill Chain et le Diamond Model dans les cours Cisco.","id":"5-061","d":5},{"t":"d","ref":"5.11","q":"Drag and drop each SOC metric onto its definition.","l":["The length of time that threat actors have access to a network before they are detected and their access is stopped","The average time that it takes SOC personnel to identify that a valid security incident has occurred","The average time that it takes to stop and remediate a security incident","The time required to stop the incident from causing further damage to systems or data","The time required to stop the spread of malware in the network"],"r":["Dwell time","Mean time to detect (MTTD)","Mean time to respond (MTTR)","Mean time to contain (MTTC)","Time to control"],"a":[0,1,2,3,4],"e":"Les 5 métriques SOC du cursus Cisco. Deux repères : **MTTC = contenir l'incident** (éviter plus de dégâts), **Time to control = stopper la propagation du malware**.","trap":"Dans ce contexte, MTTR = mean time to **respond** (parfois *remediate*), pas *repair* comme en exploitation.","id":"5-062","d":5},{"t":"s","ref":"5.11","q":"Forensic analysis shows that an attacker first accessed the network on March 3. The intrusion was detected and the attacker's access was cut off on April 17. Which SOC metric describes this 45-day period?","o":["Mean time to respond","Time to control","Dwell time","Mean time to contain"],"a":[2],"e":"**Dwell time** = durée pendant laquelle l'attaquant a eu accès au réseau **avant d'être détecté et stoppé**. Plus il est long, plus le mouvement latéral et l'exfiltration ont eu le temps de se produire.","id":"5-063","d":5},{"t":"s","ref":"5.11","q":"Which SOC metric measures the time required to stop the spread of malware in the network?","o":["Dwell time","Mean time to detect","Time to control","Mean time to respond"],"a":[2],"e":"**Time to control** : temps nécessaire pour **stopper la propagation** d'un malware dans le réseau.","id":"5-064","d":5},{"t":"s","ref":"5.11","q":"A SOC manager wants to know how long, on average, it takes the team to stop and remediate a security incident. Which metric should be tracked?","o":["MTTD","MTTR","Dwell time","Session duration"],"a":[1],"e":"**MTTR** (mean time to respond) = temps moyen pour **stopper et remédier**. **MTTD** = temps moyen pour **identifier** qu'un incident valide a eu lieu.","trap":"Session duration est un élément de **network profiling** (5.7), pas une métrique SOC.","id":"5-065","d":5},{"t":"s","ref":"5.11","q":"How does a long time to detect affect the scope analysis of an incident?","o":["The scope is smaller because most of the logs have already been rotated","The scope is usually larger because the attacker had more time to move laterally and to access more systems and data","The scope is unaffected because it only depends on the malware family","The scope only concerns the first compromised host"],"a":[1],"e":"Lien métriques ↔ **scope** : plus la détection est tardive, plus il y a d'hôtes, de comptes et de données à examiner. Et la **rétention des logs** devient critique : si l'intrusion date de 6 mois et que les logs couvrent 30 jours, une partie du périmètre sera impossible à établir.","id":"5-066","d":5}],"cards":[{"d":1,"t":"CIA triad","f":"Les 3 objectifs de la sécurité : **Confidentiality** (chiffrement, contrôle d'accès), **Integrity** (hash, signature), **Availability** (redondance, sauvegardes).","c":"Non-repudiation et AAA n'en font pas partie.","r":0,"id":"c-001"},{"d":1,"t":"Threat","f":"Danger **potentiel** pour un actif : un acteur ou un événement capable de causer un dommage.","c":"Vulnerability = la faiblesse. Exploit = le moyen. Risk = probabilité × impact.","r":1,"id":"c-002"},{"d":1,"t":"Vulnerability","f":"**Faiblesse** dans un système, sa conception ou sa configuration, qu'une menace peut exploiter.","c":"Attack surface = la somme de tous les points exposés, pas une faiblesse précise.","r":1,"id":"c-003"},{"d":1,"t":"Exploit","f":"Code ou technique qui **tire parti** d'une faiblesse précise pour obtenir un effet non prévu.","c":"Le payload est ce qui est déposé **après** l'exploitation.","r":1,"id":"c-004"},{"d":1,"t":"Risk","f":"**Probabilité** qu'une menace exploite une faiblesse, multipliée par l'**impact**.","c":"4 traitements : avoidance, reduction (mitigation), sharing/transfer (assurance), retention/acceptance.","r":1,"id":"c-005"},{"d":1,"t":"Threat intelligence (TI)","f":"Connaissance **exploitable** sur les menaces : IoC, TTP, acteurs, campagnes. Sert à alimenter les défenses.","c":"Threat hunting = on cherche activement chez soi. TI = on s'informe sur ce qui existe dehors.","r":1,"id":"c-006"},{"d":1,"t":"Threat hunting","f":"Recherche **proactive**, guidée par une hypothèse, de menaces déjà présentes dans son réseau et passées sous les radars.","c":"Ce n'est pas attendre une alerte : le point de départ est une hypothèse, pas un événement.","r":1,"id":"c-007"},{"d":1,"t":"Run book automation (RBA)","f":"Exécution **automatisée** des procédures documentées du SOC (enrichissement, blocage, ticket). C'est le moteur des playbooks SOAR.","c":"Runbook = la procédure écrite. RBA = son automatisation.","r":1,"id":"c-008"},{"d":1,"t":"Reverse engineering","f":"**Désassembler** un malware ou un binaire pour comprendre son fonctionnement interne sans disposer du code source.","c":"Malware analysis est plus large : statique + dynamique (sandbox).","r":1,"id":"c-009"},{"d":1,"t":"Sliding window anomaly detection","f":"Détection d'anomalies où la **baseline est recalculée sur une fenêtre de temps glissante**, pour suivre les variations normales (heure, jour).","r":1,"id":"c-010"},{"d":1,"t":"Threat modeling","f":"Démarche structurée, dès la **conception**, pour identifier les menaces qui pèsent sur un système et prioriser les contre-mesures (ex : STRIDE).","c":"Risk assessment = évaluation globale du risque. Ici on se centre sur une application ou une architecture.","r":1,"id":"c-011"},{"d":1,"t":"DevSecOps","f":"Intégrer la sécurité **dans le pipeline CI/CD** (SAST, DAST, scan d'images, détection de secrets) au lieu de la traiter en fin de projet : *shift left*.","r":1,"id":"c-012"},{"d":1,"t":"Defense in depth","f":"Empiler des **couches de contrôles indépendantes** (physique, réseau, hôte, application, données) : si une couche tombe, la suivante tient.","c":"Modèles Cisco : security onion (couches) et security artichoke (on effeuille pour atteindre le cœur).","r":1,"id":"c-013"},{"d":1,"t":"Principle of least privilege","f":"Donner à chaque utilisateur ou processus **uniquement les droits nécessaires** à sa tâche, pas plus.","c":"Separation of duties = répartir une tâche sensible entre plusieurs personnes.","r":1,"id":"c-014"},{"d":1,"t":"Discretionary access control (DAC)","f":"Le **propriétaire** de la ressource décide qui y accède (ACL NTFS, chmod).","c":"MAC : c'est le système qui impose, via des labels.","r":1,"id":"c-015"},{"d":1,"t":"Mandatory access control (MAC)","f":"Accès imposé par le **système** selon des **labels** de sensibilité et des niveaux d'habilitation (militaire, SELinux).","c":"DAC : le propriétaire décide.","r":1,"id":"c-016"},{"d":1,"t":"Role-based access control (RBAC)","f":"Droits attribués selon la **fonction** (métier) de l'utilisateur. Forme courante de *nondiscretionary access control*.","c":"Rule-based = règles type ACL ou firewall. Même sigle, sens différent.","r":1,"id":"c-017"},{"d":1,"t":"Attribute-based access control (ABAC)","f":"Décision d'accès calculée à partir de **caractéristiques** : utilisateur, ressource, environnement (heure, lieu, type d'appareil).","c":"Time-based = cas particulier fondé uniquement sur l'horaire.","r":1,"id":"c-018"},{"d":1,"t":"AAA","f":"**Authentication** (qui es-tu), **Authorization** (qu'as-tu le droit de faire), **Accounting** (qu'as-tu fait).","c":"RADIUS : UDP 1812/1813, chiffre seulement le mot de passe. TACACS+ : TCP 49, chiffre tout, sépare les 3 A.","r":0,"id":"c-019"},{"d":1,"t":"CVSS metric groups (v3.x)","f":"**Base** (intrinsèque, fixe), **Temporal** (évolue : exploit disponible, correctif), **Environmental** (propre à ton organisation).","c":"CVSS 4.0 : Temporal devient Threat, Scope disparaît. L'exam reste en v3.x.","r":0,"id":"c-020"},{"d":1,"t":"CVSS base metrics","f":"Exploitabilité : **AV** (Network, Adjacent, Local, Physical), **AC**, **PR**, **UI**. Puis **Scope** et impacts **C, I, A**.","c":"Scope = l'exploitation touche-t-elle un composant **au-delà** du composant vulnérable (ex : évasion de VM).","r":0,"id":"c-021"},{"d":1,"t":"5-tuple","f":"Source IP, destination IP, source port, destination port, **protocol**. Identifie un flux de façon unique et sert de clé de corrélation entre logs.","r":1,"id":"c-022"},{"d":1,"t":"Rule-based vs behavioral vs statistical detection","f":"**Rule-based** = signatures connues (peu de faux positifs, aveugle au zero-day). **Behavioral** = écart de comportement. **Statistical** = écart par rapport à une distribution ou une baseline chiffrée.","r":0,"id":"c-023"},{"d":1,"t":"SIEM vs SOAR","f":"**SIEM** = collecte, normalise, corrèle, alerte (*voir*). **SOAR** = orchestre les outils, exécute des playbooks, gère les cas (*agir*).","c":"Log management = stocker et chercher, sans corrélation temps réel.","r":0,"id":"c-024"},{"d":1,"t":"Agent-based vs agentless","f":"**Agent** = visibilité profonde sur l'hôte (processus, fichiers, mémoire), mais à déployer partout. **Agentless** = couverture large via réseau, API, SNMP, avec moins de profondeur.","r":0,"id":"c-025"},{"d":1,"t":"Cisco Talos","f":"Équipe de **threat intelligence** de Cisco : alimente en signatures, réputation et IoC les produits Cisco Secure et Snort.","r":1,"id":"c-026"},{"d":2,"t":"Attack surface","f":"**Somme de tous les points** par lesquels un attaquant peut tenter d'entrer ou d'extraire des données (ports, applis, utilisateurs, API).","c":"Vulnerability = une faiblesse précise. On réduit la surface, on corrige une vulnérabilité.","r":1,"id":"c-027"},{"d":2,"t":"Full packet capture","f":"Copie **intégrale** des paquets, payload compris (pcap). Détail maximal, stockage énorme. *L'enregistrement de l'appel.*","c":"NetFlow = la facture téléphonique : qui, quand, combien, mais pas le contenu.","r":1,"id":"c-028"},{"d":2,"t":"Session data","f":"**Résumé d'une conversation** entre deux hôtes : 5-tuple, volumes, durée, horodatage (ex : conn.log de Zeek).","c":"Transaction data = le détail des requêtes et réponses **à l'intérieur** de la conversation.","r":1,"id":"c-029"},{"d":2,"t":"Transaction data","f":"**Requêtes et réponses** échangées pendant une session : GET HTTP, requête DNS, commande SMTP. Vient des logs applicatifs, proxy, serveur.","c":"Piège de l'exam : le blueprint (4.1, 4.5) qualifie aussi NetFlow de « transaction data ».","r":1,"id":"c-030"},{"d":2,"t":"Statistical data","f":"Données **dérivées par calcul** sur le trafic : moyennes, baselines, écarts. Sert à la détection d'anomalies.","r":1,"id":"c-031"},{"d":2,"t":"Metadata","f":"**Données sur les données** : géolocalisation d'une IP, réputation, whois, empreinte JA3, tailles et horaires.","r":1,"id":"c-032"},{"d":2,"t":"Alert data","f":"Message généré par un **IDS/IPS** quand le trafic matche une règle (Snort, Suricata), consulté dans Sguil ou Kibana.","c":"Une alerte n'est pas une preuve : elle doit être qualifiée (TP ou FP).","r":1,"id":"c-033"},{"d":2,"t":"NetFlow","f":"Export de **métadonnées de flux** par les équipements réseau : 5-tuple, compteurs, horodatage, interfaces. **Pas de payload**.","c":"tcpdump capture les paquets complets. Ici on ne sait pas ce qui a été échangé.","r":1,"id":"c-034"},{"d":2,"t":"Next-generation firewall (NGFW)","f":"Firewall stateful **+** identification des applications (L7), identité utilisateur, IPS intégré, filtrage URL, antimalware.","c":"Stateful classique : table d'états L3/L4, aucune vision de l'application.","r":1,"id":"c-035"},{"d":2,"t":"Application visibility and control (AVC)","f":"Identifie les **applications** quel que soit le port (NBAR2, DPI) et permet de les contrôler ou de les prioriser.","r":1,"id":"c-036"},{"d":2,"t":"NAT/PAT (impact on visibility)","f":"**Masque les adresses internes** : vu de l'extérieur, tous les hôtes partagent une IP. Il faut les logs de traduction pour remonter à l'hôte réel.","r":0,"id":"c-037"},{"d":2,"t":"Load balancing (impact on visibility)","f":"Le serveur voit l'IP du **répartiteur**, pas celle du client. L'IP réelle est dans l'en-tête X-Forwarded-For ou dans les logs du LB.","r":0,"id":"c-038"},{"d":2,"t":"Tor","f":"Réseau d'anonymisation par **routage en oignon** : chiffrement en couches et relais successifs, la destination réelle est cachée.","c":"Détection : connexions vers des nœuds d'entrée connus (listes publiques).","r":1,"id":"c-039"},{"d":2,"t":"Tunneling / encapsulation","f":"Transporter un protocole **dans un autre** pour passer les contrôles : DNS tunneling, ICMP tunneling, HTTPS, GRE, VPN.","r":0,"id":"c-040"},{"d":2,"t":"Amplification (reflection) DDoS","f":"L'attaquant envoie de petites requêtes avec l'**IP source usurpée de la victime** à des serveurs ouverts (DNS, NTP, memcached), qui répondent en gros à la victime.","r":1,"id":"c-041"},{"d":2,"t":"On-path attack (MITM)","f":"L'attaquant s'**intercale** entre deux hôtes pour lire ou modifier le trafic : ARP spoofing, rogue DHCP, faux point d'accès.","r":1,"id":"c-042"},{"d":2,"t":"SQL injection","f":"Injection de **requêtes** dans un champ mal filtré, exécutées par la **base de données** (`' OR 1=1 --`, `UNION SELECT`).","c":"Command injection = commandes de l'OS. XSS = script exécuté dans le navigateur de la victime.","r":1,"id":"c-043"},{"d":2,"t":"Cross-site scripting (XSS)","f":"Injection de **JavaScript** dans une page, exécuté par le **navigateur de la victime** (vol de cookie de session). Variantes : stored, reflected, DOM.","c":"CSRF = forcer le navigateur authentifié à envoyer une requête à son insu.","r":1,"id":"c-044"},{"d":2,"t":"Command injection","f":"Injection de **commandes système** (`; cat /etc/passwd`, `| whoami`) exécutées par l'**OS du serveur**.","c":"SQLi vise la base de données, pas le shell.","r":1,"id":"c-045"},{"d":2,"t":"Social engineering with generative AI","f":"Phishing **sans fautes**, personnalisé à grande échelle, **deepfakes** voix ou vidéo (faux dirigeant), faux profils crédibles.","c":"Versions manuelles : phishing, spear phishing, whaling, vishing, smishing, pretexting, baiting, tailgating.","r":0,"id":"c-046"},{"d":2,"t":"Buffer overflow","f":"Écrire **au-delà d'un tampon mémoire** pour écraser des données adjacentes (adresse de retour) et détourner l'exécution.","r":1,"id":"c-047"},{"d":2,"t":"Command and control (C2)","f":"Canal par lequel un hôte compromis **reçoit ses ordres** et renvoie des données. Signe typique : beaconing régulier.","r":1,"id":"c-048"},{"d":2,"t":"Evasion techniques","f":"Fragmentation, chiffrement, tunneling, proxies, **resource exhaustion** (saturer l'IDS), **traffic substitution/insertion**, **timing** lent, pivoting, rootkits.","r":0,"id":"c-049"},{"d":2,"t":"Cipher suite","f":"Combinaison négociée en TLS : **échange de clés** + **authentification** + **chiffrement symétrique** + **hash**. Ex : ECDHE-RSA-AES256-GCM-SHA384.","c":"En TLS 1.3, elle ne liste plus que le chiffrement AEAD et le hash.","r":1,"id":"c-050"},{"d":2,"t":"X.509","f":"**Format standard** des certificats : subject, issuer, validité, clé publique, SAN, numéro de série, signature de la CA.","r":1,"id":"c-051"},{"d":2,"t":"PKCS","f":"Famille de standards de crypto à clé publique. À connaître : **#7** (chaîne de certificats, .p7b), **#10** (CSR), **#12** (.pfx/.p12 : certificat + clé privée).","r":1,"id":"c-052"},{"d":2,"t":"Asymmetric vs symmetric encryption","f":"**Asymétrique** (RSA, ECC) : paire de clés, lent, sert à l'authentification et à l'échange de clés. **Symétrique** (AES) : clé partagée, rapide, chiffre les données.","c":"En TLS : l'asymétrique établit la session, le symétrique chiffre le trafic.","r":0,"id":"c-053"},{"d":2,"t":"Cisco Umbrella","f":"Sécurité **DNS** dans le cloud : bloque la résolution des domaines malveillants, avec proxy web et CASB en complément.","r":1,"id":"c-054"},{"d":2,"t":"Cisco Secure Network Analytics (ex-Stealthwatch)","f":"Analyse **NetFlow** et télémétrie réseau pour détecter des anomalies comportementales (exfiltration, mouvement latéral, C2).","r":1,"id":"c-055"},{"d":3,"t":"Host-based intrusion detection (HIDS)","f":"Agent qui surveille **l'hôte** : intégrité des fichiers, logs, registre, processus, appels système (OSSEC, Wazuh).","c":"NIDS regarde le réseau et ne voit rien dans un flux chiffré. Sur l'hôte, on voit après déchiffrement.","r":1,"id":"c-056"},{"d":3,"t":"Application allow listing","f":"Seules les applications **explicitement autorisées** peuvent s'exécuter, tout le reste est bloqué. Très efficace, lourd à maintenir.","c":"Block listing = on bloque une liste connue, tout le reste passe (approche antivirus).","r":1,"id":"c-057"},{"d":3,"t":"Systems-based sandboxing","f":"Exécuter un programme dans un **environnement isolé** du reste du système (navigateur, lecteur PDF, conteneur) pour limiter l'impact d'une compromission.","r":1,"id":"c-058"},{"d":3,"t":"Predictive AI (endpoint)","f":"Modèles de **machine learning** entraînés sur des millions d'échantillons pour **anticiper** si un fichier ou un comportement inconnu est malveillant, sans signature.","c":"Generative AI produit du contenu (côté attaquant : phishing). Ici on classe et on anticipe.","r":1,"id":"c-059"},{"d":3,"t":"Indicator of compromise (IoC)","f":"Preuve qu'une compromission **a eu lieu** : hash, IP, domaine, clé de registre. Approche **réactive**.","c":"IoA = l'attaque est **en cours**, on observe le comportement (intention).","r":1,"id":"c-060"},{"d":3,"t":"Indicator of attack (IoA)","f":"Signe comportemental qu'une attaque est **en cours**, quel que soit l'outil : Word qui lance PowerShell, mouvement latéral. Approche **proactive**.","c":"IoC = artefact statique laissé après coup.","r":1,"id":"c-061"},{"d":3,"t":"Chain of custody","f":"**Traçabilité ininterrompue** d'une preuve : qui l'a collectée, quand, comment, à qui elle a été transmise, où elle est stockée.","r":1,"id":"c-062"},{"d":3,"t":"Best evidence","f":"Preuve dans son **état original** : le disque saisi, le fichier de log d'origine, un document signé.","c":"Corroborative = appuie une autre preuve. Indirect = permet une déduction.","r":1,"id":"c-063"},{"d":3,"t":"Corroborative evidence","f":"Preuve qui **confirme ou renforce** une affirmation issue d'une autre preuve (ex : le log du proxy confirme ce que montre le pcap).","r":1,"id":"c-064"},{"d":3,"t":"Indirect (circumstantial) evidence","f":"Preuve qui, combinée à d'autres faits, **suggère** une conclusion sans la démontrer directement (ex : le badge de l'employé a ouvert la salle serveur ce soir-là).","r":1,"id":"c-065"},{"d":3,"t":"Windows registry hives","f":"**HKLM** (machine), **HKCU** (utilisateur courant), **HKU** (tous les profils), **HKCR** (associations de fichiers), **HKCC** (profil matériel). Persistance classique : clés `Run` et `RunOnce`.","r":0,"id":"c-066"},{"d":3,"t":"NTFS artifacts","f":"**MFT** (index de tous les fichiers), horodatages **MACE**, **Alternate Data Streams** (données cachées derrière un fichier : `notes.txt:cache.exe`).","r":0,"id":"c-067"},{"d":3,"t":"Process, thread, handle","f":"**Process** = programme en cours avec son espace mémoire. **Thread** = unité d'exécution dans un process. **Handle** = référence vers une ressource (fichier, clé de registre).","r":0,"id":"c-068"},{"d":3,"t":"Linux daemon / fork / PID 1","f":"**Daemon** = service en arrière-plan. **fork** = un process crée un enfant (PPID). **PID 1** = init ou systemd, ancêtre de tous les process.","r":0,"id":"c-069"},{"d":3,"t":"SUID bit","f":"Permission Linux qui fait exécuter un binaire avec les droits de son **propriétaire** (souvent root) : `-rwsr-xr-x`. Cible classique d'élévation de privilèges.","r":1,"id":"c-070"},{"d":3,"t":"Windows Event IDs to know","f":"**4624** logon OK, **4625** logon échoué, **4648** identifiants explicites, **4672** privilèges admin, **4688** création de process, **4720** compte créé, **4732** ajout à un groupe local, **7045** service installé, **1102** journal effacé.","r":0,"id":"c-071"},{"d":3,"t":"Windows logon types","f":"**2** interactif (console), **3** réseau (SMB), **4** batch, **5** service, **7** déverrouillage, **10** RemoteInteractive (RDP).","r":0,"id":"c-072"},{"d":3,"t":"Static vs dynamic malware analysis","f":"**Statique** : on n'exécute pas (hash, strings, en-têtes PE, désassemblage). **Dynamique** : on exécute en sandbox et on observe (fichiers, registre, réseau).","r":0,"id":"c-073"},{"d":3,"t":"Detonation chamber (sandbox)","f":"Environnement isolé où l'on **exécute un échantillon suspect** pour produire un rapport : hashes, URLs et domaines contactés, fichiers créés, clés de registre, score de menace.","c":"Produit Cisco : Secure Malware Analytics (ex-Threat Grid). Open source : Cuckoo.","r":1,"id":"c-074"},{"d":3,"t":"Cisco Secure Endpoint (ex-AMP)","f":"EDR Cisco : protection et détection sur l'hôte, **file trajectory** et **sécurité rétrospective** (un fichier jugé sain hier peut être condamné aujourd'hui).","r":1,"id":"c-075"},{"d":4,"t":"True/false positive/negative","f":"**TP** alerte + vraie attaque. **FP** alerte sans attaque (bruit). **TN** pas d'alerte, pas d'attaque. **FN** pas d'alerte mais attaque : **le pire**.","c":"Benign : l'alerte est exacte techniquement mais l'activité est légitime (ex : scan autorisé).","r":0,"id":"c-076"},{"d":4,"t":"IDS vs IPS","f":"**IDS** : hors bande, reçoit une **copie** (SPAN/tap), détecte et alerte, aucun impact sur le trafic. **IPS** : **inline**, peut bloquer, ajoute latence et risque de coupure.","r":0,"id":"c-077"},{"d":4,"t":"Network tap vs SPAN","f":"**Tap** : boîtier matériel passif, copie **tout** (erreurs comprises), sans perte. **SPAN** : port mirroring configuré sur le switch, peut perdre des paquets en charge.","r":0,"id":"c-078"},{"d":4,"t":"Deep packet inspection (DPI)","f":"Inspection jusqu'à la **couche 7** : contenu applicatif, signatures, identification d'application.","c":"Packet filtering = ACL sans état sur L3/L4. Stateful = suit l'état des connexions, toujours L3/L4.","r":1,"id":"c-079"},{"d":4,"t":"Transactional data (NetFlow) vs tap","f":"**Tap/capture** : paquets complets, analyse fine du payload, coûteux. **NetFlow** : résumé des flux, léger, longue rétention, aucune vision du contenu.","r":0,"id":"c-080"},{"d":4,"t":"Snort rule header","f":"`action proto src_ip src_port -> dst_ip dst_port (options)`. Options clés : **msg**, **content**, **sid**, **rev**, flow, classtype.","c":"`->` unidirectionnel, `<>` bidirectionnel.","r":0,"id":"c-081"},{"d":4,"t":"Regex essentials","f":"`.` un caractère, `*` 0 ou plus, `+` 1 ou plus, `?` 0 ou 1, `^` début, `$` fin, `[a-z]` classe, `\\d` chiffre, `{2,4}` répétition, `|` ou, `\\.` point littéral.","r":0,"id":"c-082"},{"d":4,"t":"HTTP status codes","f":"**200** OK, **301/302** redirection, **401** non authentifié, **403** interdit, **404** introuvable, **500** erreur serveur. Une rafale de 404 = scan. Un 200 sur une requête d'attaque = elle a probablement réussi.","r":0,"id":"c-083"},{"d":4,"t":"DNS record types","f":"**A** IPv4, **AAAA** IPv6, **CNAME** alias, **MX** mail, **NS** serveur de noms, **PTR** inverse, **TXT** texte (SPF, mais aussi canal de tunneling).","r":0,"id":"c-084"},{"d":4,"t":"TCP flags","f":"**URG, ACK, PSH, RST, SYN, FIN**. Handshake : SYN, SYN-ACK, ACK. Scan SYN : des SYN en rafale, des RST en retour, jamais d'ACK final.","c":"Mnémo : *Unskilled Attackers Pester Real Security Folks*.","r":0,"id":"c-085"},{"d":4,"t":"IP protocol numbers and TTL","f":"Champ Protocol : **1** ICMP, **6** TCP, **17** UDP. TTL initial typique : **64** Linux, **128** Windows, **255** équipements réseau.","r":0,"id":"c-086"},{"d":4,"t":"Wireshark display filters","f":"`ip.addr == 10.0.0.5`, `tcp.port == 443`, `http.request.method == \"POST\"`, `dns.qry.name contains \"evil\"`, `tcp.flags.syn == 1 && tcp.flags.ack == 0`.","c":"Capture filter (BPF, avant capture) : `host 10.0.0.5 and port 443`. Syntaxe différente.","r":0,"id":"c-087"},{"d":4,"t":"Extracting files from a PCAP","f":"Wireshark : **File > Export Objects** (HTTP, SMB, TFTP...) ou **Follow TCP Stream** puis enregistrer en *raw*. Ensuite : hash du fichier et vérification de réputation.","r":0,"id":"c-088"},{"d":4,"t":"Magic bytes (file signatures)","f":"**4D 5A** (MZ) exécutable Windows, **7F 45 4C 46** ELF, **25 50 44 46** PDF, **50 4B 03 04** ZIP et Office, **FF D8 FF** JPEG, **89 50 4E 47** PNG.","c":"Une extension .jpg avec un en-tête MZ = exécutable déguisé.","r":0,"id":"c-089"},{"d":4,"t":"Syslog severity levels","f":"**0** Emergency, **1** Alert, **2** Critical, **3** Error, **4** Warning, **5** Notice, **6** Informational, **7** Debug. Plus le chiffre est bas, plus c'est grave.","c":"Mnémo : *Every Alley Cat Eats Watery Noodles In Doors*.","r":0,"id":"c-090"},{"d":4,"t":"Mapping an event to its source","f":"`%ASA-6-302013` = firewall Cisco. `[**] [1:2013028:4]` = Snort/IDS. `TCP_MISS/200` = proxy Squid. Lignes avec durée, paquets, octets et flags = NetFlow. Nom de malware + chemin de fichier = antivirus.","r":0,"id":"c-091"},{"d":4,"t":"Security Onion toolset","f":"**Snort/Suricata** (alertes IDS), **Zeek** (logs de session et de transaction), **Sguil/Squert** (console d'alertes), **Kibana** (recherche et tableaux de bord), **Wazuh/OSSEC** (HIDS), **Wireshark/tcpdump** (pcap).","r":0,"id":"c-092"},{"d":5,"t":"NIST SP 800-61 life cycle","f":"**Preparation** → **Detection and analysis** → **Containment, eradication and recovery** → **Post-incident activity**. Le cycle boucle.","c":"L'exam suit la r2 (4 phases). La r3 de 2025 s'aligne sur le CSF 2.0 : ne pas mélanger.","r":0,"id":"c-093"},{"d":5,"t":"Precursor","f":"Signe qu'un incident **pourrait se produire** : scan détecté, menace annoncée, nouvel exploit publié contre un produit utilisé.","c":"Indicator = l'incident **s'est produit ou est en cours**.","r":1,"id":"c-094"},{"d":5,"t":"Indicator (800-61)","f":"Signe qu'un incident **s'est produit ou est en cours** : alerte antivirus ou IDS, échecs de connexion en rafale, trafic anormal.","c":"Precursor = ça pourrait arriver. Beaucoup plus rare.","r":1,"id":"c-095"},{"d":5,"t":"Containment, eradication, recovery","f":"**Contenir** = stopper la propagation (isoler). **Éradiquer** = supprimer malware et comptes compromis, corriger la faille. **Rétablir** = restaurer, remettre en production, surveiller.","r":0,"id":"c-096"},{"d":5,"t":"IR policy vs plan vs procedures","f":"**Policy** = le cadre (engagement direction, périmètre, rôles et autorité, sévérités). **Plan** = la feuille de route (mission, stratégies, approbation, communication, métriques, roadmap). **Procedures/SOP** = le pas à pas (checklists, formulaires).","r":0,"id":"c-097"},{"d":5,"t":"Attrition (800-61 attack vector)","f":"Attaque par **force brute** pour compromettre, dégrader ou détruire : brute force de mots de passe, DDoS.","c":"Impersonation = spoofing, MITM, rogue AP. Improper usage = violation de la charte par un utilisateur autorisé.","r":1,"id":"c-098"},{"d":5,"t":"Incident prioritization factors","f":"**Functional impact** (services métier), **Information impact** (none, privacy breach, proprietary breach, integrity loss), **Recoverability** (regular, supplemented, extended, not recoverable).","c":"Jamais « premier arrivé, premier servi ».","r":0,"id":"c-099"},{"d":5,"t":"PSIRT","f":"Équipe d'un **éditeur** qui traite les vulnérabilités de ses **propres produits** et publie les avis de sécurité (ex : chez Cisco).","c":"CSIRT = répond aux incidents d'une organisation. CERT/CC = centre de coordination.","r":1,"id":"c-100"},{"d":5,"t":"NIST SP 800-86 process","f":"**Collection** → **Examination** → **Analysis** → **Reporting**. Mnémo CEAR.","c":"800-61 = réponse à incident. 800-86 = intégrer le forensic dans la réponse.","r":0,"id":"c-101"},{"d":5,"t":"Order of volatility","f":"Registres et cache CPU → RAM, tables ARP, routage, processus → fichiers temporaires et swap → disque → logs distants → topologie physique → archives.","r":0,"id":"c-102"},{"d":5,"t":"Cyber Kill Chain","f":"**Reconnaissance → Weaponization → Delivery → Exploitation → Installation → Command and control → Actions on objectives**.","c":"Mnémo : *Real Warriors Deliver Exploits, Install Control, Act*.","r":0,"id":"c-103"},{"d":5,"t":"Weaponization","f":"Phase de la Kill Chain où l'attaquant **fabrique son arme** : il couple un exploit à un payload dans un livrable (PDF, document Office). Invisible pour le défenseur.","c":"Delivery = l'arme est **transmise** à la cible.","r":1,"id":"c-104"},{"d":5,"t":"Delivery vs exploitation vs installation","f":"**Delivery** = l'arme arrive (email, web, USB). **Exploitation** = elle se déclenche (faille ou clic). **Installation** = elle s'implante (persistance, backdoor).","r":0,"id":"c-105"},{"d":5,"t":"Diamond Model core features","f":"**Adversary**, **Capability**, **Infrastructure**, **Victim**. Un événement = un adversaire déploie une capacité via une infrastructure contre une victime.","c":"Mnémo ACIV.","r":0,"id":"c-106"},{"d":5,"t":"Diamond Model meta-features","f":"**Timestamp, Phase, Result, Direction, Methodology, Resources**.","c":"Ce ne sont pas les sommets du diamant.","r":0,"id":"c-107"},{"d":5,"t":"Pivoting (Diamond Model)","f":"Technique d'analyse : partir d'un **élément connu** d'un événement (un domaine C2, un hash) pour **découvrir les éléments liés** (autres victimes, infrastructure, adversaire).","c":"À ne pas confondre avec le rebond de l'attaquant d'un hôte compromis vers d'autres réseaux.","r":1,"id":"c-108"},{"d":5,"t":"MITRE ATT&CK","f":"Base de connaissances des comportements adverses : **Tactics** (le pourquoi), **Techniques** (le comment), **Procedures** (l'implémentation). D'où TTP.","r":1,"id":"c-109"},{"d":5,"t":"Network profile elements","f":"**Total throughput**, **Session duration**, **Ports used**, **Critical asset address space**.","c":"Server profile = listening ports, logged-in users/service accounts, running processes, running tasks, applications.","r":0,"id":"c-110"},{"d":5,"t":"Server profile elements","f":"**Listening ports**, **Logged-in users/service accounts**, **Running processes**, **Running tasks**, **Applications**.","c":"Network profile = throughput, durée de session, ports utilisés, adresses des actifs critiques.","r":0,"id":"c-111"},{"d":5,"t":"PSI (personal security information)","f":"**Identifiants de sécurité** d'une personne : noms d'utilisateur, mots de passe, réponses aux questions secrètes.","c":"PII = identifie la personne. PHI = santé. IP = propriété intellectuelle.","r":0,"id":"c-112"},{"d":5,"t":"PHI (protected health information)","f":"Donnée de **santé** rattachée à une personne identifiable. Sous-ensemble de la PII, encadrée par **HIPAA** aux États-Unis.","r":0,"id":"c-113"},{"d":5,"t":"Dwell time","f":"Durée pendant laquelle un attaquant a **accès au réseau avant d'être détecté et stoppé**.","c":"MTTD = temps moyen pour détecter un incident valide.","r":1,"id":"c-114"},{"d":5,"t":"MTTD / MTTR / MTTC","f":"**MTTD** = temps moyen pour **détecter**. **MTTR** = temps moyen pour **stopper et remédier** (respond). **MTTC** = temps pour **contenir** : empêcher plus de dégâts.","r":0,"id":"c-115"},{"d":5,"t":"Time to control","f":"Temps nécessaire pour **stopper la propagation d'un malware** dans le réseau.","c":"MTTC = contenir l'incident au sens large.","r":1,"id":"c-116"},{"d":5,"t":"CMMC","f":"Certification de **maturité cyber** exigée des sous-traitants du **DoD américain**. Domaine IR : plan, detect and report, respond, post-incident review, test.","r":1,"id":"c-117"},{"d":5,"t":"Vulnerability management life cycle","f":"**Discover → Prioritize assets → Assess → Report → Remediate → Verify**.","r":0,"id":"c-118"},{"d":5,"t":"IR stakeholders","f":"Management, Information assurance, IT support, **Legal**, **Public affairs/media**, **Human resources**, Business continuity planners, Physical security and facilities.","c":"HR = sanctions disciplinaires. Legal = conformité et poursuites. Public affairs = communication externe.","r":0,"id":"c-119"}]}</script>
<script>
(function () {
"use strict";
/* ---------- data ---------- */
var DATA = JSON.parse(document.getElementById("data").textContent);
var QUESTIONS = DATA.questions, CARDS = DATA.cards, DOMAINS = DATA.domains, TOPICS = DATA.topics;
var QBY = Object.create(null); QUESTIONS.forEach(function (q) { QBY[q.id] = q; });
var CBY = Object.create(null); CARDS.forEach(function (c) { CBY[c.id] = c; });
var DOM = Object.create(null); DOMAINS.forEach(function (d) { DOM[d.id] = d; });
var LETTERS = "ABCDEFGH";
var LS_KEY = "cbrops.progress.v1", LS_SESSION = "cbrops.session.v1";
var TARGET = 85;

/* ---------- utils ---------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmt(s) {
  var parts = esc(s).split("`"), out = "";
  for (var i = 0; i < parts.length; i++) {
    if (i % 2 === 1 && i < parts.length - 1 + (parts.length % 2)) { out += "<code>" + parts[i] + "</code>"; continue; }
    out += parts[i]
      .replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(«])\*([^*\s][^*]*?)\*(?=$|[\s).,;:»])/g, "$1<em>$2</em>");
  }
  return out;
}
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ":" + (m < 10 ? "0" : "") : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function fmtDate(ts) {
  var d = new Date(ts);
  return ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + " " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}
function lsGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } }

/* ---------- progress ---------- */
function freshProgress() { return { v: 1, updatedAt: 0, resetAt: 0, q: {}, fc: {}, sessions: [] }; }
function normalize(o) {
  var p = freshProgress();
  if (!o || typeof o !== "object") return p;
  p.updatedAt = +o.updatedAt || 0; p.resetAt = +o.resetAt || 0;
  if (o.q && typeof o.q === "object") Object.keys(o.q).forEach(function (id) {
    var e = o.q[id];
    if (QBY[id] && Array.isArray(e) && e.length >= 4) p.q[id] = [+e[0] || 0, +e[1] || 0, e[2] ? 1 : 0, +e[3] || 0];
  });
  if (o.fc && typeof o.fc === "object") Object.keys(o.fc).forEach(function (id) {
    if (CBY[id]) p.fc[id] = Math.max(0, Math.min(2, +o.fc[id] || 0));
  });
  if (Array.isArray(o.sessions)) p.sessions = o.sessions.filter(function (s) { return s && s.ts; }).slice(-40);
  return p;
}
function mergeProgress(a, b) {
  var out = freshProgress();
  out.updatedAt = Math.max(a.updatedAt, b.updatedAt);
  out.resetAt = Math.max(a.resetAt, b.resetAt);
  var ids = {}; Object.keys(a.q).forEach(function (k) { ids[k] = 1; }); Object.keys(b.q).forEach(function (k) { ids[k] = 1; });
  Object.keys(ids).forEach(function (id) {
    var x = a.q[id], y = b.q[id], e = !x ? y : !y ? x : (x[3] >= y[3] ? x : y);
    if (e[3] >= out.resetAt) out.q[id] = e;
  });
  var newer = a.updatedAt >= b.updatedAt ? a : b, older = newer === a ? b : a;
  out.fc = {};
  if (older.updatedAt >= out.resetAt) Object.keys(older.fc).forEach(function (k) { out.fc[k] = older.fc[k]; });
  if (newer.updatedAt >= out.resetAt) Object.keys(newer.fc).forEach(function (k) { out.fc[k] = newer.fc[k]; });
  var seen = {};
  out.sessions = a.sessions.concat(b.sessions).filter(function (s) {
    if (seen[s.ts] || s.ts < out.resetAt) return false; seen[s.ts] = 1; return true;
  }).sort(function (x, y) { return x.ts - y.ts; }).slice(-40);
  return out;
}
var P = normalize(lsGet(LS_KEY));
function saveLocal() { lsSet(LS_KEY, P); }
function touch() { P.updatedAt = Date.now(); saveLocal(); scheduleRemote(); }
function record(qid, ok) {
  var e = P.q[qid] || [0, 0, 0, 0];
  e = [e[0] + 1, e[1] + (ok ? 1 : 0), ok ? 1 : 0, Date.now()];
  P.q[qid] = e; touch();
}

/* ---------- stats ---------- */
function statsFor(list) {
  var s = { total: list.length, seen: 0, att: 0, cor: 0, lastOk: 0 };
  list.forEach(function (q) { var e = P.q[q.id]; if (e) { s.seen++; s.att += e[0]; s.cor += e[1]; s.lastOk += e[2]; } });
  return s;
}
function domStats(d) { return statsFor(QUESTIONS.filter(function (q) { return q.d === d; })); }
function errorIds() { return QUESTIONS.filter(function (q) { var e = P.q[q.id]; return e && !e[2]; }).map(function (q) { return q.id; }); }
function topicStats() {
  var by = {};
  QUESTIONS.forEach(function (q) { (by[q.ref] = by[q.ref] || []).push(q); });
  return Object.keys(TOPICS).map(function (ref) {
    var s = statsFor(by[ref] || []); s.ref = ref; s.label = TOPICS[ref]; s.pct = s.att ? pct(s.cor, s.att) : null; return s;
  });
}
function weakTopics(n) {
  return topicStats().filter(function (t) { return t.att >= 3; }).sort(function (a, b) { return a.pct - b.pct; }).slice(0, n);
}
function lastExam() {
