  for (var i = P.sessions.length - 1; i >= 0; i--) if (P.sessions[i].mode === "exam") return P.sessions[i];
  return null;
}
function buildDoc() {
  var doc = JSON.parse(JSON.stringify(P));
  var byDomain = {};
  DOMAINS.forEach(function (d) { var s = domStats(d.id); byDomain["D" + d.id] = { name: d.name, weight: d.w, total: s.total, seen: s.seen, attempts: s.att, correct: s.cor, pct: s.att ? pct(s.cor, s.att) : null }; });
  var all = statsFor(QUESTIONS);
  doc.summary = {
    bank: QUESTIONS.length, seen: all.seen, attempts: all.att, correct: all.cor, pct: all.att ? pct(all.cor, all.att) : null,
    byDomain: byDomain,
    weakTopics: weakTopics(8).map(function (t) { return { ref: t.ref, label: t.label, attempts: t.att, pct: t.pct }; }),
    missed: errorIds().slice(0, 80),
    cardsToReview: CARDS.filter(function (c) { return P.fc[c.id] === 0; }).map(function (c) { return c.t; }).slice(0, 60),
    lastExam: lastExam()
  };
  return doc;
}

/* ---------- remote sync (db capability) ---------- */
var dbDoc = null, saving = false, dirty = false, syncTimer = null, syncState = "local";
var SYNC_LABEL = {
  local: "Sauvegarde : cet appareil uniquement",
  ok: "Progression synchronisée",
  saving: "Enregistrement...",
  err: "Synchro en attente, la progression reste enregistrée sur cet appareil",
  off: "Synchro indisponible, la progression reste enregistrée sur cet appareil"
};
function setSync(s) { syncState = s; var el = document.getElementById("sync"); if (el) el.textContent = SYNC_LABEL[s] || ""; }
function scheduleRemote() {
  if (!dbDoc) return;
  dirty = true; clearTimeout(syncTimer); syncTimer = setTimeout(function () { flushRemote(false); }, 1500);
}
function flushRemote(isRetry) {
  if (!dbDoc) return Promise.resolve();
  if (saving) { dirty = true; return Promise.resolve(); }
  saving = true; dirty = false; setSync("saving");
  var again = false;
  return dbDoc.set(buildDoc()).then(function () { setSync("ok"); }, function (e) {
    var code = (e && e.code) || "unavailable";
    var terminal = ["invalid_argument", "not_granted", "revoked", "capability_disabled", "capability_removed", "transform_error", "quota_exceeded"];
    if (terminal.indexOf(code) >= 0) { dbDoc = null; setSync("off"); }
    else if (!isRetry) again = true;
    else setSync("err");
  }).then(function () {
    saving = false;
    if (again) setTimeout(function () { flushRemote(true); }, 1200 + Math.random() * 1500);
    else if (dirty && dbDoc) scheduleRemote();
  });
}
function initDb() {
  if (!(window.claude && typeof window.claude.use === "function")) { setSync("local"); return Promise.resolve(); }
  return Promise.resolve().then(function () { return window.claude.use("db"); }).then(function (db) {
    if (!db) { setSync("local"); return; }
    var ref = db.doc("cbrops/progress");
    return ref.get().then(function (snap) {
      dbDoc = ref;
      if (snap && snap.exists) {
        var remote = normalize(JSON.parse(JSON.stringify(snap.data() || {})));
        var before = JSON.stringify([P.q, P.fc, P.sessions.length]);
        var merged = mergeProgress(P, remote);
        var same = JSON.stringify([merged.q, merged.fc, merged.sessions.length]) === JSON.stringify([remote.q, remote.fc, remote.sessions.length]);
        P = merged; saveLocal();
        if (JSON.stringify([P.q, P.fc, P.sessions.length]) !== before && typeof render === "function" && view !== "quiz") render();
        setSync("ok");
        if (!same) scheduleRemote();
      } else {
        setSync("ok");
        if (P.updatedAt) scheduleRemote();
      }
    });
  }).catch(function () { dbDoc = null; setSync("off"); });
}

/* ---------- AI re-explanation (sample capability) ---------- */
var sampleFn = null, aiCtl = null;
function initSample() {
  if (!(window.claude && typeof window.claude.use === "function")) return Promise.resolve();
  return Promise.resolve().then(function () { return window.claude.use("sample"); }).then(function (fn) {
    if (typeof fn === "function") { sampleFn = fn; document.body.classList.add("has-ai"); }
  }).catch(function () { sampleFn = null; });
}
function answerText(q, idxs) {
  if (q.t === "d") return q.l.map(function (l, i) { return l + " => " + (idxs[i] >= 0 ? q.r[idxs[i]] : "(rien)"); }).join(" ; ");
  return idxs.length ? idxs.map(function (i) { return q.o[i]; }).join(" ; ") : "(aucune)";
}
function aiPrompt(q, it) {
  var lines = [
    "Tu es un tuteur qui prépare un candidat francophone à l'examen Cisco 200-201 (CCNA Cybersecurity).",
    "Le candidat est administrateur systèmes et réseaux : utilise une analogie réseau ou sysadmin quand elle aide vraiment.",
    "Il retient mal la terminologie : termine par un moyen mnémotechnique court.",
    "",
    "Question (en anglais) : " + q.q
  ];
  if (q.x) lines.push("Exhibit :\n" + q.x);
  if (q.t === "d") lines.push("Catégories possibles : " + q.r.join(" | "));
  else lines.push("Propositions : " + q.o.map(function (o, i) { return LETTERS[i] + ") " + o; }).join(" | "));
  lines.push("Bonne réponse : " + answerText(q, q.a));
  lines.push("Réponse du candidat : " + answerText(q, it.ans) + (it.ok ? " (correcte)" : " (fausse)"));
  lines.push("Explication de référence : " + q.e + (q.trap ? " Piège : " + q.trap : ""));
  lines.push("");
  lines.push("Consigne : réexplique autrement, en français, en 120 mots maximum, sans recopier l'explication de référence. Garde les termes techniques en anglais. Pas de titre, pas de liste à puces, pas de tiret cadratin. Si la réponse du candidat est fausse, dis en une phrase pourquoi elle est tentante et pourquoi elle ne convient pas. Ne contredis pas la bonne réponse indiquée.");
  return lines.join("\n");
}
function stopAI() { if (aiCtl) { try { aiCtl.abort(); } catch (e) { /* noop */ } aiCtl = null; } }
function explainAI(q, it) {
  var box = document.getElementById("aibox"), out = document.getElementById("aiout"), btn = document.getElementById("aibtn"), stop = document.getElementById("aistop");
  if (!sampleFn || !box || !out) return;
  stopAI(); aiCtl = new AbortController();
  var ctl = aiCtl;
  box.hidden = false; out.textContent = "Réflexion en cours..."; btn.disabled = true; stop.hidden = false;
  var done = function () { if (btn) btn.disabled = false; if (stop) stop.hidden = true; if (aiCtl === ctl) aiCtl = null; };
  sampleFn(aiPrompt(q, it), { modelTier: "quick", signal: ctl.signal, onText: function (p) { if (aiCtl === ctl) out.innerHTML = fmt(p.text); } })
    .then(function (res) { if (aiCtl === ctl) out.innerHTML = fmt(res.text) + (res.truncated ? "\n(réponse tronquée)" : ""); done(); },
      function (e) {
        var code = e && e.code;
        var hide = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
        if (code === "cancelled") { if (!out.textContent || out.textContent === "Réflexion en cours...") box.hidden = true; }
        else if (hide.indexOf(code) >= 0) { sampleFn = null; out.textContent = "L'explication par IA n'est pas disponible dans cette vue."; document.body.classList.remove("has-ai"); box.hidden = false; }
        else if (code === "rate_limited") out.textContent = "Trop de demandes pour le moment. Réessaie un peu plus tard.";
        else if (code === "session_expired") out.textContent = "Session Claude expirée : reconnecte-toi puis réessaie.";
        else out.textContent = (e && e.text ? e.text + "\n\n" : "") + "Réponse interrompue. Tu peux réessayer.";
        done();
      });
}

/* ---------- session engine ---------- */
var S = null, R = null, tickTimer = null;
function makeItem(id) {
  var q = QBY[id];
  if (q.t === "d") return { id: id, lperm: shuffle(q.l.map(function (_, i) { return i; })), rperm: shuffle(q.r.map(function (_, i) { return i; })), ans: q.l.map(function () { return -1; }), ok: null, done: false, skipped: false };
  return { id: id, perm: shuffle(q.o.map(function (_, i) { return i; })), ans: [], ok: null, done: false, skipped: false };
}
function grade(q, it) {
  if (q.t === "d") return it.ans.every(function (v, i) { return v === q.a[i]; });
  var a = it.ans.slice().sort(), b = q.a.slice().sort();
  return a.length === b.length && a.every(function (v, i) { return v === b[i]; });
}
function canValidate(q, it) {
  if (q.t === "d") return it.ans.every(function (v) { return v >= 0; });
  return q.t === "s" ? it.ans.length === 1 : it.ans.length === q.a.length;
}
function smartOrder(list) {
  function rank(q) { var e = P.q[q.id]; if (!e) return 0; if (!e[2]) return 1; return 2 + e[1] / Math.max(1, e[0]); }
  return shuffle(list).sort(function (a, b) { return rank(a) - rank(b); });
}
function pickTraining(cfg) {
  var list = QUESTIONS.filter(function (q) {
    if (cfg.doms.length && cfg.doms.indexOf(q.d) < 0) return false;
    if (cfg.type === "x" && !q.x) return false;
    if (cfg.type === "d" && q.t !== "d") return false;
    return true;
  });
  list = cfg.order === "random" ? shuffle(list) : smartOrder(list);
  if (cfg.count > 0) list = list.slice(0, cfg.count);
  return shuffle(list).map(function (q) { return q.id; });
}
function pickExam(half) {
  var quota = half ? { 1: 10, 2: 13, 3: 10, 4: 10, 5: 7 } : { 1: 20, 2: 25, 3: 20, 4: 20, 5: 15 };
  var ids = [];
  DOMAINS.forEach(function (d) {
    var pool = shuffle(QUESTIONS.filter(function (q) { return q.d === d.id; }));
    ids = ids.concat(pool.slice(0, quota[d.id]).map(function (q) { return q.id; }));
  });
  return shuffle(ids);
}
function startSession(mode, ids, opts) {
  if (!ids.length) return false;
  opts = opts || {};
  S = { mode: mode, items: ids.map(makeItem), i: 0, startedAt: Date.now(), elapsed: 0, limit: opts.limit || 0, remain: opts.limit || 0, paused: false, label: opts.label || "" };
  R = null; persistSession(); setView("quiz"); startTick();
  return true;
}
function persistSession() { if (S && S.mode === "exam") lsSet(LS_SESSION, S); }
function startTick() {
  clearInterval(tickTimer);
  var last = Date.now(), n = 0;
  tickTimer = setInterval(function () {
    var now = Date.now(), dt = (now - last) / 1000; last = now;
    if (!S || view !== "quiz") { clearInterval(tickTimer); return; }
    if (S.paused) return;
    S.elapsed += dt;
    if (S.limit) {
      S.remain = Math.max(0, S.remain - dt);
      var t = document.getElementById("timer");
      if (t) { t.textContent = fmtTime(S.remain); t.className = "timer" + (S.remain < 600 ? " low" : ""); }
      if (S.remain <= 0) { finishSession(); return; }
    }

}
function validateCurrent() {
  var it = S.items[S.i], q = QBY[it.id];
  if (it.done || !canValidate(q, it)) return;

}
function skipCurrent() {
  var it = S.items[S.i];

  it.ok = false; it.done = true; it.skipped = true; record(it.id, false);
  nextQuestion();
}
function nextQuestion() {
  stopAI();
  if (S.i + 1 >= S.items.length) { finishSession(); return; }
  S.i++; persistSession(); render();
}
function finishSession() {
  clearInterval(tickTimer); stopAI();
  if (!S) return;
  var items = S.mode === "exam" ? S.items : S.items.filter(function (it) { return it.done; });
  if (S.mode === "exam") items.forEach(function (it) { if (!it.done) { it.done = true; it.ok = false; it.skipped = true; record(it.id, false); } });
  lsDel(LS_SESSION);
  if (!items.length) { S = null; setView("home"); return; }
  var byDom = {};
  items.forEach(function (it) { var d = QBY[it.id].d; byDom[d] = byDom[d] || [0, 0]; byDom[d][1]++; if (it.ok) byDom[d][0]++; });
  var ok = items.filter(function (it) { return it.ok; }).length;
  R = { mode: S.mode, label: S.label, items: items, n: items.length, ok: ok, sec: Math.round(S.elapsed), byDom: byDom, timedOut: !!(S.limit && S.remain <= 0) };
  P.sessions.push({ ts: Date.now(), mode: S.mode, n: R.n, ok: ok, sec: R.sec, dom: byDom });
  P.sessions = P.sessions.slice(-40);
  S = null; touch(); setView("results");
}

  if (!el) return;
  if (el.type === "radio") el.checked = true; else el.checked = !el.checked;
  el.focus(); readAnswers();
}

/* ---------- results ---------- */
function barsHTML(byDom) {
  var h = '<div class="bars">';
  DOMAINS.forEach(function (d) {
    var v = byDom[d.id]; if (!v) return;
    var p = pct(v[0], v[1]);
    h += '<div class="bar"><span><span class="dtag d' + d.id + '">D' + d.id + "</span> " + esc(d.name) + '</span><span class="track"><i class="' + (p < 60 ? "low" : p < TARGET ? "mid" : "") + '" style="width:' + p + '%"></i></span><span class="v">' + v[0] + "/" + v[1] + " " + p + "%</span></div>";
  });
  return h + "</div>";
}
function viewResults() {
  if (!R) return viewHome();
  var p = pct(R.ok, R.n), wrong = R.items.filter(function (it) { return !it.ok; });
  var title = R.mode === "exam" ? "Bilan de l'examen blanc" : R.mode === "errors" ? "Bilan : mes erreurs rejouées" : "Bilan de la session";
  var h = "<h1>" + title + '</h1><div class="panel"><div class="row"><div class="score">' + p + ' %</div><div class="grow">' + R.ok + " bonnes réponses sur " + R.n + '<br><span class="muted">Temps : ' + fmtTime(R.sec) + ", soit " + Math.round(R.sec / R.n) + " s par question</span></div></div>";
  if (R.timedOut) h += "<p><b>Temps écoulé.</b> Les questions non traitées comptent comme fausses, comme le jour J.</p>";
  if (R.mode === "exam") h += "<p>" + (p >= TARGET ? "Objectif d'entraînement atteint (" + TARGET + " %). Refais-en un autre à quelques jours d'écart pour confirmer." : "Objectif d'entraînement : " + TARGET + " %. Cisco ne publie pas le seuil réel, d'où cette marge de sécurité. Travaille d'abord le domaine le plus bas ci-dessous.") + "</p>";
  h += barsHTML(R.byDom) + "</div>";
  h += '<div class="row">' + (wrong.length ? '<button class="btn primary" data-act="replay">Rejouer ces ' + wrong.length + " erreurs</button>" : "") + '<button class="btn" data-act="go" data-v="home">Retour à l\'accueil</button></div>';
  if (wrong.length) {
    h += "<h2>Corrections (" + wrong.length + ")</h2>";
    wrong.forEach(function (it) {
      var q = QBY[it.id];
      h += '<details><summary><span class="dtag d' + q.d + '">' + esc(q.ref) + "</span> " + fmt(q.q) + (it.skipped ? " <em>(non répondue)</em>" : "") + "</summary>";
      if (q.x) h += '<pre class="term" tabindex="0">' + esc(q.x) + "</pre>";
      h += correctionHTML(q, it, false) + "</details>";
    });
  } else h += '<p class="verdict ok">Sans faute.</p>';
  return h;
}

/* ---------- flashcards ---------- */
function buildCardQueue() {
  var list = CARDS.filter(function (c) {
    if (CF.dom && c.d !== CF.dom) return false;
    if (CF.dir === "d2t" && !c.r) return false;
    var b = P.fc[c.id];
    if (CF.subset === "again") return b === 0;
    if (CF.subset === "open") return b === undefined || b < 2;
    return true;
  });
  function rank(c) { var b = P.fc[c.id]; return b === 0 ? 0 : b === undefined ? 1 : b === 1 ? 2 : 3; }
  list = shuffle(list).sort(function (a, b) { return rank(a) - rank(b); });
  CS = { queue: list.map(function (c) { return c.id; }), i: 0, flipped: false, known: 0, again: 0 };
}
function opt(v, label, cur) { return '<option value="' + v + '"' + (String(cur) === String(v) ? " selected" : "") + ">" + esc(label) + "</option>"; }
function viewCards() {
  if (!CS) buildCardQueue();
  var mastered = CARDS.filter(function (c) { return P.fc[c.id] === 2; }).length;
  var h = '<h1>Flashcards de terminologie</h1><p class="muted">Terme en anglais, comme à l\'examen. Définition en français. ' + mastered + " / " + CARDS.length + " cartes maîtrisées.</p>";
  h += '<div class="row"><select data-ch="cf" data-f="dom" aria-label="Domaine">' + opt(0, "Tous les domaines", CF.dom) + DOMAINS.map(function (d) { return opt(d.id, "D" + d.id + " " + d.name, CF.dom); }).join("") + "</select>";
  h += '<select data-ch="cf" data-f="subset" aria-label="Sélection">' + opt("all", "Toutes les cartes", CF.subset) + opt("open", "Pas encore maîtrisées", CF.subset) + opt("again", "À revoir uniquement", CF.subset) + "</select>";
  h += '<select data-ch="cf" data-f="dir" aria-label="Sens">' + opt("t2d", "Terme vers définition", CF.dir) + opt("d2t", "Définition vers terme", CF.dir) + "</select></div>";
  if (!CS.queue.length) return h + '<div class="panel">Aucune carte dans cette sélection.</div>';
  if (CS.i >= CS.queue.length) return h + '<div class="panel"><h2 style="margin-top:0">Série terminée</h2><p>' + CS.known + " sues, " + CS.again + ' à revoir.</p><div class="row"><button class="btn primary" data-act="cardsagain">Relancer une série</button><button class="btn" data-act="go" data-v="home">Accueil</button></div></div>';
  var c = CBY[CS.queue[CS.i]], rev = CF.dir === "d2t", front = !CS.flipped;
  h += '<p class="muted small">Carte ' + (CS.i + 1) + " / " + CS.queue.length + '. Espace pour retourner, puis 1 = à revoir, 2 = je savais.</p><button class="card" data-act="flip" aria-live="polite"><span class="side"><span class="dtag d' + c.d + '">D' + c.d + "</span> " + (front ? (rev ? "Quel est le terme ?" : "Que veut dire ce terme ?") : "Réponse") + "</span>";
  var term = '<div class="term">' + esc(c.t) + "</div>", def = '<div class="def">' + fmt(c.f) + "</div>", conf = c.c ? '<div class="conf"><b>Ne pas confondre</b>' + fmt(c.c) + "</div>" : "";
  if (front) h += rev ? def : term; else h += rev ? term + conf : term + '<div style="height:.6rem"></div>' + def + conf;
  h += "</button>";
  if (CS.flipped) h += '<div class="row" style="margin-top:.8rem"><button class="btn" data-act="rate" data-k="0">À revoir</button><button class="btn primary" data-act="rate" data-k="1">Je savais</button></div>';
  return h;
}
function rateCard(known) {
  if (!CS || CS.i >= CS.queue.length) return;
  var id = CS.queue[CS.i], b = P.fc[id] || 0;
  P.fc[id] = known ? Math.min(2, b + 1) : 0;
  if (known) CS.known++; else CS.again++;
  CS.i++; CS.flipped = false; touch(); render();
}

/* ---------- memo ---------- */
function viewMemo() { return '<div class="toc" id="toc" aria-label="Sommaire"></div><div class="memo" id="memo">' + document.getElementById("memo-src").innerHTML + "</div>"; }
function buildToc() {
  var toc = document.getElementById("toc"), hs = document.querySelectorAll("#memo h2");
  if (!toc) return;
  for (var i = 0; i < hs.length; i++) (function (hd) {
    var b = document.createElement("button");
    b.type = "button"; b.textContent = hd.textContent.replace(/^\d+\.\s*/, "");
    b.addEventListener("click", function () { try { hd.scrollIntoView({ block: "start" }); } catch (e) { /* noop */ } });
    toc.appendChild(b);
  })(hs[i]);
}

/* ---------- stats ---------- */
function viewStats() {
  var all = statsFor(QUESTIONS), h = "<h1>Statistiques</h1>";
  h += '<div class="panel"><b>' + all.seen + " / " + all.total + "</b> questions vues, <b>" + (all.att ? pct(all.cor, all.att) + " %" : "0 %") + "</b> de réussite cumulée sur " + all.att + " réponses. " + errorIds().length + " questions à rejouer.";
  var by = {}; DOMAINS.forEach(function (d) { var s = domStats(d.id); if (s.att) by[d.id] = [s.cor, s.att]; });
  h += barsHTML(by) + "</div>";
  var weak = weakTopics(5);
  if (weak.length) {
    h += "<h2>Topics les plus faibles</h2><ol>";
    weak.forEach(function (t) { h += "<li><b>" + esc(t.ref) + "</b> " + esc(t.label) + " : " + t.pct + " % sur " + t.att + " réponses</li>"; });
    h += "</ol>";
  }
  h += '<h2>Détail par topic du blueprint</h2><div class="tw"><table><thead><tr><th>Topic</th><th class="n">Vues</th><th class="n">Réussite</th></tr></thead><tbody>';
  topicStats().forEach(function (t) {
    h += "<tr" + (t.pct !== null && t.att >= 3 && t.pct < 60 ? ' class="weak"' : "") + "><td><b>" + esc(t.ref) + "</b> " + esc(t.label) + '</td><td class="n">' + t.seen + "/" + t.total + '</td><td class="n">' + (t.pct === null ? "" : t.pct + " %") + "</td></tr>";
  });
  h += "</tbody></table></div>";
  if (P.sessions.length) {
    h += '<h2>Dernières sessions</h2><div class="tw"><table><thead><tr><th>Date</th><th>Mode</th><th class="n">Score</th><th class="n">Temps</th></tr></thead><tbody>';
    var names = { exam: "Examen blanc", train: "Entraînement", errors: "Erreurs rejouées", flash: "Session flash" };
    P.sessions.slice(-12).reverse().forEach(function (s) { h += "<tr><td>" + fmtDate(s.ts) + "</td><td>" + (names[s.mode] || s.mode) + '</td><td class="n">' + s.ok + "/" + s.n + " " + pct(s.ok, s.n) + ' %</td><td class="n">' + fmtTime(s.sec) + "</td></tr>"; });
    h += "</tbody></table></div>";
  }
  h += '<h2>Remise à zéro</h2><p class="muted">Efface la progression des questions et des flashcards, sur cet appareil et dans la sauvegarde synchronisée.</p><button class="btn" data-act="reset">Tout remettre à zéro</button>';
  return h;
}

/* ---------- events ---------- */
function confirm2(el, label, fn) {
  if (el.classList.contains("armed")) { fn(); return; }
  var old = el.textContent; el.classList.add("armed"); el.textContent = label;
  setTimeout(function () { if (el.isConnected && el.classList.contains("armed")) { el.classList.remove("armed"); el.textContent = old; } }, 3500);
}
document.addEventListener("click", function (e) {
  var el = e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el || el.disabled) return;
  var act = el.getAttribute("data-act");
  if (act === "nav" || act === "go") {
    var v = el.getAttribute("data-v");
    if (view === "quiz" && S) { if (S.mode === "exam") { S.paused = true; persistSession(); } clearInterval(tickTimer); S = null; }
    if (v === "cards") CS = null;
    setView(v);
  }
  else if (act === "dom") { var d = +el.getAttribute("data-d"); startSession("train", pickTraining({ doms: [d], count: 10, order: "smart", type: "all" }), { label: "D" + d }); }
  else if (act === "flash") startSession("flash", pickTraining({ doms: [], count: 10, order: "smart", type: "all" }));
  else if (act === "errors") startSession("errors", shuffle(errorIds()).slice(0, 40));
  else if (act === "replay") startSession("errors", R.items.filter(function (it) { return !it.ok; }).map(function (it) { return it.id; }));
  else if (act === "starttrain") startSession("train", pickTraining(CFG));
  else if (act === "startexam") { var sp = examSpec(); lsDel(LS_SESSION); startSession("exam", pickExam(XCFG.half), { limit: sp.min * 60 }); }
  else if (act === "resume") { var sv = lsGet(LS_SESSION); if (sv && Array.isArray(sv.items)) { S = sv; S.paused = false; R = null; setView("quiz"); startTick(); } }
  else if (act === "dropexam") confirm2(el, "Confirmer l'abandon", function () { lsDel(LS_SESSION); render(); });
  else if (act === "validate") { readAnswers(); validateCurrent(); }
  else if (act === "next") nextQuestion();
  else if (act === "skip") confirm2(el, "Confirmer : question perdue", skipCurrent);
  else if (act === "quit") confirm2(el, "Confirmer : terminer", finishSession);
  else if (act === "pause") { S.paused = true; persistSession(); render(); }
  else if (act === "unpause") { S.paused = false; render(); }
  else if (act === "ai") { var it = S && S.items[S.i]; if (it) explainAI(QBY[it.id], it); }
  else if (act === "aistop") stopAI();
  else if (act === "flip") { CS.flipped = !CS.flipped; render(); var cd = app.querySelector(".card"); if (cd) cd.focus(); }
  else if (act === "rate") rateCard(el.getAttribute("data-k") === "1");
  else if (act === "cardsagain") { CS = null; render(); }
  else if (act === "reset") confirm2(el, "Confirmer la remise à zéro", function () { var t = Date.now(); P = freshProgress(); P.resetAt = t; P.updatedAt = t; saveLocal(); scheduleRemote(); CS = null; render(); });
});
document.addEventListener("change", function (e) {
  var el = e.target, ch = el.getAttribute && el.getAttribute("data-ch");
  if (!ch) return;
  if (ch === "opt" || ch === "sel") { if (S) readAnswers(); return; }
  if (ch === "dom") { var d = +el.value, i = CFG.doms.indexOf(d); if (el.checked && i < 0) CFG.doms.push(d); if (!el.checked && i >= 0) CFG.doms.splice(i, 1); }
  else if (ch === "count") CFG.count = +el.value;
  else if (ch === "order") CFG.order = el.value;
  else if (ch === "type") CFG.type = el.value;
  else if (ch === "half") XCFG.half = el.value === "1";
  else if (ch === "extra") XCFG.extra = el.value === "1";
  else if (ch === "cf") { var f = el.getAttribute("data-f"); CF[f] = f === "dom" ? +el.value : el.value; CS = null; render(); return; }
  var av = document.getElementById("avail"); if (av) av.textContent = availCount();
  var xs = document.getElementById("xspec"); if (xs) { var sp = examSpec(); xs.textContent = sp.n + " questions en " + sp.min + " minutes"; }
});
document.addEventListener("keydown", function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var t = e.target || {}, tag = (t.tagName || "").toLowerCase(), type = (t.type || "").toLowerCase();
  var typing = tag === "select" || tag === "textarea" || (tag === "input" && type !== "radio" && type !== "checkbox");
  if (view === "quiz" && S && !S.paused) {
    var it = S.items[S.i], q = QBY[it.id];
    if (e.key === "Enter") {
      if (tag === "button" || tag === "a" || tag === "summary" || tag === "select") return;
      e.preventDefault();
      if (!it.done) { readAnswers(); if (canValidate(q, it)) validateCurrent(); } else nextQuestion();
      return;
    }
    if (!it.done && q.t !== "d" && !typing && e.key.length === 1) {
      var k = LETTERS.indexOf(e.key.toUpperCase());
      if (k < 0 && /^[1-9]$/.test(e.key)) k = +e.key - 1;
      if (k >= 0 && k < q.o.length) { e.preventDefault(); toggleOpt(k); }
    }
  } else if (view === "cards" && CS && CS.i < CS.queue.length && !typing) {
    if (e.key === " " && tag !== "button") { e.preventDefault(); CS.flipped = !CS.flipped; render(); }
    else if (CS.flipped && e.key === "1") rateCard(false);
    else if (CS.flipped && e.key === "2") rateCard(true);
  }
});

/* ---------- boot ---------- */
window.__cbrops = { state: function () { return { S: S, R: R, P: P, view: view, CS: CS, sync: syncState }; }, merge: mergeProgress, normalize: normalize, fmt: fmt };
render();
setSync("local");
initDb();
initSample();

})();
</script>
</body>
</html>
