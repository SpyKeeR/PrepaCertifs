<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prépa 200-201 CCNA Cybersecurity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&amp;family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&amp;display=swap">
<style>
:root{
  --bg:#F2F4F8;--surface:#FFFFFF;--ink:#13203B;--muted:#56627D;--line:#D3D9E6;
  --accent:#0E6B6B;--accent-h:#0A5252;--accent-soft:#DCEFEE;--on-accent:#FFFFFF;
  --warn:#9A6200;--warn-bg:#FFF0CF;--ok:#1B7A45;--ok-bg:#DFF3E6;--bad:#B3261E;--bad-bg:#FBE4E1;
  --term-bg:#0F1B2D;--term-ink:#D7E3F4;
  --d1-bg:#E8E4FF;--d1-ink:#3A2E8C;--d2-bg:#DAEBFF;--d2-ink:#154A86;--d3-bg:#DFF5CF;--d3-ink:#2D5E12;
  --d4-bg:#FFF0C7;--d4-ink:#6B4E00;--d5-bg:#FFE0E6;--d5-ink:#8A1F3A;
  --sans:"Atkinson Hyperlegible Next","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626;--surface:#162136;--ink:#E6ECF7;--muted:#9AA8C2;--line:#2A3852;
    --accent:#4FC3C0;--accent-h:#7AD6D3;--accent-soft:#16383A;--on-accent:#062B2B;
    --warn:#F2C468;--warn-bg:#3A2F12;--ok:#6FD39A;--ok-bg:#153524;--bad:#FF9A92;--bad-bg:#43201D;
    --term-bg:#0A1120;--term-ink:#D7E3F4;
    --d1-bg:#2A2752;--d1-ink:#C9C2FF;--d2-bg:#1B3556;--d2-ink:#B5D6FF;--d3-bg:#21391A;--d3-ink:#BFE8A6;
    --d4-bg:#3A3114;--d4-ink:#F5DC8C;--d5-bg:#40212B;--d5-ink:#FFBECB;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626;--surface:#162136;--ink:#E6ECF7;--muted:#9AA8C2;--line:#2A3852;
  --accent:#4FC3C0;--accent-h:#7AD6D3;--accent-soft:#16383A;--on-accent:#062B2B;
  --warn:#F2C468;--warn-bg:#3A2F12;--ok:#6FD39A;--ok-bg:#153524;--bad:#FF9A92;--bad-bg:#43201D;
  --term-bg:#0A1120;--term-ink:#D7E3F4;
  --d1-bg:#2A2752;--d1-ink:#C9C2FF;--d2-bg:#1B3556;--d2-ink:#B5D6FF;--d3-bg:#21391A;--d3-ink:#BFE8A6;
  --d4-bg:#3A3114;--d4-ink:#F5DC8C;--d5-bg:#40212B;--d5-ink:#FFBECB;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:1rem 1rem 4rem}
h1{font-size:1.5rem;line-height:1.2;margin:0}
h2{font-size:1.25rem;margin:1.75rem 0 .6rem;line-height:1.25}
h3{font-size:1.05rem;margin:1.25rem 0 .4rem}
p{margin:.5rem 0}
code{font-family:var(--mono);font-size:.92em;background:var(--accent-soft);padding:.05em .3em;border-radius:4px;overflow-wrap:anywhere}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

/* header and nav */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;padding:.25rem 0 1rem}
.top .brand{font-weight:700;font-size:1.05rem;margin-right:auto}
.top .brand span{color:var(--muted);font-weight:400}
nav{display:flex;flex-wrap:wrap;gap:.25rem}
nav button{background:none;border:0;color:var(--ink);font:inherit;padding:.4rem .7rem;border-radius:6px;cursor:pointer}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.sync{font-size:.82rem;color:var(--muted);font-family:var(--mono);width:100%}
body.focus .top nav, body.focus .sync{display:none}

/* buttons */
.btn{font:inherit;font-weight:600;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:.6rem 1rem;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:400}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.armed{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1 1 auto}

/* packet list hero */
.pktbox{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);margin:.75rem 0 1rem}
.pktt{font-family:var(--mono);font-size:.82rem;color:var(--muted);padding:.4rem .75rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:1rem}
.pkth,.pkt{display:grid;grid-template-columns:3.2ch minmax(0,1fr) 6ch 9ch 9ch;gap:.75rem;padding:.5rem .75rem;font-family:var(--mono);font-size:.92rem;text-align:left;align-items:center}
.pkth{color:var(--muted);font-size:.8rem;border-bottom:1px solid var(--line);padding-top:.35rem;padding-bottom:.35rem}
.pkt{width:100%;border:0;border-bottom:1px solid var(--surface);cursor:pointer;font-weight:400;line-height:1.35}
.pkt:hover{box-shadow:inset 4px 0 0 currentColor}
.pkt:focus-visible{outline-offset:-3px}
.pkt .c-name{font-weight:700;overflow-wrap:anywhere}
.c-w,.c-seen,.c-pct{text-align:right}
.d1{background:var(--d1-bg);color:var(--d1-ink)}.d2{background:var(--d2-bg);color:var(--d2-ink)}
.d3{background:var(--d3-bg);color:var(--d3-ink)}.d4{background:var(--d4-bg);color:var(--d4-ink)}
.d5{background:var(--d5-bg);color:var(--d5-ink)}
.pktd{font-family:var(--mono);font-size:.85rem;color:var(--muted);padding:.5rem .75rem;border-top:1px solid var(--line)}
.pktd div{padding:.1rem 0;display:flex;gap:.5rem}
.pktd div::before{content:"";flex:none;margin-top:.45em;border:.32em solid transparent;border-left-color:currentColor;border-right-width:0;height:0}
@media (max-width:560px){
  .pkth,.pkt{grid-template-columns:2.4ch minmax(0,1fr) 8ch;gap:.5rem}
  .c-w,.c-seen{display:none}
}

/* panels, forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin:1rem 0}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:.75rem 1rem;margin:1rem 0}
.banner .btn{margin-top:.4rem}
fieldset{border:0;padding:0;margin:1rem 0}
legend{font-weight:700;padding:0;margin-bottom:.4rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{border:1.5px solid var(--line);border-radius:999px;padding:.35rem .8rem;background:var(--surface);font-size:.95rem}
.chip input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:.5rem .6rem;max-width:100%;min-height:44px}

/* quiz */
.qband{display:flex;flex-wrap:wrap;gap:.25rem 1rem;align-items:baseline;border-radius:10px 10px 0 0;padding:.6rem 1rem;font-size:.92rem}
.qband b{font-size:1rem}
.qband .timer{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:1.05rem}
.qband .timer.low{color:var(--bad)}
.qprog{height:4px;background:var(--line)}
.qprog i{display:block;height:100%;background:var(--accent)}
.qbody{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:1.1rem 1.1rem 1.25rem}
.qtext{font-size:1.15rem;line-height:1.5;margin:0 0 .9rem}
.hint{color:var(--muted);font-size:.92rem;margin:.25rem 0 .75rem}
pre.term{background:var(--term-bg);color:var(--term-ink);font-family:var(--mono);font-size:.84rem;line-height:1.5;padding:.85rem 1rem;border-radius:8px;overflow-x:auto;margin:0 0 1rem;white-space:pre;tab-size:4}
.opts{display:grid;gap:.5rem;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:.7rem;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:.7rem .85rem;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt input{margin:.3rem 0 0;width:1.1rem;height:1.1rem;accent-color:var(--accent);flex:none}
.opt .badge{font-family:var(--mono);font-weight:700;color:var(--muted);flex:none;min-width:1.2ch}
.opt .txt{flex:1 1 auto;overflow-wrap:anywhere}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt.done{cursor:default}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.mark{display:block;font-size:.85rem;font-weight:700;margin-top:.2rem}
.good .mark{color:var(--ok)}.wrong .mark{color:var(--bad)}
.match{display:grid;gap:.6rem}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,17rem);gap:.6rem;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:.6rem .8rem}
.mrow.good{border-color:var(--ok);background:var(--ok-bg)}
.mrow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.mrow select{width:100%}
@media (max-width:620px){.mrow{grid-template-columns:1fr}}
.verdict{font-weight:700;font-size:1.1rem;margin:1rem 0 .5rem}
.verdict.ok{color:var(--ok)}.verdict.ko{color:var(--bad)}
.exp{border-left:4px solid var(--accent);padding:.1rem 0 .1rem .9rem;margin:.9rem 0}
.trap{border-left:4px solid var(--warn);padding:.1rem 0 .1rem .9rem;margin:.9rem 0}
.trap b:first-child,.exp b:first-child{display:block;font-size:.85rem;color:var(--muted);font-weight:700}
.ref{font-family:var(--mono);font-size:.82rem;color:var(--muted);margin:.75rem 0}
.ai{display:none}
body.has-ai .ai{display:block}
.aibox{border:1px dashed var(--line);border-radius:10px;padding:.75rem .9rem;margin:.6rem 0;white-space:pre-wrap}
.aibox .tag{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.3rem}
.qactions{margin-top:1.1rem}
.paused{text-align:center;padding:2.5rem 1rem}

/* results, stats */
.score{font-size:2.6rem;font-weight:700;line-height:1;font-family:var(--mono)}
.bars{display:grid;gap:.45rem;margin:.75rem 0}
.bar{display:grid;grid-template-columns:minmax(0,14rem) minmax(0,1fr) 7.5ch;gap:.6rem;align-items:center;font-size:.92rem}
.bar .track{height:.8rem;background:var(--line);border-radius:999px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar .track i.low{background:var(--bad)}.bar .track i.mid{background:var(--warn)}
.bar .v{font-family:var(--mono);text-align:right}
@media (max-width:560px){.bar{grid-template-columns:minmax(0,1fr) 7.5ch}.bar .track{grid-column:1 / -1;order:3}}
details{border:1px solid var(--line);border-radius:10px;padding:.6rem .85rem;margin:.5rem 0;background:var(--surface)}
summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:.6rem}
.tw{overflow-x:auto;margin:.75rem 0}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border:1px solid var(--line);padding:.4rem .55rem;text-align:left;vertical-align:top}
th{background:var(--accent-soft)}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
tr.weak td{background:var(--bad-bg)}

/* flashcards */
.card{display:block;width:100%;min-height:15rem;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:1.4rem 1.3rem;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card .side{font-size:.82rem;color:var(--muted);font-family:var(--mono);display:block;margin-bottom:.8rem}
.card .term{font-size:1.5rem;font-weight:700;line-height:1.25}
.card .def{font-size:1.1rem}
.card .conf{margin-top:1rem;border-left:4px solid var(--warn);padding-left:.8rem;font-size:.98rem}
.card .conf b{display:block;font-size:.82rem;color:var(--muted)}
.dtag{display:inline-block;font-family:var(--mono);font-size:.8rem;border-radius:4px;padding:.05rem .4rem;font-weight:700}

/* memo */
.memo blockquote{margin:1rem 0;padding:.5rem 1rem;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0}
.memo h1{margin-bottom:1rem}
.memo h2{padding-top:.5rem;border-top:1px solid var(--line)}
.memo li{margin:.25rem 0}
.toc{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0 1rem}
.toc button{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.25rem .7rem;cursor:pointer}
.toc button:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.qprog i,.bar .track i{transition:width .25s ease}}

.qbody:focus{outline:none}

</style>
</head>

<div class="wrap">
<header class="top">
  <div class="brand">200-201 <span>CCNA Cybersecurity</span></div>
  <nav aria-label="Navigation principale">
    <button type="button" data-act="nav" data-v="home">Accueil</button>
    <button type="button" data-act="nav" data-v="cards">Flashcards</button>
    <button type="button" data-act="nav" data-v="memo">Mémo</button>
    <button type="button" data-act="nav" data-v="stats">Stats</button>
  </nav>
  <div class="sync" id="sync" role="status"></div>
</header>
<main id="app"></main>
</div>
<template id="memo-src"><h1>CCNA Cybersecurity 200-201 (CCNACBR v1.2) : fiche de révision express</h1>
<blockquote>
<p><strong>Objectif</strong> : ancrer la terminologie, les modèles et la nomenclature. Les technos, tu les connais. Ici on travaille le vocabulaire exact que l'examen attend, en anglais.</p>
<p><strong>Mode d'emploi</strong> : lis une section, puis enchaîne tout de suite sur les questions du même domaine dans l'entraîneur. La fiche sert de filet de sécurité, pas de cours.</p>
</blockquote>
<h2>1. L'examen en 30 secondes</h2>
<div class="tw"><table>
<thead>
<tr>
<th>Élément</th>
<th>Valeur</th>
</tr>
</thead>
<tbody>
<tr>
<td>Code et nom</td>
<td>200-201 CCNACBR v1.2 (ex-CBROPS), certification <strong>CCNA Cybersecurity</strong></td>
</tr>
<tr>
<td>Durée</td>
<td>120 min (extension possible pour non anglophones, à vérifier sur la confirmation Pearson VUE)</td>
</tr>
<tr>
<td>Langue</td>
<td>Anglais uniquement</td>
</tr>
<tr>
<td>Questions</td>
<td>Environ 95 à 105 (non publié par Cisco)</td>
</tr>
<tr>
<td>Types</td>
<td>Choix unique, choix multiples (Choose two/three), drag-and-drop, exhibits (logs, pcap, alertes)</td>
</tr>
<tr>
<td>Labs</td>
<td>Non attendus : le blueprint n'utilise que Describe, Compare, Identify, Interpret, Map, Classify</td>
</tr>
<tr>
<td>Navigation</td>
<td><strong>Aucun retour arrière</strong> : une question validée est définitive</td>
</tr>
<tr>
<td>Score</td>
<td>Échelle 300 à 1000, seuil non publié. Vise <strong>85 %</strong> à l'entraînement</td>
</tr>
</tbody>
</table></div>
<p><strong>Pondération</strong> : D1 Security Concepts 20 %, D2 Security Monitoring 25 %, D3 Host-Based Analysis 20 %, D4 Network Intrusion Analysis 20 %, D5 Security Policies and Procedures 15 %.</p>
<p><strong>Stratégie sans retour arrière</strong></p>
<ul>
<li>Budget moyen : 70 secondes par question. Un exhibit long peut en prendre 120, une définition 20.</li>
<li>Lis d'abord la <strong>dernière phrase</strong> de l'énoncé (ce qu'on te demande), ensuite l'exhibit.</li>
<li>« Choose two » : le nombre est imposé. Élimine d'abord les propositions absurdes.</li>
<li>Deux réponses vraies ? Prends la <strong>plus spécifique</strong> (PHI plutôt que PII) ou celle qui colle au mot clé de l'énoncé : <em>first, most, best, primary</em>.</li>
<li>Bloqué depuis 2 minutes : tranche et avance. Toutes les questions pèsent pareil.</li>
</ul>
<h2>2. Les paires qui se confondent</h2>
<p>C'est ici que se perdent les points quand on maîtrise la technique mais pas le vocabulaire.</p>
<div class="tw"><table>
<thead>
<tr>
<th>Terme A</th>
<th>Terme B</th>
<th>Comment trancher</th>
</tr>
</thead>
<tbody>
<tr>
<td>Threat</td>
<td>Vulnerability</td>
<td>Danger potentiel vs faiblesse exploitable</td>
</tr>
<tr>
<td>Vulnerability</td>
<td>Attack surface</td>
<td>Une faiblesse précise vs la somme des points exposés</td>
</tr>
<tr>
<td>Exploit</td>
<td>Payload</td>
<td>Ce qui ouvre la porte vs ce qui est déposé derrière</td>
</tr>
<tr>
<td>Risk</td>
<td>Threat</td>
<td>Probabilité × impact vs le danger lui-même</td>
</tr>
<tr>
<td>DAC</td>
<td>MAC</td>
<td>Le propriétaire décide vs le système impose (labels)</td>
</tr>
<tr>
<td>Role-based</td>
<td>Rule-based</td>
<td>Fonction métier vs règles type ACL</td>
</tr>
<tr>
<td>SIEM</td>
<td>SOAR</td>
<td>Voir (corréler, alerter) vs agir (playbooks)</td>
</tr>
<tr>
<td>Threat intelligence</td>
<td>Threat hunting</td>
<td>S'informer sur le dehors vs chercher chez soi sur hypothèse</td>
</tr>
<tr>
<td>IDS</td>
<td>IPS</td>
<td>Copie du trafic, alerte vs inline, bloque</td>
</tr>
<tr>
<td>Tap</td>
<td>SPAN</td>
<td>Matériel passif sans perte vs mirroring du switch qui peut dropper</td>
</tr>
<tr>
<td>NetFlow</td>
<td>Full packet capture</td>
<td>La facture téléphonique vs l'enregistrement de l'appel</td>
</tr>
<tr>
<td>Session data</td>
<td>Transaction data</td>
<td>Résumé de la conversation vs requêtes et réponses dedans</td>
</tr>
<tr>
<td>Packet filtering</td>
<td>Stateful</td>
<td>ACL sans mémoire vs table d'états (toujours L3/L4)</td>
</tr>
<tr>
<td>Stateful</td>
<td>Deep packet inspection</td>
<td>L3/L4 vs contenu applicatif L7</td>
</tr>
<tr>
<td>False positive</td>
<td>False negative</td>
<td>Alerte sans attaque vs attaque sans alerte (le pire)</td>
</tr>
<tr>
<td>False positive</td>
<td>Benign</td>
<td>Détection erronée vs détection exacte d'une activité légitime</td>
</tr>
<tr>
<td>SQL injection</td>
<td>Command injection</td>
<td>Exécuté par la base vs exécuté par l'OS</td>
</tr>
<tr>
<td>SQL injection</td>
<td>XSS</td>
<td>Cible le serveur vs cible le navigateur de la victime</td>
</tr>
<tr>
<td>Hashing</td>
<td>Encryption</td>
<td>Intégrité, irréversible vs confidentialité, réversible avec la clé</td>
</tr>
<tr>
<td>Symmetric</td>
<td>Asymmetric</td>
<td>Une clé partagée, rapide vs paire de clés, lent, sert à l'échange</td>
</tr>
<tr>
<td>IoC</td>
<td>IoA</td>
<td><strong>C</strong>'est arrivé (artefact) vs <strong>A</strong>ction en cours (comportement)</td>
</tr>
<tr>
<td>Best evidence</td>
<td>Corroborative evidence</td>
<td>L'original vs ce qui confirme une autre preuve</td>
</tr>
<tr>
<td>Corroborative</td>
<td>Indirect evidence</td>
<td>Confirme vs suggère par déduction</td>
</tr>
<tr>
<td>Static analysis</td>
<td>Dynamic analysis</td>
<td>Sans exécuter vs exécution en sandbox</td>
</tr>
<tr>

<h2>4. Domaine 1 : Security Concepts (20 %)</h2>
<p><strong>CIA</strong> : Confidentiality (chiffrement, contrôle d'accès), Integrity (hash, signature, HMAC), Availability (redondance, sauvegardes, anti-DDoS). Dans un scénario, cherche le verbe : <em>read, disclosed</em> = C, <em>altered, modified</em> = I, <em>cannot access, down</em> = A.</p>
<p><strong>Déploiements (1.2)</strong></p>
<ul>
<li>Network, endpoint, application : NGFW et IPS, EDR et antimalware, WAF.</li>
<li>Legacy antivirus = signatures. Antimalware moderne = heuristique, comportement, machine learning, cloud.</li>
<li>Log management (stocker, chercher), SIEM (corréler, alerter), SOAR (orchestrer, automatiser).</li>
<li>Conteneurs : noyau <strong>partagé</strong> avec l'hôte, isolation par namespaces et cgroups. VM : OS invité complet, isolation par l'hyperviseur.</li>
<li>Cloud : shared responsibility. En IaaS le client gère l'OS invité, les applis, les données. Les <strong>données et les accès restent toujours au client</strong>. CASB = usage des SaaS, CSPM = mauvaises configurations, CWPP = workloads.</li>
</ul>
<p><strong>Risque (1.4)</strong> : risk = likelihood × impact. Quatre traitements : <em>avoidance, reduction (mitigation), sharing (transfer), retention (acceptance)</em>.</p>

<p>Échelle : None 0.0, Low 0.1 à 3.9, Medium 4.0 à 6.9, High 7.0 à 8.9, Critical 9.0 à 10.0.</p>
<p><strong>Visibilité et détection (1.8 à 1.11)</strong></p>
<ul>
<li>Défis de visibilité : chiffrement, NAT, tunnels côté réseau. Agents absents ou logs désactivés côté hôte. Pas d'accès au réseau sous-jacent côté cloud (on dépend des API et des flow logs).</li>
<li>Perte de données dans un profil de trafic : gros volume sortant, horaires inhabituels, destination rare, DNS anormal (tunneling), protocole inattendu.</li>
<li>5-tuple : src IP, dst IP, src port, dst port, protocol. C'est la clé pour recouper firewall, proxy, NetFlow et IDS et isoler l'hôte compromis.</li>
<li>Rule-based (signatures, connu) vs behavioral (écart de comportement) vs statistical (écart chiffré à une baseline). Les deux derniers attrapent l'inconnu, avec plus de faux positifs.</li>
</ul>

<p><strong>Attaques à nommer (2.5 à 2.9)</strong></p>
<ul>
<li>Réseau : SYN flood, amplification et reflection (DNS, NTP), ARP spoofing, DNS poisoning, on-path (MITM).</li>
<li>Web : SQL injection (<code>' OR 1=1 --</code>), command injection (<code>; cat /etc/passwd</code>), XSS (<code>&lt;script&gt;</code>), directory traversal (<code>../../</code>).</li>
<li>Social engineering : phishing, spear phishing, whaling, vishing, smishing, pretexting, baiting, tailgating. Version IA générative : textes sans fautes, personnalisation de masse, deepfakes voix et vidéo.</li>
<li>Endpoint : buffer overflow, C2 (beaconing), malware (virus, worm, trojan, rootkit, fileless), ransomware.</li>
<li>Évasion : tunneling, chiffrement, proxies, fragmentation, resource exhaustion, timing lent, traffic substitution.</li>
</ul>

<p>Seule la <strong>clé publique</strong> (dans le certificat) traverse le réseau. La clé privée ne quitte jamais le serveur. L'asymétrique établit la session, le symétrique chiffre les données. Côté SOC, le chiffrement aveugle l'inspection : il faut du déchiffrement TLS (CA interne de confiance) ou se contenter des métadonnées.</p>
<h2>6. Domaine 3 : Host-Based Analysis (20 %)</h2>
<p><strong>Technologies endpoint (3.1)</strong> : HIDS (intégrité de fichiers, logs, processus), antimalware/antivirus, host-based firewall, application allow listing et block listing, systems-based sandboxing, predictive AI (machine learning qui classe l'inconnu sans signature).</p>
<p><strong>Composants Windows (3.2)</strong> : process, thread, handle, service. Registre : HKLM, HKCU, HKU, HKCR, HKCC, persistance dans <code>Run</code> et <code>RunOnce</code>. NTFS : MFT, horodatages MACE, Alternate Data Streams. WMI. Commandes : <code>tasklist</code>, <code>netstat -ano</code>, <code>Get-Process</code>, <code>net user</code>, <code>schtasks</code>.</p>
<p><strong>Composants Linux (3.2)</strong> : daemon, fork, PID 1 (systemd), permissions rwx et SUID, symlink vs hard link. Logs : <code>/var/log/auth.log</code> (Debian) ou <code>/var/log/secure</code> (RHEL), <code>/var/log/syslog</code> ou <code>messages</code>, <code>journalctl</code>. Commandes : <code>ps aux</code>, <code>ss -tulpn</code>, <code>lsof -i</code>, <code>last</code>, <code>crontab -l</code>.</p>

<p><strong>Motifs à reconnaître dans les logs (3.5)</strong></p>
<ul>
<li>Rafale de 4625 puis un 4624 : brute force réussi.</li>
<li>1102 juste après une activité admin : effacement de traces.</li>

<p><strong>Comparaisons (4.3 à 4.5)</strong></p>
<ul>
<li>Packet filtering : ACL sans état, L3/L4. Stateful : table d'états, autorise le retour, L3/L4. DPI : contenu L7, signatures, applications.</li>
<li>Inline (IPS) : peut bloquer, ajoute latence et point de panne. Tap ou SPAN (IDS) : copie, aucun impact, ne bloque rien.</li>
<li>Tap/capture : paquets complets, analyse du payload, stockage lourd. NetFlow : résumé, rétention longue, pas de contenu.</li>
</ul>
<p><strong>Wireshark et pcap (4.6, 4.7)</strong> : <em>File &gt; Export Objects</em> (HTTP, SMB), <em>Follow TCP Stream</em> puis enregistrer en raw. Éléments clés d'une intrusion : adresses et ports source et destination, protocoles, payload. Port well-known = serveur, port éphémère = client.</p>

<th>Motif</th>
<th>Sens</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>.</code> <code>*</code> <code>+</code> <code>?</code></td>
<td>Un caractère, 0 ou plus, 1 ou plus, 0 ou 1</td>
</tr>
<tr>
<td><code>^</code> <code>$</code></td>
<td>Début, fin de ligne</td>
</tr>
<tr>
<td><code>[abc]</code> <code>[^abc]</code> <code>[a-z]</code></td>
<td>Classe, négation, intervalle</td>
</tr>
<tr>
<td><code>\d</code> <code>\w</code> <code>\s</code></td>
<td>Chiffre, caractère de mot, espace</td>
</tr>
<tr>
<td><code>{n}</code> <code>{n,m}</code></td>
<td>Répétition exacte, bornée</td>
</tr>
<tr>
<td><code>(a|b)</code></td>
<td>Alternative</td>
</tr>
<tr>
<td><code>\.</code></td>
<td>Point littéral (échappé)</td>
</tr>
</tbody>
</table></div>
<p>Exemple : <code>^192\.168\.\d{1,3}\.\d{1,3}$</code> matche une IP en 192.168.x.x.</p>
<h2>8. Domaine 5 : Security Policies and Procedures (15 %)</h2>
<p><strong>Management (5.1)</strong> : asset (inventaire), configuration (baseline, drift), MDM (mobiles, remote wipe), patch (agent-based, agentless scanning, passive network monitoring), vulnerability (cycle en 6 étapes).</p>
<p><strong>NIST SP 800-61 r2 (5.2 à 5.5)</strong></p>
<div class="tw"><table>
<thead>
<tr>
<th>Document</th>
<th>Contenu</th>
</tr>
</thead>
<tbody>
<tr>
<td>Policy</td>
<td>Engagement de la direction, objectifs, périmètre, définitions, rôles et niveaux d'autorité, sévérités, mesures de performance, formulaires</td>
</tr>
<tr>
<td>Plan</td>
<td>Mission, stratégies et objectifs, approbation de la direction, approche organisationnelle, communication, métriques, roadmap, intégration dans l'organisation</td>
</tr>
<tr>
<td>Procedures (SOP)</td>
<td>Processus techniques, checklists, formulaires</td>
</tr>
</tbody>
</table></div>
<div class="tw"><table>
<thead>
<tr>
<th>Phase</th>
<th>Ce qu'on y range</th>
</tr>
</thead>
<tbody>
<tr>
<td>Preparation</td>
<td>Former le CSIRT, outils, jump kit, <strong>prévention</strong> (risk assessment, sensibilisation)</td>
</tr>
<tr>
<td>Detection and analysis</td>
<td>Vecteurs d'attaque, precursors et indicators, analyse, documentation, <strong>priorisation</strong>, notification</td>
</tr>
<tr>
<td>Containment, eradication and recovery</td>
<td>Stratégie de confinement, <strong>collecte de preuves</strong>, identification de l'attaquant, nettoyage, remise en production</td>
</tr>
<tr>
<td>Post-incident activity</td>
<td>Lessons learned, exploitation des données d'incident, <strong>evidence retention</strong></td>
</tr>
</tbody>
</table></div>
<ul>
<li>Vecteurs d'attaque : external/removable media, <strong>attrition</strong> (brute force, DDoS), web, email, <strong>impersonation</strong> (spoofing, MITM, rogue AP), <strong>improper usage</strong> (utilisateur autorisé qui viole la charte), loss or theft of equipment.</li>
<li>Priorisation : functional impact, information impact (none, privacy breach, proprietary breach, integrity loss), recoverability (regular, supplemented, extended, not recoverable).</li>
<li>Critères de confinement : dommages potentiels, préservation des preuves, disponibilité du service, temps et ressources, efficacité, durée de la solution.</li>
<li>Équipes : central, distributed, coordinating. Staffing : employees, partially outsourced, fully outsourced.</li>
</ul>
<p><strong>Parties prenantes (5.5)</strong> : Management (politiques, budget, coordination), Information assurance (changer des règles firewall), IT support (connaît la techno, préserve les preuves), Legal (conformité, poursuites), Public affairs (presse, public), Human resources (sanctions), Business continuity planners (ajuster les plans), Physical security and facilities (intrusion physique, locaux des preuves). <strong>CMMC</strong> : maturité cyber des sous-traitants du DoD, domaine IR à 5 capacités (plan, detect and report, respond, post-incident review, test).</p>
<p><strong>NIST SP 800-86 (5.6)</strong> : Collection, Examination, Analysis, Reporting. Intégrité : write blocker, image bit à bit, hash de l'original et de la copie, travail sur la copie. Préservation : ne pas éteindre avant d'avoir capturé la mémoire. Outils lancés depuis un support de confiance, jamais les binaires de l'hôte compromis.</p>
<p><strong>Données protégées (5.9)</strong> : PII, PSI, PHI (HIPAA), intellectual property. PCI DSS = cartes bancaires, GDPR = données personnelles UE, SOX = reporting financier.</p>
<p><strong>Cyber Kill Chain (5.10)</strong></p>
<div class="tw"><table>
<thead>
<tr>
<th>Phase</th>
<th>Mot clé dans l'énoncé</th>
</tr>
</thead>
<tbody>
<tr>
<td>Reconnaissance</td>
<td>harvesting, scanning, OSINT</td>
</tr>
<tr>
<td>Weaponization</td>
<td>couples exploit with payload, builds, no target yet</td>
</tr>
<tr>
<td>Delivery</td>
<td>email attachment, USB, malicious link, drive-by</td>
</tr>
<tr>
<td>Exploitation</td>
<td>vulnerability triggered, code executes</td>
</tr>
<tr>
<td>Installation</td>
<td>backdoor, persistence, registry Run key, service, web shell</td>
</tr>
<tr>
<td>Command and control</td>
<td>beacon, callback, receives instructions</td>
</tr>
<tr>
<td>Actions on objectives</td>
<td>exfiltration, encryption, destruction, lateral movement</td>
</tr>
</tbody>
</table></div>
<p><strong>Diamond Model</strong> : un événement = un adversaire déploie une capacité via une infrastructure contre une victime. <em>Pivoting</em> = partir d'un sommet connu pour découvrir les autres. MITRE ATT&amp;CK (hors blueprint strict) : tactic = le pourquoi, technique = le comment.</p>
<p><strong>Métriques SOC (5.11)</strong></p>
<div class="tw"><table>
<thead>
<tr>
<th>Métrique</th>
<th>Définition</th>
</tr>
</thead>
<tbody>
<tr>
<td>Dwell time</td>
<td>Durée d'accès de l'attaquant avant détection et arrêt</td>
</tr>
<tr>
<td>MTTD</td>
<td>Temps moyen pour identifier un incident valide</td>
</tr>
<tr>
<td>MTTR</td>
<td>Temps moyen pour stopper et remédier (respond)</td>
</tr>
<tr>
<td>MTTC</td>
<td>Temps pour empêcher l'incident de causer plus de dégâts</td>
</tr>
<tr>
<td>Time to control</td>
<td>Temps pour stopper la propagation du malware</td>
</tr>
</tbody>
</table></div>
<p>Lien avec le scope : détection tardive = plus d'hôtes, de comptes et de données à examiner, et une rétention de logs qui peut ne plus couvrir le début de l'intrusion.</p>
<h2>9. Pièges de version et de nommage</h2>
<ul>
<li><strong>NIST SP 800-61</strong> : la r3 (avril 2025) remplace la r2 et s'aligne sur le CSF 2.0. Le blueprint garde les 4 phases de la r2. Apprends la r2.</li>
<li><strong>CVSS</strong> : examen en v3.x (Scope, Temporal, Environmental). La v4.0 supprime Scope et renomme Temporal en Threat.</li>
<li><strong>NetFlow</strong> : le blueprint le range dans « transaction data » (4.1, 4.5), alors que beaucoup de cours le classent en session data. Si l'énoncé dit <em>transactional data (NetFlow)</em>, ne tique pas.</li>
<li><strong>Produits Cisco renommés</strong> : Threat Grid = Secure Malware Analytics, Stealthwatch = Secure Network Analytics, AMP for Endpoints = Secure Endpoint, Firepower = Secure Firewall. Talos = threat intelligence, Umbrella = sécurité DNS.</li>
<li><strong>Points récents du blueprint</strong> : social engineering par IA générative (2.7), predictive AI (3.1), logs SIEM et SOAR (3.5), conteneurs (1.2.e), threat modeling et DevSecOps (1.3), HTTP/2 (4.8.i), IoA (3.3.d), CMMC (5.5).</li>
</ul>
<h2>10. Jour J</h2>
<ol>
<li>Vérifie la durée exacte sur ta confirmation Pearson VUE (extension non anglophone).</li>
<li>En ligne (OnVUE) : bureau vide, pas de main devant la bouche, pas de lecture à voix haute, webcam stable.</li>
<li>Première passe mentale : « qu'est-ce qu'on me demande ? » avant de lire l'exhibit.</li>
<li>Rythme : un coup d'œil au chrono toutes les 20 questions. À mi-temps tu dois avoir dépassé la moitié.</li>
<li>Drag-and-drop : place d'abord les associations dont tu es sûr, le reste se déduit.</li>
<li>Pas de retour arrière : ne rumine pas la question précédente, elle est partie.</li>
</ol>
<h2>11. Plan de révision avec l'entraîneur</h2>
<ol>
<li><strong>Diagnostic</strong> : un examen blanc mi-format (50 questions) pour situer chaque domaine.</li>
<li><strong>Boucle par domaine</strong>, en commençant par le plus faible : section de la fiche (5 minutes), puis session de 20 questions, puis « Rejouer mes erreurs ».</li>
<li><strong>Terminologie tous les jours</strong> : 10 minutes de flashcards, d'abord terme vers définition, puis définition vers terme.</li>
<li><strong>Quiz dynamique en chat</strong> : volées de 5 questions avec justification, pour travailler le raisonnement et les zones que l'app signale comme faibles.</li>
<li><strong>Validation</strong> : deux examens blancs complets à 85 % ou plus, à plusieurs jours d'écart, avant de réserver le créneau.</li>
</ol></template>

to NIST SP 800-61 steps","5.5":"Stakeholders and NIST IR categories (CMMC)","5.6":"NIST SP 800-86 forensics concepts","5.7":"Network profiling elements","5.8":"Server profiling elements","5.9":"Protected data","5.10":"Cyber Kill Chain and Diamond Model","5.11":"SOC metrics and scope analysis"},"questions":[{"t":"s","ref":"1.1","q":"Ransomware encrypts the patient-record database of a hospital. Staff can no longer open any record. Which component of the CIA triad is primarily affected?","o":["Confidentiality","Integrity","Availability","Non-repudiation"],"a":[2],"e":"Les données existent toujours mais ne sont plus **accessibles** aux utilisateurs légitimes : c'est la **disponibilité** (Availability) qui tombe. La confidentialité ne serait touchée que si les données étaient aussi exfiltrées (double extorsion).","trap":"Non-repudiation ne fait pas partie de la triade CIA. Si l'énoncé dit « cannot access », pense Availability ; s'il dit « altered », pense Integrity.","id":"1-001","d":1},{"t":"s","ref":"1.1","q":"An attacker intercepts a wire-transfer request in transit and changes the destination account number before forwarding it. Which security principle has been violated?","o":["Availability","Integrity","Confidentiality","Accounting"],"a":[1],"e":"La donnée a été **modifiée** sans autorisation : c'est l'**intégrité**. Les contrôles typiques sont le hashing, les signatures numériques et les HMAC.","trap":"L'attaquant a aussi *lu* la requête, mais la question porte sur le changement du numéro de compte : l'exam attend le principe le plus directement violé.","id":"1-002","d":1},{"t":"s","ref":"1.1","q":"Which control primarily protects the confidentiality of data stored on a laptop that is stolen from a car?","o":["RAID 1 mirroring","SHA-256 file hashing","Full-disk encryption","An uninterruptible power supply"],"a":[2],"e":"Le chiffrement du disque empêche la **lecture** des données par un tiers : confidentialité. RAID et UPS servent la disponibilité, le hashing sert l'intégrité.","trap":"Hashing ≠ chiffrement : un hash vérifie qu'un fichier n'a pas changé, il ne cache rien.","id":"1-003","d":1},{"t":"s","ref":"1.2","q":"A security team must monitor several hundred IP cameras and badge readers that cannot run third-party software. Which protection approach fits this constraint?","o":["Agent-based protection","Agentless protection","Host-based intrusion prevention","Application allow listing on each device"],"a":[1],"e":"Sans possibilité d'installer un logiciel, on passe par de l'**agentless** : scans réseau, SNMP, API, analyse de flux. Contrepartie : moins de visibilité fine sur ce qui se passe *dans* l'équipement.","trap":"Agent-based = visibilité profonde (processus, fichiers, mémoire) mais déploiement et maintenance sur chaque hôte. Agentless = couverture large, profondeur limitée.","id":"1-004","d":1},{"t":"s","ref":"1.2","q":"What is the main limitation of legacy signature-based antivirus software?","o":["It cannot scan compressed files","It requires an always-on cloud connection","It cannot detect malware for which no signature exists yet","It generates too many false negatives for known malware"],"a":[2],"e":"L'antivirus « legacy » compare des fichiers à une base de **signatures connues**. Un zero-day, un malware polymorphe ou fileless passe au travers. Les solutions antimalware modernes (EDR, NGAV) ajoutent heuristique, analyse comportementale et machine learning.","trap":"Pour un malware *connu*, la détection par signature est au contraire très fiable (peu de faux positifs et de faux négatifs).","id":"1-005","d":1},{"t":"s","ref":"1.2","q":"Which capability distinguishes a SOAR platform from a SIEM?","o":["Collecting and normalizing logs from many sources","Correlating events in real time to raise alerts","Long-term retention of log data for compliance","Executing automated response playbooks across multiple security tools"],"a":[3],"e":"Le **SIEM** collecte, normalise, corrèle et alerte. Le **SOAR** (Security Orchestration, Automation and Response) **agit** : il orchestre les outils, exécute des playbooks et gère les dossiers d'incident.","trap":"Moyen mnémo : SIEM = *voir*, SOAR = *agir*. Les deux sont souvent couplés, d'où les questions pièges.","id":"1-006","d":1},{"t":"s","ref":"1.2","q":"Which function is provided by a SIEM but not by a basic log management system?","o":["Centralized storage of syslog messages","Real-time correlation of events coming from different sources","Log rotation and archiving","Keyword search in stored logs"],"a":[1],"e":"Le log management stocke, indexe et permet de chercher. Le SIEM ajoute la **corrélation temps réel** entre sources (firewall + AD + proxy…), les alertes et les tableaux de bord sécurité.","id":"1-007","d":1},{"t":"s","ref":"1.2","q":"From a security standpoint, which statement correctly compares containers with virtual machines?","o":["Containers each run their own kernel, so they are better isolated than VMs","Containers share the host OS kernel, so a kernel vulnerability can affect every container on that host","VMs share the host kernel, so they start faster than containers","Containers cannot be scanned for vulnerabilities before deployment"],"a":[1],"e":"Un conteneur partage le **noyau de l'hôte** (isolation par namespaces et cgroups) : une faille noyau ou un « container escape » expose tous les conteneurs. Une VM embarque son propre OS et s'appuie sur l'hyperviseur : isolation plus forte, mais plus lourde.","trap":"Côté bonnes pratiques conteneurs : scanner les images, ne pas tourner en root, images minimales et signées, sécuriser l'orchestrateur.","id":"1-008","d":1},{"t":"s","ref":"1.2","q":"A company hosts its application on virtual machines rented from an IaaS provider. According to the shared responsibility model, which task belongs to the customer?","o":["Physical security of the data center","Patching the hypervisor","Patching the guest operating system and securing the application data","Replacing failed storage hardware"],"a":[2],"e":"En **IaaS**, le fournisseur gère le physique, le réseau sous-jacent et l'hyperviseur. Le client gère l'OS invité, les applications, les identités et les données. Plus on monte vers SaaS, plus la part du fournisseur grandit, mais les **données et les accès restent toujours au client**.","id":"1-009","d":1},{"t":"s","ref":"1.2","q":"An organization wants visibility and policy enforcement over the sanctioned and unsanctioned SaaS applications used by its employees. Which solution is designed for this purpose?","o":["Cloud access security broker (CASB)","Web application firewall (WAF)","Cloud workload protection platform (CWPP)","Network tap"],"a":[0],"e":"Le **CASB** se place entre les utilisateurs et les services cloud : découverte du shadow IT, DLP, contrôle d'accès, chiffrement. Le CWPP protège les *workloads* (VM, conteneurs), le WAF protège *ton* application web.","trap":"CSPM = détection des mauvaises configurations cloud (bucket public, security group trop ouvert). CASB = usage des SaaS.","id":"1-010","d":1},{"t":"d","ref":"1.2","q":"Drag and drop each security system onto the layer where it is deployed.","l":["Next-generation IPS inspecting traffic between VLANs","EDR agent recording process and file activity","WAF blocking SQL injection attempts against a portal","Host-based firewall on a roaming laptop","Static code analysis (SAST) in the build pipeline"],"r":["Network security","Endpoint security","Application security"],"a":[0,1,2,1,2],"e":"Réseau = ce qui voit passer le trafic (NGFW, IPS, NetFlow). Endpoint = ce qui tourne sur l'hôte (AV, EDR, HIDS, pare-feu local). Application = ce qui protège le code et ses entrées (WAF, SAST/DAST, validation des entrées).","id":"1-011","d":1},{"t":"s","ref":"1.3","q":"Which activity is an example of threat hunting?","o":["Responding to a high-severity alert raised by the SIEM","Applying the monthly operating system patches","Proactively searching endpoint telemetry for signs of an attacker that no existing detection has flagged","Subscribing to a commercial feed of malicious IP addresses"],"a":[2],"e":"Le **threat hunting** est **proactif** et guidé par une hypothèse : on part du principe qu'un attaquant est déjà là et qu'il a échappé aux détections. Répondre à une alerte, c'est du monitoring réactif.","trap":"Le feed d'IP malveillantes, c'est de la threat intelligence. Elle *alimente* le hunting mais n'en est pas.","id":"1-012","d":1},{"t":"s","ref":"1.3","q":"A SOC wants to exchange cyber threat intelligence with a partner automatically over HTTPS. Which standard defines the transport mechanism?","o":["STIX","TAXII","CVSS","CybOX"],"a":[1],"e":"**TAXII** = le **transport** (Trusted Automated eXchange of Intelligence Information). **STIX** = le **langage / format** qui décrit la menace. CybOX décrivait les observables (désormais intégré à STIX 2).","trap":"Mnémo : TAXII = le *taxi* qui transporte ; STIX = ce qu'on met *dedans*.","id":"1-013","d":1},{"t":"s","ref":"1.3","q":"What is the purpose of run book automation (RBA)?","o":["To train a model that predicts which alerts are false positives","To automate the documented procedures that analysts follow, so responses are consistent and faster","To rewrite firewall rules based on threat intelligence feeds only","To generate compliance reports for auditors"],"a":[1],"e":"Un **runbook** est la procédure pas à pas d'un analyste. La **RBA** automatise ces étapes (enrichissement, blocage, ticket) : moins d'erreurs humaines, meilleur temps de réponse. C'est la brique que les SOAR industrialisent sous forme de playbooks.","id":"1-014","d":1},{"t":"s","ref":"1.3","q":"Which term describes taking apart a compiled malware sample to understand how it was built and what it is designed to do?","o":["Threat modeling","Fuzzing","Reverse engineering","Threat hunting"],"a":[2],"e":"Le **reverse engineering** consiste à désassembler ou décompiler un binaire pour en comprendre la logique. C'est une technique au service de la **malware analysis** (qui comprend aussi l'analyse dynamique en sandbox).","id":"1-015","d":1},{"t":"s","ref":"1.3","q":"Which statement describes sliding window anomaly detection?","o":["It compares each packet with a database of attack signatures","It evaluates the most recent fixed-size interval of data, which moves forward in time, and flags deviations from the expected behavior","It blocks every source that exceeds a static connection limit","It replays captured traffic in a sandbox"],"a":[1],"e":"La fenêtre glissante analyse un **intervalle récent de taille fixe** (par exemple les 5 dernières minutes) qui avance avec le temps, et compare ce qu'elle voit à la ligne de base. Utile pour repérer un pic, un beaconing ou un scan lent.","id":"1-016","d":1},{"t":"s","ref":"1.3","q":"Which type of threat actor is typically motivated by political or social causes?","o":["Script kiddie","Organized crime group","Hacktivist","Insider"],"a":[2],"e":"**Hacktivist** = cause idéologique (défacement, DDoS, fuite de données). Crime organisé = argent. État-nation / APT = espionnage et sabotage sur la durée. Script kiddie = outils tout faits, peu de compétences. Insider = accès légitime détourné.","id":"1-017","d":1},{"t":"s","ref":"1.3","q":"In the STRIDE threat-modeling method, which threat category is a violation of integrity?","o":["Spoofing","Tampering","Repudiation","Elevation of privilege"],"a":[1],"e":"STRIDE : **S**poofing (authentification), **T**ampering (intégrité), **R**epudiation (non-répudiation), **I**nformation disclosure (confidentialité), **D**enial of service (disponibilité), **E**levation of privilege (autorisation).","trap":"Le **threat modeling** se fait de préférence à la conception : identifier les menaces, les prioriser, décider des contre-mesures avant de construire.","id":"1-018","d":1},{"t":"s","ref":"1.3","q":"Which statement best describes DevSecOps?","o":["A dedicated security team audits the application once, just before release","Security controls and automated tests are integrated into every stage of the CI/CD pipeline, and security is a shared responsibility","Developers are given administrative access to production to fix incidents faster","Operations teams replace the SOC for cloud workloads"],"a":[1],"e":"DevSecOps = « **shift left** » : la sécurité démarre dès la conception et s'automatise dans le pipeline (SAST, DAST, scan de dépendances et d'images, IaC scanning). Tout le monde en est responsable, pas seulement l'équipe sécu.","id":"1-019","d":1},{"t":"s","ref":"1.4","q":"A public web server runs a version of OpenSSL that contains a known flaw, and no patch has been applied. What does this situation represent?","o":["A threat","An exploit","A vulnerability","A risk transfer"],"a":[2],"e":"Une **vulnérabilité** est une **faiblesse** (bug, mauvaise config, absence de patch) qui *peut* être exploitée. Tant que personne ne l'attaque, ce n'est ni une menace ni un exploit.","trap":"Chaîne à retenir : un **threat** utilise un **exploit** contre une **vulnerability**, ce qui crée un **risk** pour un **asset**.","id":"1-020","d":1},{"t":"s","ref":"1.4","q":"A researcher publishes working code that takes advantage of that OpenSSL flaw to read server memory remotely. What is this code?","o":["A vulnerability","An exploit","A threat actor","An attack surface"],"a":[1],"e":"L'**exploit** est le **moyen** (code, technique, séquence de commandes) qui tire parti d'une vulnérabilité.","id":"1-021","d":1},{"t":"s","ref":"1.4","q":"Which definition of risk is correct?","o":["Any weakness in a system or its design","The likelihood that a threat exploits a vulnerability, combined with the resulting impact on the organization","A tool or technique used to take advantage of a weakness","Any potential danger to an asset"],"a":[1],"e":"**Risk = probabilité × impact.** « Potential danger » = threat. « Weakness » = vulnerability. « Tool used to take advantage » = exploit.","id":"1-022","d":1},{"t":"d","ref":"1.4","q":"Drag and drop each decision onto the matching risk management strategy.","l":["The company buys a cyber-insurance policy","A legacy FTP service is decommissioned because it is too dangerous to keep","MFA and network segmentation are deployed","Management signs off on a low-impact risk without further action"],"r":["Risk transfer (sharing)","Risk avoidance","Risk reduction (mitigation)","Risk acceptance (retention)"],"a":[0,1,2,3],"e":"Quatre réponses au risque : **avoid** (on arrête l'activité), **reduce / mitigate** (on ajoute des contrôles), **transfer / share** (assurance, sous-traitance), **accept / retain** (on assume, en le documentant).","trap":"Le risque ne tombe jamais à zéro : ce qui reste après les contrôles est le *residual risk*.","id":"1-023","d":1},{"t":"s","ref":"1.4","q":"What is the purpose of risk scoring (risk weighting) in a risk assessment?","o":["To eliminate every identified risk","To assign comparable values to risks so that treatment can be prioritized","To calculate the CVSS base score of each asset","To replace the asset inventory"],"a":[1],"e":"On attribue un score (probabilité × impact, pondéré par la valeur de l'actif) pour **prioriser**. Le *risk assessment* identifie et évalue ; la *risk reduction* applique les contrôles.","id":"1-024","d":1},{"t":"s","ref":"1.5","q":"Which statement describes the defense-in-depth strategy?","o":["A single next-generation firewall inspects all traffic at the perimeter","Several independent layers of controls are combined so that the failure of one layer does not expose the asset","All security functions are consolidated on one appliance to simplify management","Every internal user is trusted once authenticated at the edge"],"a":[1],"e":"Défense en profondeur = **couches indépendantes et complémentaires** : physique, périmètre, réseau interne, hôte, application, données, plus l'administratif (politiques, sensibilisation).","id":"1-025","d":1},{"t":"s","ref":"1.5","q":"Why is the 'security artichoke' analogy preferred to the 'security onion' for today's borderless networks?","o":["Because every layer must be removed before the attacker reaches the data","Because an attacker may only need to remove certain leaves to reach sensitive data, and each leaf can itself expose information","Because the perimeter firewall is the only layer that matters","Because artichoke layers represent encryption algorithms"],"a":[1],"e":"Analogie NetAcad. **Oignon** : l'attaquant doit peler chaque couche. **Artichaut** : avec le cloud, la mobilité et le BYOD, il n'a pas besoin de tout enlever ; quelques « feuilles » (terminaux mobiles, comptes SaaS) suffisent pour s'approcher du cœur.","id":"1-026","d":1},{"t":"s","ref":"1.6","q":"A user creates a spreadsheet on a file share and decides to grant a coworker read access to it. Which access control model is being used?","o":["Mandatory access control","Discretionary access control","Attribute-based access control","Rule-based access control"],"a":[1],"e":"**DAC** : c'est le **propriétaire** de la ressource qui décide qui y accède (ACL NTFS, permissions Unix). Le moins restrictif des modèles.","id":"1-027","d":1},{"t":"s","ref":"1.6","q":"In which model are access decisions made by comparing the sensitivity label of the object with the clearance level of the subject, without any possibility for users to override them?","o":["Discretionary access control","Role-based access control","Mandatory access control","Time-based access control"],"a":[2],"e":"**MAC** : labels (Confidential, Secret, Top Secret) + habilitations, imposés par le système. Modèle le plus strict, typique du militaire et du gouvernemental (exemple technique : SELinux).","trap":"Mots-clés MAC à l'exam : *labels*, *clearance*, *strictest*, *military*.","id":"1-028","d":1},{"t":"s","ref":"1.6","q":"Permissions are assigned to the job function 'HR-Manager', and employees receive them by becoming members of that function. Which model is this?","o":["Rule-based access control","Role-based access control","Discretionary access control","Attribute-based access control"],"a":[1],"e":"**Role-based** : les droits suivent la **fonction**. Cisco le classe comme une forme de contrôle d'accès **non discrétionnaire**.","trap":"Attention au sigle : RBAC peut vouloir dire *Role*-based ou *Rule*-based. Lis le mot complet dans la question.","id":"1-029","d":1},{"t":"s","ref":"1.6","q":"A policy grants access only if the user belongs to the finance department, uses a compliant corporate device, and connects from the headquarters network. Which access control model is described?","o":["Role-based access control","Mandatory access control","Attribute-based access control","Discretionary access control"],"a":[2],"e":"**ABAC** : la décision combine des **attributs** du sujet (département), de l'objet, de l'action et de l'**environnement** (appareil, lieu, heure). C'est le plus granulaire.","id":"1-030","d":1},{"t":"d","ref":"1.6","q":"Drag and drop each scenario onto the access control model it illustrates.","l":["A firewall permits a packet only if it matches a configured ACL entry","Contractor accounts can log in only on weekdays between 08:00 and 18:00","The owner of a folder shares it with a colleague","Documents labeled SECRET are readable only by users cleared for SECRET","Members of the 'Helpdesk' group can reset passwords"],"r":["Rule-based","Time-based","Discretionary (DAC)","Mandatory (MAC)","Role-based"],"a":[0,1,2,3,4],"e":"Rule-based = conditions IF/THEN identiques pour tous (ACL). Time-based = l'heure ou le jour conditionne l'accès. DAC = le propriétaire décide. MAC = labels et habilitations. Role-based = la fonction décide.","id":"1-031","d":1},{"t":"s","ref":"1.6","q":"Which component of AAA records what a user did and how long the session lasted?","o":["Authentication","Authorization","Accounting","Attribution"],"a":[2],"e":"**Authentication** = qui es-tu ? **Authorization** = qu'as-tu le droit de faire ? **Accounting** = qu'as-tu fait, quand, combien de temps ? (traçabilité, facturation, audit).","id":"1-032","d":1},{"t":"s","ref":"1.6","q":"Which statement correctly compares TACACS+ with RADIUS?","o":["TACACS+ uses UDP and encrypts only the password","RADIUS separates authentication, authorization and accounting into independent processes","TACACS+ uses TCP port 49 and encrypts the entire body of the packet","RADIUS is Cisco proprietary and cannot be used with other vendors"],"a":[2],"e":"**TACACS+** : TCP 49, chiffre **tout le payload**, sépare les trois A (idéal pour l'administration d'équipements, autorisation par commande). **RADIUS** : UDP 1812/1813, ne chiffre que le **mot de passe**, combine authentification et autorisation (standard ouvert, idéal pour 802.1X et VPN).","id":"1-033","d":1},{"t":"s","ref":"1.6","q":"Which statement describes nondiscretionary access control?","o":["Each resource owner decides who may access the resource","Access decisions are enforced centrally according to organizational policy, for example based on roles, not at the owner's discretion","Access is granted to any authenticated user","Access depends only on the time of day"],"a":[1],"e":"Non discrétionnaire = **l'inverse de DAC** : ce n'est pas le propriétaire qui décide, c'est une politique centrale (rôles, règles). Le role-based en est l'exemple type.","id":"1-034","d":1},{"t":"s","ref":"1.7","q":"Which CVSS v3.1 base metric reflects whether the attacker must already hold an account with certain rights on the vulnerable system?","o":["Attack complexity","Privileges required","User interaction","Scope"],"a":[1],"e":"**Privileges Required (PR)** : None / Low / High. *User Interaction* concerne une **autre** personne que l'attaquant (la victime qui clique). *Attack Complexity* = conditions hors du contrôle de l'attaquant.","id":"1-035","d":1},{"t":"s","ref":"1.7","q":"A vulnerability can only be exploited from the same Bluetooth range or the same broadcast domain as the target. Which Attack Vector value applies?","o":["Network","Adjacent","Local","Physical"],"a":[1],"e":"Attack Vector : **Network** (exploitable à travers un routeur, à distance), **Adjacent** (même segment : LAN, Bluetooth, Wi-Fi), **Local** (accès local ou session sur la machine), **Physical** (toucher le matériel). Plus c'est distant, plus le score monte.","id":"1-036","d":1},{"t":"s","ref":"1.7","q":"In CVSS v3.1, what does the value 'Changed' for the Scope metric indicate?","o":["The vendor changed the severity after publishing a patch","A successful exploit can affect resources beyond the security authority of the vulnerable component","The exploit code changed from proof-of-concept to functional","The attack vector changed from local to network"],"a":[1],"e":"**Scope: Changed** = l'impact **déborde** du composant vulnérable (exemple : évasion d'une VM vers l'hyperviseur, XSS qui touche le navigateur de la victime). Cela augmente le score.","trap":"L'exam repose sur CVSS **v3.x** (Scope, Temporal, Environmental sont dans le blueprint). CVSS v4.0 a supprimé Scope et renommé Temporal en *Threat* : ne te laisse pas perturber si tu l'as vu ailleurs.","id":"1-037","d":1},{"t":"m","ref":"1.7","q":"Which two metrics belong to the CVSS v3.1 Temporal metric group? (Choose two.)","o":["Exploit Code Maturity","Attack Complexity","Remediation Level","Confidentiality Requirement","User Interaction"],"a":[0,2],"e":"Groupe **Temporal** (évolue dans le temps) : **Exploit Code Maturity**, **Remediation Level**, **Report Confidence**. Attack Complexity et User Interaction sont des métriques *Base*. Confidentiality Requirement est *Environmental*.","id":"1-038","d":1},{"t":"s","ref":"1.7","q":"Which CVSS metric group allows an organization to adjust a score according to the importance of the affected asset in its own environment?","o":["Base","Temporal","Environmental","Exploitability"],"a":[2],"e":"**Environmental** = propre à **ton** organisation : Security Requirements (CR, IR, AR) et métriques Base modifiées. **Base** = caractéristiques intrinsèques, constantes. **Temporal** = ce qui change avec le temps (exploit disponible, patch publié).","id":"1-039","d":1},{"t":"s","ref":"1.7","q":"A vulnerability receives a CVSS v3.1 base score of 9.1. Which qualitative severity rating applies?","o":["High","Critical","Severe","Medium"],"a":[1],"e":"Échelle v3.x : 0.0 None, 0.1-3.9 Low, 4.0-6.9 Medium, 7.0-8.9 High, **9.0-10.0 Critical**. « Severe » n'existe pas dans CVSS.","id":"1-040","d":1},{"t":"s","ref":"1.7","q":"An exploit works only if a victim opens a malicious PDF attachment. Which CVSS base metric captures this condition?","o":["Attack Vector: Local","Privileges Required: Low","User Interaction: Required","Attack Complexity: High"],"a":[2],"e":"**User Interaction: Required** = un utilisateur autre que l'attaquant doit faire une action (ouvrir, cliquer). Cela *baisse* légèrement le score par rapport à None.","id":"1-041","d":1},{"t":"s","ref":"1.8","q":"After a web application migrates from HTTP to HTTPS with TLS 1.3, the network IDS no longer raises any signature for that application. What is the most likely reason?","o":["The IDS signatures expired","TLS 1.3 disables the TCP three-way handshake","The payload is encrypted, so the sensor cannot inspect the content without decryption","HTTPS traffic cannot be mirrored to a SPAN port"],"a":[2],"e":"Le chiffrement est le **premier ennemi de la visibilité réseau** : l'IDS voit les IP, les ports, la taille et le timing, mais plus le contenu. Solutions : déchiffrement TLS sur un proxy ou un NGFW, ou déplacer la détection sur l'endpoint.","id":"1-042","d":1},{"t":"s","ref":"1.8","q":"Which challenge is specific to threat detection for workloads hosted in a public cloud?","o":["Cloud workloads cannot generate logs","The customer has no direct access to the provider's underlying network and must rely on the telemetry and APIs the provider exposes","NetFlow cannot describe TCP traffic in the cloud","Cloud providers forbid the use of encryption between instances"],"a":[1],"e":"Dans le cloud, pas de tap physique ni de SPAN sur l'infrastructure du fournisseur : on dépend des **flow logs, journaux d'API et services natifs**. S'ajoutent la nature éphémère des workloads et le modèle de responsabilité partagée.","id":"1-043","d":1},{"t":"s","ref":"1.9","q":"Which traffic profile most strongly suggests possible data exfiltration?","o":["A file server receives backup traffic from internal hosts every night at 01:00","A workstation that normally downloads far more than it uploads sends several gigabytes to an unknown external host at 03:00","DNS queries for the company's own domain increase at 09:00 on Monday","A web server answers many short HTTPS requests during a marketing campaign"],"a":[1],"e":"On raisonne par **écart à la ligne de base** : inversion du ratio upload/download, heure inhabituelle, destination inconnue, gros volume sortant. Les trois autres profils s'expliquent par une activité normale.","id":"1-044","d":1},{"t":"s","ref":"1.9","q":"Which observation is a common indicator of data exfiltration through DNS tunneling?","o":["DNS responses with a TTL of 86400 seconds","A high volume of queries with long, random-looking subdomain labels sent to a single external domain","Queries for A records of well-known websites","Zone transfers between the internal primary and secondary DNS servers"],"a":[1],"e":"Le tunnel DNS encode les données dans les **sous-domaines** (longs, à forte entropie) ou dans des enregistrements **TXT**, vers un domaine contrôlé par l'attaquant. Signes : volume anormal, labels très longs, beaucoup de requêtes TXT ou NULL.","id":"1-045","d":1},{"t":"m","ref":"1.10","q":"Which two fields are part of the 5-tuple used to identify a network flow? (Choose two.)","o":["Source MAC address","Destination port","TTL","Transport protocol","TCP sequence number"],"a":[1,3],"e":"Le 5-tuple = **IP source, IP destination, port source, port destination, protocole** (TCP, UDP, ICMP). C'est la clé commune qui permet de recouper firewall, NetFlow, IDS et proxy.","id":"1-046","d":1},{"t":"s","ref":"1.10","q":"Refer to the exhibit. An analyst groups firewall logs by 5-tuple. Which internal host is most likely compromised?","o":["10.1.1.23","10.1.1.57","10.1.1.80","203.0.113.50"],"a":[1],"e":"**10.1.1.57** contacte la même IP et le même port externes **toutes les 5 minutes pile**, avec un port source éphémère qui change : c'est la signature d'un **beaconing C2**. Les autres flux sont ponctuels, vers du HTTPS classique.","trap":"Le port source change à chaque connexion, c'est normal. Ce qui trahit : destination fixe + périodicité régulière.","x":"10:00:01  10.1.1.23:49811  ->  203.0.113.50:443    TCP  allowed\n10:00:03  10.1.1.57:51514  ->  198.51.100.7:8443   TCP  allowed\n10:05:03  10.1.1.57:51533  ->  198.51.100.7:8443   TCP  allowed\n10:10:03  10.1.1.57:51560  ->  198.51.100.7:8443   TCP  allowed\n10:12:40  10.1.1.80:50212  ->  203.0.113.50:443    TCP  allowed\n10:15:03  10.1.1.57:51588  ->  198.51.100.7:8443   TCP  allowed","id":"1-047","d":1},{"t":"s","ref":"1.11","q":"Which statement describes rule-based detection?","o":["It builds a baseline of normal activity and alerts on deviations","It matches activity against predefined signatures or IF/THEN conditions that describe known malicious behavior","It uses the mean and standard deviation of traffic volumes to find outliers","It can only be deployed on endpoints"],"a":[1],"e":"**Rule-based (signature)** : ce qui est *connu comme mauvais* est décrit à l'avance. Très peu de faux positifs sur le connu, mais **aveugle à l'inconnu** (zero-day).","id":"1-048","d":1},{"t":"s","ref":"1.11","q":"What is an advantage of behavioral detection over rule-based detection?","o":["It never produces false positives","It does not need any learning period","It can reveal previously unknown attacks because it flags deviations from a learned baseline of normal activity","It requires fewer computing resources"],"a":[2],"e":"**Behavioral** : on apprend le *normal*, on alerte sur l'*anormal*. Avantage : détecte les zero-day et les insiders. Inconvénients : période d'apprentissage, plus de **faux positifs**, et une baseline apprise pendant une compromission est polluée.","id":"1-049","d":1},{"t":"s","ref":"1.11","q":"A detection engine models the number of outbound connections per host over time and raises an alert when a value lies several standard deviations away from the mean. Which approach is this?","o":["Rule-based detection","Signature-based detection","Statistical detection","Reputation-based detection"],"a":[2],"e":"**Statistical** = modèle **mathématique** (moyenne, écart-type, distribution) appliqué à des compteurs. Proche du comportemental, mais le mot-clé de l'exam est la notion de mesure statistique et de seuil calculé.","id":"1-050","d":1},{"t":"s","ref":"2.1","q":"Which statement describes the attack surface of an organization?","o":["A specific flaw in one software component","The total sum of the points where an attacker could try to enter a system or extract data from it","The list of threat actors interested in the organization","The set of exploits available for a given CVE"],"a":[1],"e":"**Attack surface** = l'ensemble des **points d'exposition** : ports ouverts, services, API, comptes, équipements, humains, accès physiques. Une **vulnerability** est une faiblesse précise *dans* l'un de ces points.","id":"2-001","d":2},{"t":"s","ref":"2.1","q":"An administrator disables unused services and closes unnecessary ports on a server. What is the primary effect of this action?","o":["It patches the vulnerabilities of the remaining services","It reduces the attack surface","It transfers the risk to the vendor","It increases the CVSS score of the server"],"a":[1],"e":"Moins de services exposés = **surface d'attaque réduite** (hardening). Ça ne corrige aucune vulnérabilité dans les services restants : ce sont deux notions distinctes.","id":"2-002","d":2},{"t":"s","ref":"2.1","q":"A developer exposes an administrative API to the internet. The API has no known flaw. Later, a buffer overflow is discovered in its parser. How should these two facts be classified?","o":["Both are vulnerabilities","Both only increase the attack surface","The exposure increases the attack surface; the buffer overflow is a vulnerability","The exposure is an exploit; the buffer overflow is a threat"],"a":[2],"e":"Exposer une interface = **plus de surface**. Le bug dans le parser = **vulnérabilité**. Une surface large augmente la probabilité qu'une vulnérabilité soit atteignable.","id":"2-003","d":2},{"t":"s","ref":"2.2","q":"Which type of data does tcpdump provide to a security analyst?","o":["Summarized flow records without payload","Full packet captures that include headers and payload","Application names identified by NBAR2","Correlated alerts from several sensors"],"a":[1],"e":"**tcpdump** (comme Wireshark) capture les **paquets complets**, en général dans un fichier pcap. C'est la donnée la plus riche, et la plus lourde à stocker.","id":"2-004","d":2},{"t":"s","ref":"2.2","q":"Which information is available in a NetFlow record?","o":["The HTTP request body","The content of email attachments","Source and destination IP addresses, ports, protocol, and packet and byte counts for the flow","The decrypted TLS payload"],"a":[2],"e":"NetFlow = **métadonnées de flux** : qui parle à qui, quand, sur quels ports, combien de paquets et d'octets, interface d'entrée, ToS. **Jamais le contenu.**","trap":"Retiens la formule : NetFlow, c'est la **facture téléphonique** (qui, quand, combien de temps) ; la capture complète, c'est l'**enregistrement de l'appel**.","id":"2-005","d":2},{"t":"s","ref":"2.2","q":"Compared with a traditional stateful firewall, which additional data can a next-generation firewall provide?","o":["The state of each TCP connection","NAT translation entries","Application identity, user identity, URL categories and intrusion events","Permit and deny decisions based on the 5-tuple"],"a":[2],"e":"Le **stateful classique** journalise des décisions L3/L4 (5-tuple, état de connexion, NAT). Le **NGFW** ajoute la couche 7 : application, utilisateur, URL, IPS, fichiers et malware.","id":"2-006","d":2},{"t":"s","ref":"2.2","q":"Which data is produced by Cisco Application Visibility and Control (AVC)?","o":["Hashes of files stored on endpoints","The applications in use on the network and the bandwidth each one consumes, identified regardless of port number","The list of CVEs affecting each server","Windows security event logs"],"a":[1],"e":"**AVC** s'appuie sur **NBAR2** pour reconnaître les applications par inspection (pas seulement par port), puis mesure et contrôle leur usage : noms d'applications, volumes, temps de réponse.","id":"2-007","d":2},{"t":"s","ref":"2.2","q":"Which data would an analyst expect from a web content filtering solution?","o":["SMTP envelope sender and recipient","Requested URLs with their category and reputation, the user or source IP, and whether each request was allowed or blocked","TCP sequence numbers of each session","Registry keys changed on the client"],"a":[1],"e":"Filtrage web (proxy, Umbrella, Secure Web Appliance) = **URL, catégorie, réputation, utilisateur, action**. Utile pour retracer qui a cliqué sur un lien de phishing et si la requête est passée.","id":"2-008","d":2},{"t":"s","ref":"2.2","q":"An analyst investigates a phishing campaign. Which technology provides the sender address, the recipients, the attachment verdicts and the malicious URLs found in the messages?","o":["NetFlow collector","Traditional stateful firewall","Email content filtering","Application visibility and control"],"a":[2],"e":"La passerelle de **filtrage mail** journalise expéditeur, destinataires, verdicts antispam et antimalware, pièces jointes et URL réécrites ou bloquées. C'est la source n°1 pour mesurer l'étendue d'un phishing.","id":"2-009","d":2},{"t":"d","ref":"2.2","q":"Drag and drop each tool onto the type of security data it primarily generates.","l":["Snort or Suricata","tcpdump or Wireshark","NetFlow exporter with nfdump","Zeek http.log and dns.log"],"r":["Alert data","Full packet capture","Session (flow) data","Transaction data"],"a":[0,1,2,3],"e":"Snort et Suricata → **alertes**. tcpdump et Wireshark → **paquets complets**. NetFlow → **flux et sessions**. Zeek (ex-Bro) produit des journaux par protocole : conn.log = session, http.log et dns.log = **transactions**.","trap":"Dans le blueprint (4.1.f, 4.5), Cisco écrit « transaction data (NetFlow) ». Si une question associe NetFlow à *transactional data*, ne la rejette pas : l'idée testée est « métadonnées sans payload ».","id":"2-010","d":2},{"t":"s","ref":"2.3","q":"An analyst sees in the internet-facing firewall logs that the public address 198.51.100.10 contacted a known C2 server. Thousands of internal hosts share this address. Which technology makes it difficult to identify the infected host?","o":["Load balancing","NAT/PAT","An access control list","P2P networking"],"a":[1],"e":"Le **PAT** masque toutes les IP internes derrière une seule IP publique. Pour remonter à l'hôte, il faut les **logs de traduction NAT** (IP interne, port traduit, horodatage) ou une capture côté *inside*.","id":"2-011","d":2},{"t":"s","ref":"2.3","q":"An internal host uses the Tor browser. What can a network monitoring sensor at the internet edge observe?","o":["The final website visited and the full URL","The decrypted content, because Tor only hides IP addresses","Only an encrypted connection from the host to a Tor entry (guard) node","Nothing at all, because Tor does not use IP"],"a":[2],"e":"Tor = **routage en oignon** : plusieurs relais, plusieurs couches de chiffrement. Le capteur ne voit que la connexion chiffrée vers le **nœud d'entrée**. La destination réelle et le contenu sont masqués. On détecte Tor via les listes de nœuds connus.","id":"2-012","d":2},{"t":"s","ref":"2.3","q":"How does tunneling reduce data visibility for security monitoring?","o":["It fragments packets so that they cannot be captured","It encapsulates one protocol inside another, so devices inspecting only the outer protocol miss the real traffic","It removes the IP header from the packet","It forces all traffic to use UDP"],"a":[1],"e":"Tunnel = un protocole **caché dans un autre** (DNS, ICMP, HTTP, GRE, SSH, IPsec). Si le contrôle ne regarde que l'enveloppe (« c'est du DNS, je laisse passer »), le trafic réel passe inaperçu.","id":"2-013","d":2},{"t":"s","ref":"2.3","q":"Web servers sit behind a load balancer that uses source NAT. What is the impact on the web server logs?","o":["The logs no longer contain timestamps","Every request appears to come from the load balancer address unless the original client IP is passed in a header such as X-Forwarded-For","The logs show the MAC address of the client instead of its IP","TLS can no longer be used"],"a":[1],"e":"Avec un load balancer (ou un reverse proxy), l'IP vue par le serveur est souvent celle du **LB**. Sans **X-Forwarded-For** ou le PROXY protocol, l'attribution est perdue. Autre effet : une même session peut être répartie sur plusieurs serveurs, donc les traces sont dispersées.","id":"2-014","d":2},{"t":"s","ref":"2.3","q":"Why can an access control list reduce the visibility of a monitoring sensor placed behind it?","o":["ACLs encrypt the traffic they permit","ACLs rewrite source addresses","Traffic dropped by the ACL never reaches the sensor, so the sensor has no record of the blocked attempts","ACLs convert TCP traffic to UDP"],"a":[2],"e":"Un capteur placé **derrière** un filtre ne voit que ce qui a été autorisé : les tentatives bloquées (scans, exploits ratés) ne sont visibles que dans les **logs de l'ACL ou du firewall**, s'ils sont activés.","id":"2-015","d":2},{"t":"s","ref":"2.3","q":"Why is peer-to-peer (P2P) traffic a concern for security monitoring?","o":["It always uses TCP port 21","It is decentralized, often uses dynamic ports and encryption, and can bypass controls, which makes it hard to filter and attribute","It can only be used inside a LAN","It prevents NetFlow from exporting records"],"a":[1],"e":"P2P = pas de serveur central, **ports dynamiques**, souvent chiffré, nombreux pairs. Risques : fuite de données, malware, et botnets P2P sans C2 central à bloquer.","id":"2-016","d":2},{"t":"d","ref":"2.3","q":"Drag and drop each technology onto its main impact on data visibility.","l":["Encryption (TLS, IPsec)","NAT/PAT","Tunneling / encapsulation","Load balancing"],"r":["Payload cannot be inspected; only metadata remains","Real internal source address is hidden","Real protocol is hidden inside another protocol","One client's traffic is spread over several servers or paths"],"a":[0,1,2,3],"e":"Quatre effets à savoir associer : **chiffrement** → plus de contenu ; **NAT/PAT** → plus d'IP réelle ; **tunnel / encapsulation** → protocole réel masqué ; **load balancing** → traces dispersées, IP du LB dans les logs.","id":"2-017","d":2},{"t":"s","ref":"2.4","q":"An analyst must reconstruct the exact file that was transferred during a suspicious session. Which data type is required?","o":["Session data","Statistical data","Full packet capture","Alert data"],"a":[2],"e":"Seule la **capture complète** contient le **payload**, donc le fichier. Session data dit *qu'il y a eu* un transfert (volumes, durée), pas *quoi*.","id":"2-018","d":2},{"t":"s","ref":"2.4","q":"Which data type summarizes a conversation between two endpoints with the 5-tuple, the start and end times, and the number of bytes exchanged?","o":["Transaction data","Session data","Alert data","Full packet capture"],"a":[1],"e":"**Session data** = le résumé d'une conversation (conn.log de Zeek, enregistrements de flux). Compact, conservable longtemps, idéal pour savoir *qui a parlé à qui*.","id":"2-019","d":2},{"t":"s","ref":"2.4","q":"A proxy log entry shows the HTTP GET request sent by a client and the 200 status code returned by the server. Which data type is this?","o":["Statistical data","Session data","Transaction data","Metadata"],"a":[2],"e":"**Transaction data** = les **requêtes et réponses échangées à l'intérieur d'une session** (HTTP GET / 200, requête DNS et réponse, commande SMTP). Un cran plus détaillé que la session, sans aller jusqu'au paquet complet.","id":"2-020","d":2},{"t":"s","ref":"2.4","q":"Which data type is created by analyzing other network data to establish baselines and highlight deviations?","o":["Alert data","Statistical data","Full packet capture","Transaction data"],"a":[1],"e":"**Statistical data** = données **dérivées** : moyennes, tendances, top talkers, écarts à la baseline. C'est la matière première de la détection d'anomalies.","id":"2-021","d":2},{"t":"s","ref":"2.4","q":"An IPS compares traffic with its rule set and generates a record when a rule matches. Which data type is produced?","o":["Session data","Metadata","Alert data","Statistical data"],"a":[2],"e":"**Alert data** = le résultat d'un IDS/IPS quand une règle matche. C'est un jugement (« ceci ressemble à X »), à valider avec les autres types de données.","id":"2-022","d":2},{"t":"s","ref":"2.4","q":"Which item is an example of metadata used in security monitoring?","o":["The raw bytes of a downloaded executable","The geolocation and reputation score associated with an IP address","A Snort alert","The complete TCP stream of a session"],"a":[1],"e":"**Metadata** = des **données sur les données** : géolocalisation, réputation, ASN, date d'enregistrement d'un domaine, champs d'un certificat. Elles enrichissent un événement sans en être le contenu.","id":"2-023","d":2},{"t":"s","ref":"2.5","q":"A server receives a very large number of TCP SYN segments from spoofed addresses and never receives the final ACK of the handshake. Which attack is in progress?","o":["Smurf attack","SYN flood","Session hijacking","DNS amplification"],"a":[1],"e":"**SYN flood** : la table des connexions **half-open** se remplit, le serveur ne peut plus accepter de clients. C'est une attaque DoS **protocol-based** (elle abuse du handshake TCP). Parades : SYN cookies, limites de connexions, protection anti-DDoS.","id":"2-024","d":2},{"t":"s","ref":"2.5","q":"In a DNS amplification attack, which address does the attacker place in the source field of the queries sent to open resolvers?","o":["The attacker's own address","The address of the open resolver","The victim's address","A broadcast address"],"a":[2],"e":"Attaque par **réflexion + amplification** : requêtes courtes avec l'IP source **usurpée de la victime**, réponses volumineuses envoyées à la victime. Possible parce qu'UDP est sans connexion. Même principe avec NTP et memcached.","id":"2-025","d":2},{"t":"s","ref":"2.5","q":"An attacker on the LAN sends forged ARP replies that associate the default gateway's IP address with the attacker's MAC address. What is the goal?","o":["To exhaust the DHCP address pool","To overflow the CAM table of the switch","To place the attacker in the traffic path as a man-in-the-middle","To amplify a DDoS attack"],"a":[2],"e":"**ARP spoofing / poisoning** : ARP n'a aucune authentification. Les victimes envoient leur trafic à l'attaquant, qui le relaie (MITM) ou le jette (DoS). Parade sur Cisco : **Dynamic ARP Inspection** adossé au DHCP snooping.","id":"2-026","d":2},{"t":"s","ref":"2.5","q":"An attacker floods a switch with frames that carry thousands of random source MAC addresses. What is the expected result?","o":["The switch disables all its trunk ports","The CAM table fills up and the switch floods frames out of all ports, which allows the attacker to sniff traffic","The DHCP server runs out of addresses","The root bridge of the spanning tree changes"],"a":[1],"e":"**MAC flooding (CAM table overflow)** : table pleine, le switch se comporte comme un hub pour les nouvelles adresses, donc l'attaquant peut écouter. Parade : **port security**.","trap":"À ne pas confondre avec le **DHCP starvation**, qui épuise le *pool DHCP* avec de fausses requêtes
